   <g id="text_1">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(16.857422 76.904071)">nine observations: q, load,</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(19.798594 85.904071)">power, thermal, network,</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(31.450781 94.904071)">drift, stale, security,</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(60.2775 104.775946)">conflict</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(215.295469 82.275946)">blend</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(175.210312 90.746493)">x ← (1 − a)x + a·x[obs]</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(205.608516 100.196493)">a = 0.339</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(355.039453 82.196493)">THE ENGINE</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(335.790703 90.265555)">one macro step, RK4</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(332.271563 100.440477)">x = (E, U, I[U], S, B, Ḃ)</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(336.154219 197.016805)">the control law, read</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(317.599453 205.604071)">u = clip(−f[U] + K[P](σ − U))</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(355.05 214.604071)">push = u/25</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(176.324062 192.896493)">THE NERVOUS SYSTEM</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(178.331484 201.104071)">authority to give back</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(172.567266 210.104071)">only if push ≤ release, U</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(212.531484 218.844618)">≥ gate</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(25.849687 196.604071)">to the compass law on</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(24.553828 205.604071)">every muscle: the gate</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(48.257578 214.604071)">open or held</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #0b1f3a" x="382.68" y="13.904071" transform="rotate(-0 382.68 13.904071)">the state persists decision to decision</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(8.28 255.104071)">The engine is the body's physiology; it grants the authority and feeds the release gate. The</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(8.28 264.104071)">compass law is the hand on each lever; u is evaluated and never applied to a knob. Every</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(8.28 273.104071)">line of this chain is in the audit record of every decision.</text>
   </g>
  </g>
 </g>
