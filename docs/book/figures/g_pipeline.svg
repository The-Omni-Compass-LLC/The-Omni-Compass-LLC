   <g id="text_1">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(25.605703 33.263437)">audit.jsonl: one record a</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(27.672187 42.676172)">decision: senses, state,</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(40.336875 51.263437)">force, gate, write,</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(57.827812 61.135312)">read-back</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(185.841562 28.638281)">tools/live_reps.py: the</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(177.702891 37.763437)">paired receipt of one run:</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(174.3975 46.763437)">every gauge, native, omni,</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(190.052578 55.763437)">the change, its 95%</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(217.92375 65.635312)">interval</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(330.624844 28.638281)">tools/confirm_abc.py: runs</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(338.323359 38.176172)">A, B, C → the three-run</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(331.460156 46.763437)">table; the engine of every</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(335.427891 55.763437)">run checked against the</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(366.145312 64.763437)">fingerprint</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(26.203359 148.463437)">tools/readings.py: GAIN,</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(32.556797 157.463437)">STEADY, LOSS by the</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(23.931562 166.463437)">gauge's aim; the reading</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(23.821875 175.463437)">key on top of every table</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(177.837187 143.838281)">docs/BENEFIT_SHEET.md,</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(179.849531 152.838281)">results/OMNI_INDEX.md:</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(198.807187 161.963437)">one number per</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(178.638047 171.376172)">benchmark, its word; the</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(204.613594 180.835312)">index over all</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(4.68 224.063437)">Every table is made by a tool, never by hand; raw records keep their recorded values, every</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(4.68 233.063437)">page that shows them uses the words. A reader can follow one run from its audit line to its</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(4.68 242.935312)">row in the benefit sheet.</text>
   </g>
  </g>
