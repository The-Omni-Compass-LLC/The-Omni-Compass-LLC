   <g id="text_1">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(28.418906 117.835312)">the band: the mean</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(19.013906 125.963437)">response of the last 5 s,</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(20.250703 135.481641)">from SLO/10 to the SLO</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(186.451875 112.800937)">race? (≥ 95%</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(162.023906 121.463437)">utilization) steady under</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(171.000703 131.335312)">the limit? otherwise:</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(206.222344 138.564141)">pace</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(326.214141 30.563437)">UP WIRE: the clock ceiling.</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(326.387109 39.563437)">+15 MHz steps toward the</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(337.516172 48.563437)">top; a step down only</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(326.955938 57.563437)">through the verdict; never</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(339.150938 66.563437)">under the busy clock</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(319.850859 185.363437)">DOWN WIRE: the power limit,</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(331.309688 194.363437)">the lid. ⌈1.10 × the busy</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(325.425234 203.705859)">draw⌉, never over the start</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(337.194141 212.776172)">limit, never under the</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(353.976328 221.363437)">envelope floor</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b1f3a" x="145.08" y="113.260781" transform="rotate(-0 145.08 113.260781)">F</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(324.865547 306.835312)">THE CARD: its boost climbs</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(332.563359 314.963437)">to the ceiling; its limiter</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(336.965625 324.835312)">knocks back at the lid</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #2e6b3a" transform="translate(80.28 319.463437)">the meters: utilization, draw, temperature,</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #2e6b3a" transform="translate(80.28 328.463437)">clocks, p95 (every 2 s)</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(4.68 368.063437)">Race: both wires to full at once while work waits. Steady under the limit: the card's own busy</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(4.68 377.063437)">clock as the ceiling, no knock-backs. Fail up on a breach, a failed request, a blind feed or a</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(4.68 386.063437)">heat slowdown. A limit set by another hand: observe only from then on.</text>
   </g>
  </g>
 </g>
