   <g id="text_1">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(234.639141 25.775859)">THE GOVERNOR</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(230.372578 33.983437)">the compass law ·</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(235.040625 43.855312)">the verdict · the</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(226.406953 51.983437)">give-back rule · one</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(232.576172 60.983437)">decision a period</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="105.48" y="18.143437" transform="rotate(-0 105.48 18.143437)">S1 tracking error, per drone</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="105.48" y="49.975312" transform="rotate(-0 105.48 49.975312)">S2 distance to the nearest drone</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(383.167266 27.156797)">AUDIT</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(362.399063 35.423437)">audit.jsonl: one</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(357.106641 44.836172)">record a decision,</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(360.645469 53.423437)">every write with</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(358.379297 63.295312)">its reason and its</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(374.627813 72.295312)">read-back</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #2e6b3a" transform="translate(22.68 65.303437)">the wire in: every meter read live</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #2e6b3a" transform="translate(22.68 74.303437)">from the system, never a number</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #2e6b3a" transform="translate(22.68 84.175312)">written in code</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b1f3a" x="278.28" y="81.220781" transform="rotate(-0 278.28 81.220781)">M1</text>
   </g>
