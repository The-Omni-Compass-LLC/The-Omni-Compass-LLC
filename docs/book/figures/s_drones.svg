   <g id="text_7">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #8a1f1f" transform="translate(289.08 113.003437)">the kill switch: open, every</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #8a1f1f" transform="translate(289.08 122.003437)">setting handed back at once; for</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #8a1f1f" transform="translate(289.08 131.003437)">security only</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(62.580234 162.863437)">THE PLUG, the wire out: the system's own command, written and read back</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(166.703906 171.863437)">M1 cruise override, per drone</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(65.133281 180.863437)">gym-pybullet-drones: the shipped position controller on the planner's path</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(34.870781 189.863437)">the carrot's speed as a fraction of the planner's cruise, moved by at most 0.01 a control</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(225.185625 199.735312)">tick</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(72.150469 207.863437)">snapshot once at attach; every setting restored to it on stop, read back</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(71.902969 268.055859)">NATIVE CONTROLLER</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(34.614844 276.263437)">the autopilot's own position controller</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(71.600625 285.263437)">on the planner's path</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b1f3a" x="128.88" y="244.195312" transform="rotate(-0 128.88 244.195312)">write · read back</text>
   </g>
   <g id="text_11">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b1f3a" x="323.28" y="339.235312" transform="rotate(-0 323.28 339.235312)">the cruise override of one drone</text>
   </g>
   <g id="text_12">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b1f3a" x="229.68" y="272.483437" transform="rotate(-0 229.68 272.483437)">the setting</text>
   </g>
   <g id="text_13">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(188.28 361.763437)">THE MUSCLE · cover: [1.0, 2.0] × the planner's cruise</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(188.28 370.763437)">(never over a quarter of the autopilot's speed limit);</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(188.28 380.635312)">the band 0 to 0.25 m</text>
   </g>
   <g id="text_14">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(91.638984 415.456172)">THE SYSTEM UNDER NATIVE · the meters it carries, the wire in:</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(106.261172 424.043437)">• the error between the drone and its commanded point</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(148.502813 433.043437)">• the separation to every other drone</text>
   </g>
