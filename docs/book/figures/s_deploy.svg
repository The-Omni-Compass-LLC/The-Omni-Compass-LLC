   <g id="text_1">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(13.68 15.263438)">namespace omni-compass · service account omni-compass · one</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(13.68 24.263438)">Deployment, one replica (the one writer), strategy Recreate</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(24.48 319.463438)">the pod: UID 10001, read-only root filesystem, no capabilities,</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(24.48 328.463438)">on the system pool (omni-role=system)</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(73.212891 83.635313)">controller</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(44.030391 91.763438)">--mode nodepool --law</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(50.739609 100.763438)">compass --dial max</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(31.846641 109.763438)">--sensed --cap-deployments</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(61.230234 118.763438)">--dry-run (first)</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(81.693281 162.863438)">probe</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(44.816484 171.738281)">latency_probe.py: real</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(38.254922 180.863438)">requests every 5 s to the</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(64.621406 190.735313)">service's URL</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(72.684844 245.663438)">watchdog</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(34.934766 254.538281)">omni_switch.py watchdog:</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(33.318984 264.076172)">the lease, the restore if the</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(63.760781 272.663438)">governor dies</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(212.698125 92.635313)">volume audit</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(210.846094 100.763438)">/var/log/omni/</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(218.919375 109.763438)">audit.jsonl</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(214.2 172.735313)">volume feed</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(204.468047 180.863438)">/feed/latency.csv</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(215.174531 254.663438)">volume tmp</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(211.21875 263.663438)">/tmp/omni.kill</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(360.495 35.855859)">THE API SERVER</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(364.570312 44.063438)">get, list; patch</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(359.502187 53.063438)">nodes, pods; the</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(365.630625 62.476172)">service's HPA,</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(352.318359 71.063438)">Deployment record,</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(371.508047 80.063438)">pods/resize</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(357.804844 190.735313)">THE SERVICE and</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(356.037891 198.863438)">its HPA: the target</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(360.113203 208.735313)">moved inside its</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(374.324766 217.276172)">cover, the</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(375.183984 224.964141)">processor</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(375.278906 234.863438)">conveyed</text>
   </g>
   <g id="text_11">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(354.581719 281.096719)">THE WORK POOLS,</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(359.604141 290.176172)">omni-role=work,</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(357.887812 299.635313)">under the cloud's</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(361.354922 308.635313)">own autoscaler:</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(355.058437 317.176172)">tainted, untainted,</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(357.553828 325.763438)">pods marked first</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(385.522031 334.503984)">to go</text>
   </g>
   <g id="text_12">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b1f3a" x="181.08" y="61.343438" transform="rotate(-0 181.08 61.343438)">one kubectl proxy</text>
   </g>
   <g id="text_13">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a8801f" x="188.28" y="216.724922" transform="rotate(-0 188.28 216.724922)">HTTP, every 5 s</text>
   </g>
   <g id="text_14">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(8.28 371.663438)">No cloud credential in the pod; the cloud makes and deletes machines with its own identity.</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(8.28 380.663438)">The governor talks to one endpoint, the API server, and sends nothing off the cluster.</text>
   </g>
  </g>
 </g>
