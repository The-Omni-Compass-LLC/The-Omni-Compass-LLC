   <g id="text_1">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(23.760703 33.235313)">THE SERVICE at its</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(21.922031 41.776172)">cluster URL, behind</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(28.475859 51.235313)">its load balancer</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(194.960391 28.655859)">THE PROBE</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(180.774141 36.738281)">latency_probe.py:</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(171.361406 45.724922)">N=5 requests every 5</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(187.00875 55.276172)">s, 10 s timeout</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(351.208828 27.863437)">latency.csv:</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(337.602656 36.738281)">elapsed_seconds,</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(332.232188 45.738281)">latency_ms, ok; one</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(343.038516 53.964141)">row a response</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b1f3a" x="142.38" y="28.660781" transform="rotate(-0 142.38 28.660781)">HTTP</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b1f3a" x="298.98" y="27.836016" transform="rotate(-0 298.98 27.836016)">rows</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(326.930625 154.735313)">THE GOVERNOR reads</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(335.011641 163.735313)">the last 60 s for its</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(331.782188 172.276172)">decision, the last 15</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(337.545 181.735313)">to 30 s for its fast</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(329.575078 189.863438)">checks, by the feed's</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(355.006406 199.735313)">own clock</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b1f3a" x="386.28" y="98.963438" transform="rotate(-0 386.28 98.963438)">--latency-file</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(177.823125 154.276172)">THE LINE, --slo-ms:</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(175.313672 163.276172)">the service owner's;</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(171.945703 171.863438)">read against the 95th</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(173.737969 180.863438)">percentile, the mean</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(183.851719 190.735313)">held in the band</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(202.926094 199.735313)">below it</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(26.342578 145.735313)">BLIND: no row for</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(19.160859 154.276172)">twice the window, or</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(20.207109 162.863438)">no served response:</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(17.361562 171.863438)">read as past the wall;</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(21.323672 180.863438)">nothing given back,</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(19.87875 189.863438)">capacity added (in a</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(21.067031 198.863438)">cloud: every parked</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(28.85625 208.205859)">machine woken)</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #8a1f1f" transform="translate(157.68 252.863438)">the safe direction: a broken feed costs savings, never</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #8a1f1f" transform="translate(157.68 262.735312)">service</text>
   </g>
   <g id="text_11">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(4.68 285.263437)">Feed two: the service's own timings (an ingress, a mesh, the application's histogram) written</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(4.68 294.263437)">in the same three columns, measured at the same place as the line, never pre-smoothed.</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(4.68 303.263437)">One feed for one governor.</text>
   </g>
  </g>
 </g>
