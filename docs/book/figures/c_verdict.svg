   <g id="text_1">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(50.275547 44.855859)">REFERENCE r</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(26.071172 53.063437)">the knob at the deepest</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(27.619453 62.063437)">step already allowed (a</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(18.845156 71.405859)">card: at native); the cost of</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(37.067344 80.063437)">each of n requests,</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(45.0675 89.935312)">measured fresh</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(27.844453 98.405859)">(Kubernetes n = 200; a</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(52.024922 107.405859)">card n = 30)</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(222.697266 53.860781)">TRIAL t</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(180.800859 62.063437)">the knob one step past it,</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(176.11875 71.476172)">the same traffic; the cost of</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(176.323359 80.063437)">n more requests (a card: its</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(179.120391 89.476172)">own service time, the wait</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(190.960312 98.063437)">in the queue left out)</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(362.379375 49.355859)">THE READING</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(337.125234 57.905859)">d = mean ln c[t] − mean</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(341.874844 66.905859)">ln c[r], its 95% interval</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(349.52625 75.563437)">(Welch); stepwise a</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(340.831406 84.563437)">second interval against</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(338.849297 94.435312)">the costs first measured</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(373.471875 103.435312)">at native</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(40.933828 191.663437)">an interval wholly above zero is a LOSS: refused. An interval wider than the allowance</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(18.165234 200.663437)">(half-width over τ = ln(1 + a)) with fewer than 3n trial requests: measure on. Otherwise allowed</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(30.628828 209.663437)">only if median t ≤ min(r, c[native])·(1 + a) and d ≤ τ, with a = 0.02; else refused, past the</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(212.535703 219.535312)">allowance</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(28.157344 300.563437)">ALLOWED: the deepest</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(27.243281 309.563437)">allowed step is now the</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(20.164922 318.563437)">trial step; the law may use</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(21.445312 327.976172)">it; the next trial no sooner</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(21.87 337.435312)">than P decisions after this</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(20.567812 345.563437)">one began (Kubernetes 10</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(39.672422 354.905859)">= 600 s; a card 8)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(185.587031 314.935312)">MEASURE ON: the knob</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(180.768516 323.063437)">stays at the trial step one</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(185.381719 332.063437)">more decision, up to 3n</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(219.230156 340.803984)">requests</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(339.604453 301.435312)">REFUSED: the muscle is</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(341.770781 310.435312)">slower there. The knob</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(335.312578 318.563437)">goes back; the step is not</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(334.586953 327.563437)">tried again for R decisions</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(342.459844 336.905859)">(Kubernetes 7,200 s; a</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(338.918906 346.435312)">card 900 decisions = 30</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(383.238984 354.905859)">min)</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a8801f" x="240.48" y="12.535312" transform="rotate(-0 240.48 12.535312)">the trial continues</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(4.68 393.263437)">The verdict stands over every slow knob (the machines, the clock ceiling, a cache's notch). A</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(4.68 402.263437)">trial begins only while the service is calm and nothing waits; a phase that sees the service</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(4.68 411.263437)">leave calm, or that takes longer than its limit (Kubernetes 1,200 s; a card 30 decisions), is</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(4.68 420.263437)">abandoned and the knob goes back, the step neither allowed nor refused. The knob never</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(4.68 429.263437)">passes the deepest allowed step, so steps cannot add up past the allowance. On the max,</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(4.68 438.263437)">the Kubernetes machine count never gives back a machine the cluster had on its own.</text>
   </g>
  </g>
 </g>
