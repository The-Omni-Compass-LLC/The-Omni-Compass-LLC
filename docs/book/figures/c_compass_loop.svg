   </g>
   <g id="text_14">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b1f3a" x="330.48" y="120.505078" transform="rotate(-0 330.48 120.505078)">y</text>
   </g>
   <g id="text_15">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b1f3a" x="213.48" y="120.564141" transform="rotate(-0 213.48 120.564141)">p</text>
   </g>
   <g id="text_16">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b1f3a" x="161.28" y="76.805859" transform="rotate(-0 161.28 76.805859)">K[D]·v</text>
   </g>
   <g id="text_17">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b1f3a" x="46.08" y="117.864141" transform="rotate(-0 46.08 117.864141)">p</text>
   </g>
   <g id="text_18">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b1f3a" x="45" y="55.201641" transform="rotate(-0 45 55.201641)">+</text>
   </g>
   <g id="text_19">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #0b1f3a" x="20.88" y="23.521641" transform="rotate(-0 20.88 23.521641)">−</text>
   </g>
   <g id="text_20">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(4.68 211.463438)">c the centre of the band; y the reading; p the reading's position in the band; e = p − c; v = ṗ</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(4.68 220.463438)">smoothed; r the raw force; F the force after the saturation; Δx the step; x the knob. Fail up: p</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(4.68 229.463438)">≥ 0.95 → F = A at once; the down side held until p is back inside the band. No take-back</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(4.68 238.463438)">while the reading climbs above the centre (F &lt; 0 with v &gt; 0 and p &gt; c → F = 0). K[D] is set</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(4.68 247.463438)">from the muscle's own response time τ (critical damping), never tuned by hand.</text>
   </g>
  </g>
 </g>
