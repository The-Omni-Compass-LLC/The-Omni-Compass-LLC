   <g id="text_1">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(10.153125 22.103437)">the engine settled: calm = κ·h·(1 − excess stress)·(1 −</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(14.156016 31.138594)">unmet need) at or over the organ's threshold θ (pods</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(92.152969 40.445859)">0.5; machines 0.7)</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(14.99625 76.463437)">the line clean: no breach now, and for the pods none</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(61.568438 85.805859)">in the last 180 s (the clear time)</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(17.973984 120.383437)">every sense live (none blind or stale): a blind sense</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(75.51 129.383437)">never gives capacity back</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(18.917578 165.743437)">and, for the machines, the release gate: more than</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(11.605781 174.743437)">one machine; no pod waiting; pods not scaling up; the</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(57.564141 183.743437)">remaining machines at or under ρ</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(21.426328 220.103437)">the last command landed (proprioception: no new</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(15.602344 229.103437)">order to a muscle still carrying out the previous one)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(14.941406 264.023438)">the verdict allows the step (the deepest step already</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(75.981797 273.365859)">allowed covers the count)</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="308.88" y="150.610781" transform="rotate(-0 308.88 150.610781)">AND</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(370.413281 128.105859)">GIVE BACK: one</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(367.250625 136.655859)">unit a decision (a</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(366.598828 146.185313)">machine: at most</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(366.998203 154.655859)">one a minute), or</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(366.728203 164.185312)">the calm share of</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(380.915859 172.313437)">the surplus</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(12.374297 325.943437)">a reason: the service past the wall, a sense blind, or a</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(82.628438 334.943437)">pod waiting for a place</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="134.28" y="368.423437" transform="rotate(-0 134.28 368.423437)">NOT a security hold (the hold flag, the forbidden key)</text>
   </g>
   <g id="text_11">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="308.88" y="350.230781" transform="rotate(-0 308.88 350.230781)">AND</text>
   </g>
   <g id="text_12">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(374.895 336.207656)">ADD: at once,</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(363.950859 345.275859)">never held back (a</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(369.77625 353.933437)">parked machine</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(366.678281 363.275859)">woken within 5 s)</text>
   </g>
   <g id="text_13">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(8.28 407.303437)">Asymmetric on purpose: adding is cheap to undo and expensive to delay; taking back is</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(8.28 416.303437)">cheap to delay and expensive to get wrong. Every held decision writes the first reason that</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(8.28 425.303437)">failed. In observe mode every authority is computed and logged and nothing is written; under</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(8.28 434.303437)">the kill switch there is no authority at all.</text>
   </g>
  </g>
 </g>
