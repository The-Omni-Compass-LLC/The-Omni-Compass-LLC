   <g id="text_7">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #8a1f1f" transform="translate(289.08 113.003437)">the kill switch: open, every</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #8a1f1f" transform="translate(289.08 122.003437)">setting handed back at once; for</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #8a1f1f" transform="translate(289.08 131.003437)">security only</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(62.580234 161.423437)">THE PLUG, the wire out: the system's own command, written and read back</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(171.634922 170.423437)">M1 consumers in the group</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(48.843984 179.423437)">each message carries its production time; the group's own records: lag, members</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(172.105313 188.163984)">start or stop one consumer</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(72.150469 197.423437)">snapshot once at attach; every setting restored to it on stop, read back</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(71.902969 256.175859)">NATIVE CONTROLLER</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(49.131563 264.383438)">the broker and the group's own</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(97.642969 274.255312)">rebalance</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b1f3a" x="128.88" y="232.315312" transform="rotate(-0 128.88 232.315312)">write · read back</text>
   </g>
   <g id="text_11">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b1f3a" x="323.28" y="327.355312" transform="rotate(-0 323.28 327.355312)">the consumer count</text>
   </g>
   <g id="text_12">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b1f3a" x="229.68" y="260.603437" transform="rotate(-0 229.68 260.603437)">the setting</text>
   </g>
   <g id="text_13">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(188.28 349.883437)">THE MUSCLE · cover: [1, partitions] (eight); the</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(188.28 358.883437)">reading held at 40% of a 500 ms line, response time 3</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(188.28 367.856016)">s</text>
   </g>
   <g id="text_14">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(91.638984 403.576172)">THE SYSTEM UNDER NATIVE · the meters it carries, the wire in:</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(113.601094 412.163437)">• consumed in the last second (handled − produced)</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(197.405859 421.163437)">• the topic's lag</text>
   </g>
