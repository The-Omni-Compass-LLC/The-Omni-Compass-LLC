   <g id="text_1">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(234.639141 37.835859)">THE GOVERNOR</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(230.372578 46.043437)">the compass law ·</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(235.040625 55.915312)">the verdict · the</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(226.406953 64.043437)">give-back rule · one</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(232.576172 73.043437)">decision a period</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="105.48" y="19.015312" transform="rotate(-0 105.48 19.015312)">S1 site watts</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(32.213672 50.543437)">S2 rack inlets, supply and return</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(99.622266 60.415312)">air</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="105.48" y="92.815312" transform="rotate(-0 105.48 92.815312)">S3 the services' lines</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(383.167266 33.276797)">AUDIT</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(362.399063 41.543437)">audit.jsonl: one</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(357.106641 50.956172)">record a decision,</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(360.645469 59.543437)">every write with</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(358.379297 69.415312)">its reason and its</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(374.627813 78.415312)">read-back</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #2e6b3a" transform="translate(22.68 108.143437)">the wire in: every meter read live</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #2e6b3a" transform="translate(22.68 117.143437)">from the system, never a number</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #2e6b3a" transform="translate(22.68 127.015312)">written in code</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b1f3a" x="278.28" y="105.340781" transform="rotate(-0 278.28 105.340781)">M1</text>
   </g>
