   <g id="text_8">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #8a1f1f" transform="translate(289.08 137.123437)">the kill switch: open, every</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #8a1f1f" transform="translate(289.08 146.123437)">setting handed back at once; for</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #8a1f1f" transform="translate(289.08 155.123437)">security only</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(62.580234 186.983437)">THE PLUG, the wire out: the system's own command, written and read back</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(183.094453 195.983437)">M1 supply-air setpoint</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(112.695469 204.983437)">--power-cmd "&lt;prints site watts&gt;" --site-limit-w &lt;W&gt;</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(170.540859 213.983437)">--cooling-cmd "&lt;sets {c}&gt;"</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(99.284063 222.983437)">--cooling-min-c 18 --cooling-max-c 27 --cooling-restore-c 22</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(72.150469 231.983437)">snapshot once at attach; every setting restored to it on stop, read back</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(71.902969 292.175859)">NATIVE CONTROLLER</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(33.870937 300.383437)">the building management system and</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(57.041719 309.383437)">the cooling units' own loops</text>
   </g>
   <g id="text_11">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b1f3a" x="128.88" y="268.315312" transform="rotate(-0 128.88 268.315312)">write · read back</text>
   </g>
   <g id="text_12">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b1f3a" x="323.28" y="362.483437" transform="rotate(-0 323.28 362.483437)">the supply-air setpoint</text>
   </g>
   <g id="text_13">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b1f3a" x="229.68" y="296.603437" transform="rotate(-0 229.68 296.603437)">the setting</text>
   </g>
   <g id="text_14">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(188.28 385.883437)">THE MUSCLE · cover: the operator's band inside the</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(188.28 394.883437)">equipment's ratings (ASHRAE 18 to 27 °C); site power</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(188.28 404.296172)">is read, never set</text>
   </g>
   <g id="text_15">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(91.638984 439.576172)">THE SYSTEM UNDER NATIVE · the meters it carries, the wire in:</text>
