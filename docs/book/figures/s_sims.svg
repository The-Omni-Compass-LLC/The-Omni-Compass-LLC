   <g id="text_1">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(192.675938 34.163437)">THE GOVERNOR, one plug each</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(184.71375 43.163437)">the compass law · the verdict · one</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(225.376172 52.163437)">decision a period</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(46.495547 133.343438)">NATIVE: CityLearn: the simulator's</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(45.017578 142.343438)">rule-based control of each building</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(270.806484 124.343438)">THE KNOB: each building's battery,</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(285.684609 133.343438)">inside its own limits (charge,</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(326.592422 142.343438)">discharge)</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(305.765156 151.343438)">one knob a building</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(35.129531 211.103438)">NATIVE: pandapower on SimBench: the</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(56.709844 220.103438)">tap changer holding 1.00 p.u.</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(262.477266 202.103438)">THE KNOB: the tap position: one whole</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(273.437578 211.103438)">tap per move; a week of evidence</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(306.872578 220.103438)">before a step down</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(300.25125 229.975313)">one knob a substation</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(32.996953 282.923437)">NATIVE: MuJoCo Menagerie: the shipped</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(88.36875 291.923437)">joint controllers</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(267.340078 278.423437)">THE KNOB: the speed of an axis with</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(267.993984 287.423437)">slack; an axis at its takt stays native</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(311.922422 297.295313)">one knob an axis</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(251.28 90.863437)">the plug: the one setting the simulator</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(251.28 99.603984)">accepts</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #2e6b3a" transform="translate(4.68 49.463437)">the senses: battery SOC and</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #2e6b3a" transform="translate(4.68 58.463437)">demand; bus voltage and</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #2e6b3a" transform="translate(4.68 67.463437)">loading; tracking error and</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #2e6b3a" transform="translate(4.68 77.335313)">takt</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(15.48 326.663437)">The simulator's own controller is native in every cell; the plug writes the one setting it</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(15.48 335.663437)">accepts, reads it back and restores it at the end. Receipts are class S: statements about the</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(15.48 345.076172)">simulator's model, never about hardware.</text>
   </g>
  </g>
 </g>
