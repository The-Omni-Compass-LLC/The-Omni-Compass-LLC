# The cloud (the Operator's Manual, chapter 19): Omni-Compass on top of a managed cluster at the max, the whole engine, every
# muscle (the founder's order of 31 October: no hard rule; the tune-down on the machines alone of 14 October is struck). It
# senses the service and moves its pod target inside the autoscaler's cover, conveys the processor a machine can spare, and
# parks machines the cloud's own autoscaler made, after its own trial, waking them on a breach; it asks the cloud for no
# machine itself (the autoscaler, native's machine controller, stays and adds them). The bill is judged beside the work,
# never ruled. Apply after omni-compass.yaml (the namespace, the service account and the watch role) and rbac-cloud.yaml
# (the writes the whole engine makes). It ships with --dry-run: it decides and writes nothing until that line is removed.
# Set the image (<registry>/omni-compass-cloud:<version>), --sensed and --cap-deployments (the service's
# namespace/deployment: its autoscaler's target moved, its pods' processor conveyed), TARGET_URL (the service's URL),
# --slo-ms (the service's line) and --max-nodes (the work pools' top). Three containers in one pod: the governor, the probe
# (its response-time feed) and the watchdog (its lease), sharing one process namespace.
apiVersion: apps/v1
kind: Deployment
metadata: {name: omni-compass, namespace: omni-compass, labels: {app: omni-compass}}
spec:
  replicas: 1                          # one writer: never more than one
  strategy: {type: Recreate}           # never two governors at once, even during a rollout
  selector: {matchLabels: {app: omni-compass}}
  template:
    metadata: {labels: {app: omni-compass}}
    spec:
      serviceAccountName: omni-compass
      shareProcessNamespace: true          # the watchdog sees the governor's process (the lease, chapter 20.2)
      terminationGracePeriodSeconds: 60    # room for the hand-back on SIGTERM: every parked machine woken, read back
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      tolerations: [{key: CriticalAddonsOnly, operator: Exists}]     # runs on the system pool, never on a machine it parks
      nodeSelector: {omni-role: system}
      containers:
        - name: controller
          image: omni-compass-cloud:local
          args: ["--mode", "nodepool", "--law", "compass", "--dial", "max", "--sensed", "<namespace>/<deployment>",
                 "--cap-deployments", "<namespace>/<deployment>",
                 "--active-nodes-only", "--interval", "20", "--floor-interval", "5",
                 "--min-nodes", "2", "--max-nodes", "4", "--max-node-step", "1",
                 "--node-scale-cmd", "bash /app/scripts/kind_nodepool.sh {n}",
                 "--node-restore-cmd", "bash /app/scripts/kind_nodepool.sh 100000",
                 "--latency-file", "/feed/latency.csv", "--slo-ms", "500",
                 "--closure", "/app/law/closure.json",
                 "--audit", "/var/log/omni/audit.jsonl", "--kill-file", "/tmp/omni.kill",
                 "--dry-run"]
          env:
            - {name: WORKER_SEL, value: "omni-role=work"}      # the machines it may park
            - {name: MIN_NODES, value: "2"}                    # never fewer in service
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 500m, memory: 256Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: audit, mountPath: /var/log/omni}, {name: tmp, mountPath: /tmp}, {name: feed, mountPath: /feed}]
        - name: probe                  # the response-time feed (chapter 18): real requests to the service, every 5 s
          image: omni-compass-cloud:local
          command: ["python", "/app/scripts/latency_probe.py"]
          args: ["$(TARGET_URL)", "/feed/latency.csv"]
          env:
            - {name: TARGET_URL, value: "http://<service>.<namespace>.svc.cluster.local/"}
            - {name: INTERVAL, value: "5"}
            - {name: N, value: "5"}
            - {name: DURATION, value: "31536000"}
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {cpu: 100m, memory: 64Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: feed, mountPath: /feed}]
        - name: watchdog               # the lease (chapter 20.2): if the governor dies or hangs, it runs the governor's own
          image: omni-compass-cloud:local    # recorded restore (--restore-only), which wakes every parked machine
          command: ["python", "/app/tools/omni_switch.py", "watchdog", "--every", "10"]
          env:                         # the restore is the governor's own command line: it needs the governor's environment
            - {name: WORKER_SEL, value: "omni-role=work"}
            - {name: MIN_NODES, value: "2"}
          resources: {requests: {cpu: 10m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: audit, mountPath: /var/log/omni}, {name: tmp, mountPath: /tmp}]
      volumes: [{name: audit, emptyDir: {}}, {name: tmp, emptyDir: {}}, {name: feed, emptyDir: {}}]
