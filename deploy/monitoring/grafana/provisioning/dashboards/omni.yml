# The two Omni-Compass boards, loaded at start from deploy/grafana/ (the monitor wall is written from the live engine's
# monitor registry by docs/engine/export_grafana.py; the governor's own screen beside it).
apiVersion: 1
providers:
  - name: omni-compass
    folder: Omni-Compass
    type: file
    disableDeletion: true
    allowUiUpdates: true
    options: {path: /var/lib/grafana/dashboards/omni}
