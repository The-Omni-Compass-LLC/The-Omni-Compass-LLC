# The governors Prometheus reads, one entry a place Omni-Compass runs. The first is the exporter beside this stack; add
# yours below, each with its route (onsite | cloud) and its provider, and Prometheus reads the change on its own.
- targets: ["omni-exporter:9464"]
  labels: {route: onsite, provider: bare-metal, site: this-machine}
