# Alertmanager for the mission-control wall: every firing governor alert goes to the alert bridge
# (tools/omni_alert_bridge.py), which presses the control panel's button listed for it in actions.json, or writes what it
# would press while it is not told to press. Add your own receivers (mail, chat, paging) beside it.
route:
  receiver: omni-bridge
  group_by: [alertname, instance]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h
receivers:
  - name: omni-bridge
    webhook_configs:
      - url: http://omni-bridge:9466/alerts
        send_resolved: true
