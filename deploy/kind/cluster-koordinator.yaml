# The six-worker cluster of every kind set (deploy/kind/cluster-full.yaml) with the kubelet's cgroup root at /, as
# Koordinator's own kind configuration sets it (test/kind-conf.yaml at v1.8.0, the two patches below copied as written).
# kind's default root, /kubelet, leaves koordlet no pod cgroups where it reads them: in the first three Koordinator runs
# of 20 October it crash-looped on every node and no window opened. Used for BATCH_QUEUE=koordinator only, in both arms
# (scripts/kind_paired.sh; docs/BATCH_QUEUE_PREREGISTRATION.md, amendment 4).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
  - role: worker
  - role: worker
  - role: worker
  - role: worker
  - role: worker
  - role: worker
kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        "cgroup-root": "/"
    ---
    kind: KubeletConfiguration
    cgroupRoot: /
