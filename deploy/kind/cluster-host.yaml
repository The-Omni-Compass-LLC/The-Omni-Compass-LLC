# The orchestrator's own cluster in the group of clusters (scripts/kind_group.sh; docs/GROUP_PREREGISTRATION.md): one node,
# beside the members, that runs the orchestrator's control plane and nothing of the work, as a group's orchestrator runs on
# a management cluster of its own. kind leaves a lone node open to work, so the orchestrator's pods run on it.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
