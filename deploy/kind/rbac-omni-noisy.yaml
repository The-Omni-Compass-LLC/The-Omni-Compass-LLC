# The fairness test (TWO_APP=1): Omni-Compass may govern the second application's HPA as it governs php-apache's, and
# nothing else more.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: omni-compass-app-noisy, namespace: default}
rules:
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    resourceNames: ["php-noisy"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: omni-compass-app-noisy, namespace: default}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: omni-compass-app-noisy}
subjects: [{kind: ServiceAccount, name: omni-compass, namespace: omni-compass}]
