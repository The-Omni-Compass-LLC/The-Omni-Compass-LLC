# Armada's scheduler ingester on the group rig (scripts/kind_group_orch.sh, ORCH=armada): the settings Armada's own local
# stack gives it at v0.22.14 (_local/scheduleringester/config.yaml), every service on the runner's own network, tracing off.
observability:
  enabled: false
metricsPort: 9006
postgres:
  connection:
    host: localhost
    port: 5432
    user: postgres
    password: psw
    dbname: scheduler
    sslmode: disable
pulsar:
  URL: "pulsar://localhost:6650"
  restURL: "http://localhost:8090"
