# Armada's lookout, used on the group rig only to lay out the lookout database the server's query API reads
# (scripts/kind_group_orch.sh, ORCH=armada: `lookout --migrateDatabase`, as Armada's own containerized stack runs it before
# its server); the settings of Armada's local stack at v0.22.14 (_local/lookout/config.yaml), tracing off. Lookout itself
# (the web view) is not run.
apiPort: 8089
metricsPort: 9003
observability:
  enabled: false
auth:
  anonymousAuth: true
postgres:
  connection:
    host: localhost
    port: 5432
    user: postgres
    password: psw
    dbname: lookout
    sslmode: disable
uiConfig:
  backend: "jsonb"
  armadaApiBaseUrl: "http://localhost:8081"
  binocularsBaseUrlPattern: "http://localhost:8084"
  customTitle: "Omni-Compass group rig"
  userAnnotationPrefix: "armadaproject.io/"
