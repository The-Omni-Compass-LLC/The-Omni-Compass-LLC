# Armada's event ingester on the group rig (scripts/kind_group_orch.sh, ORCH=armada): the settings Armada's own local stack
# gives it at v0.22.14 (_local/eventingester/config.yaml), every service on the runner's own network, tracing off.
redis:
  addrs:
    - localhost:6379
  db: 1
  poolSize: 1000
pulsar:
  URL: "pulsar://localhost:6650"
  restURL: "http://localhost:8090"
  jobsetEventsTopic: "events"
subscriptionName: "events-ingester"
metricsPort: 9004
observability:
  enabled: false
metrics:
  redis:
    enabled: true
    collectionInterval: 30s
    topN: 100
    scanBatchSize: 1000
    pipelineBatchSize: 500
    interBatchDelay: 0ms
    memoryUsageSamples: 5
    leader:
      mode: "standalone"
