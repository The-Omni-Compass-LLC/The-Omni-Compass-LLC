# The two priority classes Armada's scheduler gives the pods it places (its defaults, armada-default and armada-preemptible),
# applied in every member cluster before its executor starts, as Armada's own local setup applies them to its kind cluster
# (_local/kind/priorityclasses.yaml at v0.22.14).
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: armada-default
value: 1000
globalDefault: false
description: "Default priority class for pods created by Armada."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: armada-preemptible
value: 500
globalDefault: false
description: "Lower-priority class for pods that should be preempted by armada-default pods."
