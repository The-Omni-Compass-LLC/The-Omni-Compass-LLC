# The batch test's queue: one Kubernetes Job of BATCH_COMPLETIONS pods, BATCH_PARALLELISM at a time, each hashing a
# fixed amount of data (real CPU work, the same in every arm). Placed on the measured workers, never the control plane.
# scripts/kind_bench.sh fills the two numbers in and applies it when the measured window opens (WORKLOAD=batch).
apiVersion: batch/v1
kind: Job
metadata: {name: omni-batch, namespace: default}
spec:
  completions: BATCH_COMPLETIONS
  parallelism: BATCH_PARALLELISM
  backoffLimit: 20
  template:
    metadata: {labels: {app: omni-batch}}
    spec:
      restartPolicy: Never
      containers:
        - name: work
          image: busybox:1.36
          resources: {requests: {cpu: 500m}, limits: {cpu: "1"}}
          command: ["/bin/sh", "-c", "dd if=/dev/zero bs=1M count=BATCH_MB 2>/dev/null | sha256sum"]
