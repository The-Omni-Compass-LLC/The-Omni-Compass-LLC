# The KAI scheduler's chart values for the kind rig (scripts/kind_batch_queue.sh, BATCH_QUEUE=kai;
# docs/BATCH_QUEUE_PREREGISTRATION.md, amendment 1): the chart's own placement setting, which its operator applies to every
# component it runs, puts KAI on the control plane beside metrics-server and CoreDNS, so the six measured workers carry only
# the work. Every other value is the chart's as published, its default queues among them.
global:
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
    - {key: node-role.kubernetes.io/master, operator: Exists, effect: NoSchedule}
