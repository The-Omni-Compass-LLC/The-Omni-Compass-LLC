# What the Crane test adds to Omni-Compass's least-privilege identity (deploy/kind/rbac-omni.yaml): Crane owns php-apache's
# HPA, which it names ehpa-php-apache, and rebuilds it from its EffectiveHorizontalPodAutoscaler, so the plug
# (scripts/kubectl_crane.py) carries the HPA moves to that one EHPA, and keeps Omni-Compass's records on the EHPA and on the
# HPA Crane built (the one demo HPA of rbac-omni.yaml, under Crane's name for it). Named objects only; no create, no delete,
# nothing in Crane's own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: omni-compass-crane, namespace: default}
rules:
  - apiGroups: ["autoscaling.crane.io"]
    resources: ["effectivehorizontalpodautoscalers"]
    resourceNames: ["php-apache"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    resourceNames: ["ehpa-php-apache"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: omni-compass-crane, namespace: default}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: omni-compass-crane}
subjects: [{kind: ServiceAccount, name: omni-compass, namespace: omni-compass}]

