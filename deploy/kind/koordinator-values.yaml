# Koordinator's chart values for the kind rig (scripts/kind_batch_queue.sh, BATCH_QUEUE=koordinator;
# docs/BATCH_QUEUE_PREREGISTRATION.md, amendment 2): the operator's two settings for a cluster with one control plane, the
# same in every arm. Its images from its GitHub registry (the chart's default is its Beijing registry, the same images),
# and its manager, scheduler and descheduler one replica each, on the control plane beside metrics-server and CoreDNS
# (two replicas each would ask the one control-plane node for three processors, more than it has free). koordlet, its
# node agent, runs on every node as shipped. Every other value is the chart's as published, colocation on.
imageRepositoryHost: ghcr.io
manager:
  replicas: 1
  nodeSelector: {node-role.kubernetes.io/control-plane: ""}
  tolerations: [{key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}, {key: node-role.kubernetes.io/master, operator: Exists, effect: NoSchedule}]
scheduler:
  replicas: 1
  nodeSelector: {node-role.kubernetes.io/control-plane: ""}
  tolerations: [{key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}, {key: node-role.kubernetes.io/master, operator: Exists, effect: NoSchedule}]
descheduler:
  replicas: 1
  nodeSelector: {node-role.kubernetes.io/control-plane: ""}
  tolerations: [{key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}, {key: node-role.kubernetes.io/master, operator: Exists, effect: NoSchedule}]
