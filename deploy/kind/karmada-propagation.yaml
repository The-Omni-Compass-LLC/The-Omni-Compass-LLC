# The operator's one propagation policy for the batch stream on Karmada (scripts/kind_group_orch.sh;
# docs/GROUP_PREREGISTRATION.md): every job of the stream may go to any member, and Karmada divides each job's pods among
# them by its Aggregated preference, as its own documentation writes it for work that should run on as few clusters as its
# available resources allow; how it picks the cluster is Karmada's. MEMBER_CLUSTERS is filled with the members' names.
apiVersion: policy.karmada.io/v1alpha1
kind: PropagationPolicy
metadata:
  name: omni-batch-stream
  namespace: default
spec:
  resourceSelectors:
    - apiVersion: batch/v1
      kind: Job
      labelSelector:
        matchLabels:
          app: omni-batch-stream
  placement:
    clusterAffinity:
      clusterNames: MEMBER_CLUSTERS
    replicaScheduling:
      replicaSchedulingType: Divided
      replicaDivisionPreference: Aggregated
