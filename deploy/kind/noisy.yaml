# The fairness test's second application (scripts/kind_bench.sh, TWO_APP=1): a noisy neighbour on the same workers as
# php-apache, the same image and the same HPA rule, with its own fixed-rate load that surges in steps (NOISY_STEPS).
# Its response time is probed through its own Service (NodePort 30081), as php-apache's is (30080).
apiVersion: apps/v1
kind: Deployment
metadata: {name: php-noisy}
spec:
  selector: {matchLabels: {run: php-noisy}}
  template:
    metadata: {labels: {run: php-noisy}}
    spec:
      containers:
        - name: php-noisy
          image: registry.k8s.io/hpa-example
          ports: [{containerPort: 80}]
          resources: {limits: {cpu: 500m}, requests: {cpu: 200m}}
          readinessProbe: {tcpSocket: {port: 80}, periodSeconds: 2}
          lifecycle: {preStop: {exec: {command: ["sleep", "5"]}}}
---
apiVersion: v1
kind: Service
metadata: {name: php-noisy, labels: {run: php-noisy}}
spec:
  ports: [{port: 80}]
  selector: {run: php-noisy}
---
apiVersion: v1
kind: Service
metadata: {name: php-noisy-edge, labels: {run: php-noisy}}
spec:
  type: NodePort
  ports: [{port: 80, nodePort: 30081}]
  selector: {run: php-noisy}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: php-noisy}
spec:
  minAvailable: 1
  selector: {matchLabels: {run: php-noisy}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: php-noisy}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: php-noisy}
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 50}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: load-noisy}
spec:
  replicas: 0
  selector: {matchLabels: {app: load-noisy}}
  template:
    metadata: {labels: {app: load-noisy}}
    spec:
      nodeSelector: {node-role.kubernetes.io/control-plane: ""}
      tolerations:
        - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
        - {key: node-role.kubernetes.io/master, operator: Exists, effect: NoSchedule}
      containers:
        - name: load
          image: busybox:1.36
          env: [{name: RATE, value: "6"}]
          command: ["/bin/sh", "-c"]
          args:
            - gap=$$((1000000 / RATE)); while true; do (wget -q -T 10 -O- http://php-noisy >/dev/null 2>&1 &); usleep $$gap; done
