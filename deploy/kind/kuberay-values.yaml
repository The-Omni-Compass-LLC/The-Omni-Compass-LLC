# The KubeRay operator's chart values for the kind rig (scripts/kind_batch_queue.sh, BATCH_QUEUE=kuberay;
# docs/BATCH_QUEUE_PREREGISTRATION.md, amendment 7): the chart's own placement settings put the operator on the control
# plane beside metrics-server and CoreDNS, so the six measured workers carry only the work. Every other value is the
# chart's as published.
nodeSelector:
  node-role.kubernetes.io/control-plane: ""
tolerations:
  - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
  - {key: node-role.kubernetes.io/master, operator: Exists, effect: NoSchedule}
