# CruiseKube's chart (0.3.4) as shipped, with only what a benchmark run needs changed (scripts/kind_addons_cruisekube.sh;
# register row 81): the Prometheus it reads is ours (deploy/kind/cruisekube-metrics.yaml); its usage reports to its maker
# are off; its dashboard and its login are left out (its API answers inside the cluster only, read by the harness through a
# port-forward); the Prometheus Operator's ServiceMonitors are left out (no operator runs here); its PostgreSQL is its own
# chart's, on the control plane, without a volume (a run lasts hours). Every setting of how CruiseKube right-sizes stays
# as shipped, its hour before it acts on a new workload included. The controller and the webhook are moved to the control
# plane by the harness after the install (the chart has no placement settings).
cruisekubeController:
  admin:
    enabled: false
  usageTelemetry:
    enabled: false
  serviceMonitor:
    enabled: false
  env:
    CRUISEKUBE_DEPENDENCIES_INCLUSTER_PROMETHEUSURL: "http://prometheus.cruisekube-metrics.svc:9090"
cruisekubeWebhook:
  serviceMonitor:
    enabled: false
cruisekubeFrontend:
  enabled: false
postgresql:
  primary:
    persistence:
      enabled: false
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
    tolerations:
      - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
      - {key: node-role.kubernetes.io/master, operator: Exists, effect: NoSchedule}
