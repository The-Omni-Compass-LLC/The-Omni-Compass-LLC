# Package metadata for license scanners (Black Duck, FOSSA, Snyk, ScanCode, REUSE). Omni-Compass is proprietary:
# evaluation and simulation use only; everything else requires a signed, paid Omni-Compass Enterprise License.
[project]
name = "omni-compass"
version = "0.23.0"   # 0.N.0 is the engine omni-vN on main (tools/omni_version.py; verify.py checks it); 1.0 is the engine the founder declares final
description = "Omni-Compass: a unified governing control plane (proprietary; evaluation and simulation use only)"
readme = "README.md"
license = "LicenseRef-OmniCompass-Evaluation-1.0"
license-files = ["LICENSE", "NOTICE", "DISCLOSURES.md", "THIRD_PARTY_NOTICES.md", "LICENSING_FAQ.md", "PATENTS.md", "TRADEMARKS.md", "LICENSES/*"]
authors = [{ name = "The Omni-Compass LLC" }]
requires-python = ">=3.11"   # Pillow 13 (the figure kits' image library) needs 3.11; verify runs on 3.12
keywords = ["omni-compass", "governor", "supervisory-control", "control-plane", "control-core", "control-engine", "convergence-engine", "conveyance", "machinery", "kubernetes", "autoscaling", "hpa", "gpu", "power-capping", "energy-efficiency", "work-per-energy", "data-center", "cooling", "battery-management", "smart-grid", "robotics", "industrial-automation", "database-tuning", "control-theory", "feedback-control", "proprietary", "source-available"]
classifiers = [
  "License :: Other/Proprietary License",
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
]

[project.urls]
Homepage = "https://www.omni-compass.com"
Documentation = "https://github.com/The-Omni-Compass-LLC/The-Omni-Compass-LLC/blob/main/docs/OMNI_COMPASS_MANUAL.md"
Disclosures = "https://github.com/The-Omni-Compass-LLC/The-Omni-Compass-LLC/blob/main/DISCLOSURES.md"
Changelog = "https://github.com/The-Omni-Compass-LLC/The-Omni-Compass-LLC/blob/main/CHANGELOG.md"
Repository = "https://github.com/The-Omni-Compass-LLC/The-Omni-Compass-LLC"
License = "https://github.com/The-Omni-Compass-LLC/The-Omni-Compass-LLC/blob/main/LICENSE"
