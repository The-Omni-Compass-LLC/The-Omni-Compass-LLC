name: citylearn
# Omni-Compass on top of CityLearn's own controller (docs/CITYLEARN_PREREGISTRATION.md): an independent simulator of
# real buildings, their solar panels and batteries, scored by CityLearn itself. One job per district, native and
# native and omni; one report (results/citylearn/CITYLEARN.md).
on:
  workflow_dispatch:
    inputs:
      datasets:
        description: "CityLearn districts, comma separated; 'untouched' runs every district CityLearn ships except the tuning district and round 1's"
        default: "untouched"
env:
  OMNI_NOTICE: '© 2026 Dubra Software Inc. / The Omni-Compass LLC. All rights reserved. **Evaluation and Simulation use only.** Any commercial use, commercialization, monetization, production use, redistribution or hosted service of any part of Omni-Compass requires a signed, paid Omni-Compass Enterprise License from Dubra Software Inc. / The Omni-Compass LLC. Every copy, export, report and printout carries this notice with `LICENSE`, `NOTICE` and `DISCLOSURES.md`. All patents, copyrights and trademarks filed in the USA. www.omni-compass.com'
# the token reads the code and nothing else: this workflow pushes nothing, starts nothing and reads no other run
# (docs/THREAT_MODEL.md, T9)
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs: {sets: "${{ steps.r.outputs.sets }}"}
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - id: r
        run: |
          if [ "${{ github.event.inputs.datasets }}" = untouched ]; then
            GIT_LFS_SKIP_SMUDGE=1 git clone -q --depth 1 https://github.com/intelligent-environments-lab/citylearn /tmp/cl
            seen="citylearn_challenge_2022_phase_1 citylearn_challenge_2022_phase_2 citylearn_challenge_2022_phase_3 citylearn_challenge_2022_phase_all citylearn_challenge_2021 citylearn_challenge_2020_climate_zone_1 citylearn_challenge_2020_climate_zone_2 citylearn_challenge_2020_climate_zone_3 citylearn_challenge_2020_climate_zone_4 citylearn_challenge_2023_phase_1"
            sets=$(for d in /tmp/cl/data/datasets/*/; do n=$(basename "$d"); [ -f "$d/schema.json" ] && ! echo " $seen " | grep -q " $n " && echo "$n"; done | python3 -c "import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))")
          else
            sets=$(python3 -c "import json; print(json.dumps('${{ github.event.inputs.datasets }}'.split(',')))")
          fi
          echo "sets=$sets" | tee -a "$GITHUB_OUTPUT"
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
  run:
    needs: plan
    strategy:
      fail-fast: false
      matrix: {dataset: "${{ fromJSON(needs.plan.outputs.sets) }}"}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4: the code, not the archive of raw runs (25 GB, more than the machine's disk)
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/results/live/raw/*
      - name: Engine and source receipt
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"
          python3 tools/omni_version.py | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.11"}
      - run: pip install -q citylearn nrel-pysam   # PySAM: CityLearn sizes the solar panels of its newer districts with NREL's System Advisor Model
      - run: GIT_LFS_SKIP_SMUDGE=1 git clone -q --depth 1 https://github.com/intelligent-environments-lab/citylearn /tmp/cl
      - name: Run the district, native and omni
        run: |
          set +e
          python tools/run_citylearn.py --datasets "${{ matrix.dataset }}" --data-dir /tmp/cl/data/datasets --out out > run.log 2>&1
          code=$?
          # the end of the run's own output as annotations, readable on the run's page and through the API
          grep -v -i "warning" run.log | tail -10 | while IFS= read -r l; do echo "::notice::$l"; done
          [ "$code" = 0 ] || { echo "::error::${{ matrix.dataset }} ended with exit $code"; mkdir -p out; cp run.log out/; exit "$code"; }
      - name: Attach README, licenses and disclosures to this artifact
        id: omni_legal_export_1
        if: "always()"
        env:
          OMNI_EXPORT_PATHS: |
            out
        shell: python
        run: |
          #!/usr/bin/env python3
          # SPDX-License-Identifier: LicenseRef-OmniCompass-Evaluation-1.0
          # Copyright (c) 2026 Dubra Software Inc. / The Omni-Compass LLC. All rights reserved.
          # Evaluation and Simulation use only; any commercialization, monetization or other use requires a signed, paid
          # Omni-Compass Enterprise License. See LICENSE, NOTICE and DISCLOSURES.md.
          # All patents, copyrights and trademarks filed in the USA. www.omni-compass.com
          """Attach the exact legal bundle inside an artifact without changing its result-file layout."""
          import glob
          import hashlib
          import json
          import os
          from pathlib import Path
          import urllib.parse
          import urllib.request
          import uuid
          
          BUNDLE = ('README.md', 'LICENSE', 'NOTICE', 'DISCLOSURES.md', 'PATENTS.md', 'TRADEMARKS.md')
          
          
          def search_root(pattern, workspace):
              path = Path(os.path.expanduser(pattern))
              if not path.is_absolute():
                  path = workspace / path
              prefix = Path(path.anchor)
              for part in path.parts[1:]:
                  if glob.has_magic(part):
                      return prefix
                  prefix /= part
              return path if path.is_dir() or (not path.exists() and not path.suffix) else path.parent
          
          
          def attach(paths, workspace, loader=None):
              workspace = Path(workspace).absolute()
              lines = [p.strip() for p in paths.splitlines() if p.strip()]
              roots = [search_root(p, workspace) for p in lines if not p.startswith('!')]
              if not roots:
                  raise ValueError('artifact has no positive output path')
              root = Path(os.path.commonpath([str(p) for p in roots]))
              if root == Path(root.anchor):
                  raise ValueError('refusing to write an export bundle at a filesystem root')
              legal = root / '_omni_legal'
              legal.mkdir(parents=True, exist_ok=True)
              hashes = {}
              for name in BUNDLE:
                  source = workspace / name
                  data = source.read_bytes() if source.is_file() else loader(name) if loader else None
                  if data is None:
                      raise FileNotFoundError('required export legal file is unavailable: ' + name)
                  target = legal / name
                  target.write_bytes(data)
                  hashes[name] = hashlib.sha256(data).hexdigest()
              (legal / 'SHA256SUMS.json').write_text(json.dumps(hashes, indent=2) + '\n')
              return '\n'.join([*lines, *(str(legal / n) for n in (*BUNDLE, 'SHA256SUMS.json'))])
          
          
          def main():
              workspace = Path(os.environ.get('GITHUB_WORKSPACE', '.')).absolute()
              def public_source(name):
                  # Collect-only jobs may not check out source. Fetch only these public legal files, pinned to the run commit.
                  repo, sha = os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA']
                  url = f'https://raw.githubusercontent.com/{repo}/{sha}/{urllib.parse.quote(name)}'
                  with urllib.request.urlopen(url, timeout=30) as response:
                      return response.read()
              paths = attach(os.environ['OMNI_EXPORT_PATHS'], workspace, public_source)
              delimiter = 'OMNI_LEGAL_' + uuid.uuid4().hex
              with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
                  out.write('paths<<' + delimiter + '\n' + paths + '\n' + delimiter + '\n')
          
          
          if __name__ == '__main__':
              main()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: {name: "citylearn-${{ matrix.dataset }}", path: "${{ steps.omni_legal_export_1.outputs.paths }}"}
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
  report:
    needs: run
    if: always() && needs.run.result != 'skipped'
    runs-on: ubuntu-24.04
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4: the code, not the archive of raw runs (25 GB, more than the machine's disk)
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/results/live/raw/*
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.11"}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {pattern: "citylearn-*", path: all, merge-multiple: true}
      - run: python tools/run_citylearn.py --report-only all --out all
      - run: cat all/CITYLEARN.md >> "$GITHUB_STEP_SUMMARY"
      - name: Attach README, licenses and disclosures to this artifact
        id: omni_legal_export_2
        env:
          OMNI_EXPORT_PATHS: |
            all/CITYLEARN.md
        shell: python
        run: |
          #!/usr/bin/env python3
          # SPDX-License-Identifier: LicenseRef-OmniCompass-Evaluation-1.0
          # Copyright (c) 2026 Dubra Software Inc. / The Omni-Compass LLC. All rights reserved.
          # Evaluation and Simulation use only; any commercialization, monetization or other use requires a signed, paid
          # Omni-Compass Enterprise License. See LICENSE, NOTICE and DISCLOSURES.md.
          # All patents, copyrights and trademarks filed in the USA. www.omni-compass.com
          """Attach the exact legal bundle inside an artifact without changing its result-file layout."""
          import glob
          import hashlib
          import json
          import os
          from pathlib import Path
          import urllib.parse
          import urllib.request
          import uuid
          
          BUNDLE = ('README.md', 'LICENSE', 'NOTICE', 'DISCLOSURES.md', 'PATENTS.md', 'TRADEMARKS.md')
          
          
          def search_root(pattern, workspace):
              path = Path(os.path.expanduser(pattern))
              if not path.is_absolute():
                  path = workspace / path
              prefix = Path(path.anchor)
              for part in path.parts[1:]:
                  if glob.has_magic(part):
                      return prefix
                  prefix /= part
              return path if path.is_dir() or (not path.exists() and not path.suffix) else path.parent
          
          
          def attach(paths, workspace, loader=None):
              workspace = Path(workspace).absolute()
              lines = [p.strip() for p in paths.splitlines() if p.strip()]
              roots = [search_root(p, workspace) for p in lines if not p.startswith('!')]
              if not roots:
                  raise ValueError('artifact has no positive output path')
              root = Path(os.path.commonpath([str(p) for p in roots]))
              if root == Path(root.anchor):
                  raise ValueError('refusing to write an export bundle at a filesystem root')
              legal = root / '_omni_legal'
              legal.mkdir(parents=True, exist_ok=True)
              hashes = {}
              for name in BUNDLE:
                  source = workspace / name
                  data = source.read_bytes() if source.is_file() else loader(name) if loader else None
                  if data is None:
                      raise FileNotFoundError('required export legal file is unavailable: ' + name)
                  target = legal / name
                  target.write_bytes(data)
                  hashes[name] = hashlib.sha256(data).hexdigest()
              (legal / 'SHA256SUMS.json').write_text(json.dumps(hashes, indent=2) + '\n')
              return '\n'.join([*lines, *(str(legal / n) for n in (*BUNDLE, 'SHA256SUMS.json'))])
          
          
          def main():
              workspace = Path(os.environ.get('GITHUB_WORKSPACE', '.')).absolute()
              def public_source(name):
                  # Collect-only jobs may not check out source. Fetch only these public legal files, pinned to the run commit.
                  repo, sha = os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA']
                  url = f'https://raw.githubusercontent.com/{repo}/{sha}/{urllib.parse.quote(name)}'
                  with urllib.request.urlopen(url, timeout=30) as response:
                      return response.read()
              paths = attach(os.environ['OMNI_EXPORT_PATHS'], workspace, public_source)
              delimiter = 'OMNI_LEGAL_' + uuid.uuid4().hex
              with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
                  out.write('paths<<' + delimiter + '\n' + paths + '\n' + delimiter + '\n')
          
          
          if __name__ == '__main__':
              main()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: citylearn-report, path: "${{ steps.omni_legal_export_2.outputs.paths }}"}
      - name: Legal files beside the files this run hands out
        if: always()
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: _legal
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            README.md
            LICENSE
            NOTICE
            DISCLOSURES.md
            PATENTS.md
            TRADEMARKS.md
      - name: Legal notice handed out with this run's files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: legal-notice
          overwrite: true
          path: |
            _legal/README.md
            _legal/LICENSE
            _legal/NOTICE
            _legal/DISCLOSURES.md
            _legal/PATENTS.md
            _legal/TRADEMARKS.md
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
