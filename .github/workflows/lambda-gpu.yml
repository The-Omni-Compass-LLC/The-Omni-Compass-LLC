name: lambda-gpu
run-name: lambda-gpu ${{ github.event.inputs.test || '' }} ${{ github.event.inputs.mode || '' }}${{ github.event.inputs.dial == 'save' && ' save' || '' }} ${{ github.event.inputs.tag || '' }}
# The GPU benchmark on a rented Lambda Cloud machine, one button (Actions -> lambda-gpu -> Run workflow): the 8-GPU result
# (scripts/gpu_8card.sh) or the one-card test (scripts/gpu_rented_run.sh), at the exact commit the button is pressed on.
# It shows the price first and rents nothing on a dry run (the default). Otherwise it rents one machine, ships the
# committed tree to it, starts the run, watches it from GitHub, brings every result file back as this run's artifact,
# and always gives the machine back: when the run prints its last line, or at the hour budget plus one hour whatever
# happens, or at the very end of this workflow if anything before failed; the test giveback gives back a stuck run's machine
# by its name and rents nothing. Needs three repository secrets:
# LAMBDA_API_KEY, LAMBDA_SSH_PRIVATE_KEY and LAMBDA_SSH_KEY_NAME (docs/LAMBDA_SETUP.md, click by click). Before anything
# is rented, on a dry run too, it checks at no cost that the key logs in to Lambda, that Lambda holds the SSH key named, and
# that the stored private key is its other half; a missing secret or a wrong pair turns the run red and rents nothing.
# Nothing here publishes a result: the founder hears what it says first.
on:
  workflow_dispatch:
    inputs:
      test: {description: "8card (the 8-GPU result), 1card (the one-card test), or giveback (give back a stuck run's machine: no test, nothing rented)", default: "8card"}
      mode: {description: "pooled, fast or full (8card: about 10, 3.5 or 18 hours; 1card: fast about 7, full about 30), or stacks (1card: the whole stacks with the card inside at 1, 10 and 100 copies; 1x and 10x about 23 hours on one A10, 100x after them up to the 33-hour budget), or cap (1card: an operator's power cap underneath, the cap alone against the cap with Omni-Compass on top, usual load and fully loaded, about 4 hours)", default: "pooled"}
      tag: {description: "A, B or C: which of the three runs this is (each its own machine, side by side; empty for one run)", default: ""}
      instance_type: {description: "Lambda machine type (empty: gpu_8x_a100_80gb_sxm4 for 8card, gpu_1x_a10 for 1card)", default: ""}
      region: {description: "Lambda region (empty: the first with a machine free)", default: ""}
      max_cost: {description: "Ceiling in US dollars for the hour budget plus one hour; above it nothing is rented", default: "400"}
      dry_run: {description: "Show the price and the plan, rent nothing (yes/no)", default: "yes"}
      hil_profile: {description: "Prepared organism scales: standard or 1-10-100", default: "1-10-100"}
      give_back: {description: "giveback only: the name, or the start of the name, of the machines to give back (omni-1card-, omni-8card-, or a whole name)", default: ""}
      dial: {description: "max (the factory tune: the clock ceiling held at the top while the card serves) or save (the tune-down: the verdict's steps below the top where the card's time on a request allows)", default: "max"}
permissions:
  contents: read
# one run at a time per test: the one-card and the eight-card tests may rent at once (the same money, half the wait), a
# second dispatch of the same test waits for the first; a push (which runs nothing) never takes a dispatch's place
concurrency: {group: "lambda-gpu-${{ github.event_name }}-${{ github.event.inputs.test || 'none' }}-${{ github.event.inputs.mode || '' }}-${{ github.event.inputs.dial || 'max' }}${{ github.event.inputs.tag || '' }}", cancel-in-progress: false}
env:
  OMNI_NOTICE: '© 2026 The Omni-Compass LLC. All rights reserved. **Evaluation and Simulation use only.** Any commercial use, commercialization, monetization, production use, redistribution or hosted service of any part of Omni-Compass requires a signed, paid Omni-Compass Enterprise License from The Omni-Compass LLC. Every copy, export, report and printout carries this notice with `LICENSE`, `NOTICE` and `DISCLOSURES.md`. All patents, copyrights and trademarks filed in the USA. www.omni-compass.com'
  LAMBDA_API_KEY: ${{ secrets.LAMBDA_API_KEY }}
jobs:
  giveback:
    # a run whose watch can no longer end it (a card idle under a run cancelled by hand: the watch jobs run on through a
    # cancel so a give-back is never lost, and wait for the deadline): the machines named are given back at once, from
    # here, and that run's watch sees its machine gone and ends; only omni- names, so a machine launched by hand on
    # Lambda's page is never touched. Its own queue (the test's name), so it never waits behind the run it frees.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.test == 'giveback'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {sparse-checkout: "scripts"}
      - name: Give the machines back
        env:
          WHICH: ${{ github.event.inputs.give_back }}
        run: |
          [ -n "$LAMBDA_API_KEY" ] || { echo "::error::LAMBDA_API_KEY is not in this repository's secrets."; exit 2; }
          case "$WHICH" in omni-?*) ;; *) echo "::error::give_back must start with omni- (omni-1card-, omni-8card-, or a whole name)."; exit 2;; esac
          python3 scripts/lambda_gpu.py list --prefix "" | sed 's/^/  on the account (every machine, by hand or by a run): /' || true   # read only: what bills now
          python3 -c "import sys; sys.path.insert(0, 'scripts'); import lambda_gpu as L; [print('  machine:', d.get('id'), '|', d.get('name') or '(no name: launched by hand on Lambda)', '|', d.get('status'), '|', (d.get('instance_type') or {}).get('name'), '|', (d.get('instance_type') or {}).get('price_cents_per_hour'), 'cents an hour |', (d.get('region') or {}).get('name')) for d in L.call('GET', '/instances').get('data', [])]" || true   # read only: type and price of each
          python3 scripts/lambda_gpu.py list | sed 's/^/  listed before: /' || true
          python3 scripts/lambda_gpu.py terminate --prefix "$WHICH" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 scripts/lambda_gpu.py list | sed 's/^/  still listed: /' || true
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"

  launch:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.test != 'giveback'
    runs-on: ubuntu-24.04
    timeout-minutes: 90                # Lambda allows a machine 30 minutes to boot; the wait, the login and the shipping fit
    outputs:
      launched: ${{ steps.go.outputs.launched }}
      ownkey: ${{ steps.go.outputs.ownkey }}
      ekey: ${{ steps.go.outputs.ekey }}
      id: ${{ steps.go.outputs.id }}
      ip: ${{ steps.go.outputs.ip }}
      deadline: ${{ steps.go.outputs.deadline }}
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4: the code, not the archive of raw runs (25 GB, more than the machine's disk)
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/results/live/raw/*
      - name: Engine and source receipt
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"
          python3 tools/omni_version.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Rent, ship, start (or show the price on a dry run)
        id: go
        env:
          HAVE_API: ${{ secrets.LAMBDA_API_KEY != '' }}
          HAVE_SSH: ${{ secrets.LAMBDA_SSH_PRIVATE_KEY != '' }}
          HAVE_NAME: ${{ secrets.LAMBDA_SSH_KEY_NAME != '' }}
          SSH_PRIVATE: ${{ secrets.LAMBDA_SSH_PRIVATE_KEY }}
          KEY_NAME: ${{ secrets.LAMBDA_SSH_KEY_NAME }}
          TEST: ${{ github.event.inputs.test }}
          MODE: ${{ github.event.inputs.mode }}
          TYPE_IN: ${{ github.event.inputs.instance_type }}
          REGION: ${{ github.event.inputs.region }}
          MAX_COST: ${{ github.event.inputs.max_cost }}
          DRY: ${{ github.event.inputs.dry_run }}
          HIL_PROFILE: ${{ github.event.inputs.hil_profile || '1-10-100' }}
          DIAL: ${{ github.event.inputs.dial || 'max' }}
        run: |
          set -euo pipefail
          echo "launched=false" >> "$GITHUB_OUTPUT"
          case "$DIAL" in max|save) ;; *) echo "::error::dial must be max or save, not $DIAL"; exit 2;; esac
          case "$TEST:$MODE" in
            8card:pooled) SCRIPT=scripts/gpu_8card.sh; ENVS="POOLED=1"; BUDGET=10.5;;
            8card:fast)   SCRIPT=scripts/gpu_8card.sh; ENVS="FAST=1";   BUDGET=4;;
            8card:full)   SCRIPT=scripts/gpu_8card.sh; ENVS="";         BUDGET=26;;
            1card:fast)   SCRIPT=scripts/gpu_rented_run.sh; ENVS="SKIP_DECODE=1 SKIP_CAP=1 SKIP_HIL=1 SKIP_LLM=1"; BUDGET=8;;
            1card:full)   SCRIPT=scripts/gpu_rented_run.sh; ENVS="";    BUDGET=32;;
            # the whole stacks with the card inside, nothing else: the wire check and the smoke on the real card first, then the
            # seven organisms at 1, 10 and 100 copies (tools/run_hil.py, the preregistered repetitions 5, 3 and 2 by size)
            # (24 to 26 October, one A10: 1x and 10x took about 23 hours, so the budget is the six watches' 33 hours, and every
            # finished arm is fetched however far the run got: scripts/lambda_gpu_watch.sh)
            1card:stacks) SCRIPT=scripts/gpu_rented_run.sh; ENVS="SKIP_CONFIRM=1 SKIP_DECODE=1 SKIP_CAP=1 SKIP_DRILL=1 SKIP_LLM=1"; BUDGET=32;;
            # an operator's power cap underneath, nothing else (27 October: the A100's counted run of 24 October read STEADY with no
            # write, its limit already at the top on native, so the factory tune had nothing to raise): the cap alone against the
            # cap with Omni-Compass on top at the usual load and fully loaded, 5 paired repetitions of 300 s each (the cap at the
            # envelope's lowest watts, 70% of the default limit, set by the operator in both arms: scripts/gpu_rented_run.sh)
            1card:cap)    SCRIPT=scripts/gpu_rented_run.sh; ENVS="SKIP_CONFIRM=1 SKIP_DECODE=1 SKIP_DRILL=1 SKIP_HIL=1 SKIP_LLM=1"; BUDGET=5;;
            *) echo "unknown test/mode $TEST/$MODE" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1;;
          esac
          case "$HIL_PROFILE" in
            standard) ;;
            1-10-100)
              HIL_REPS=100,100,100
              ENVS="$ENVS HIL_SCALES=1,10,100 HIL_REPS_BY_SCALE=$HIL_REPS"
              ;;
            *) echo "unsupported HIL profile: $HIL_PROFILE (use standard or 1-10-100)"; exit 1;;
          esac
          ENVS="$ENVS OMNI_DIAL=$DIAL"    # the card governor's dial (omni_controller/gpu_compass.py --dial), recorded with the run
          TYPE="${TYPE_IN:-$([ "$TEST" = 8card ] && echo gpu_8x_a100_80gb_sxm4 || echo gpu_1x_a10)}"
          HOURS=$(python3 -c "print(float('$BUDGET') + 1)")
          { echo "## The GPU benchmark on Lambda: $TEST, $MODE, dial $DIAL, commit \`${GITHUB_SHA::12}\`"; echo
            echo "Script \`$SCRIPT\` ${ENVS:+with \`$ENVS\`}; hour budget $BUDGET, given back at $HOURS hours at the latest."; echo; } >> "$GITHUB_STEP_SUMMARY"
          missing=""
          [ "$HAVE_API" = true ] || missing="$missing LAMBDA_API_KEY"
          [ "$HAVE_SSH" = true ] || missing="$missing LAMBDA_SSH_PRIVATE_KEY"
          [ "$HAVE_NAME" = true ] || missing="$missing LAMBDA_SSH_KEY_NAME"
          if [ -n "$missing" ]; then
            echo "Secrets missing:$missing (docs/LAMBDA_SETUP.md, step 3). Nothing rented." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::error::Lambda secrets missing:$missing. Nothing rented; docs/LAMBDA_SETUP.md, step 3."
            exit 1
          fi
          # the key pair, at no cost: Lambda holds the key named, and the stored private key is its other half (a wrong pair
          # would otherwise show only after a machine is rented and refuses the login)
          install -m 600 /dev/null key; printf '%s\n' "$SSH_PRIVATE" | python3 scripts/lambda_gpu.py fixkey > key
          set +e; python3 scripts/lambda_gpu.py keycheck --name "$KEY_NAME" --private-file key --resolved-out keyname.txt 2>&1 | tee keycheck.txt; krc=${PIPESTATUS[0]}; set -e
          { echo '```'; cat keycheck.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          OWN=""
          if [ "$krc" != 0 ]; then
            # the stored key cannot be used: this run makes its own pair, registers the public half with Lambda under its own
            # name, logs in with it, hands the private half to the watch jobs encrypted with the API key, and removes it from
            # Lambda at the end (24 October: three stores of the downloaded file in a row held the public line instead)
            echo "::notice::The stored SSH key is not used ($(tail -n 1 keycheck.txt | cut -c1-160)); this run makes its own key."
            rm -f key key.pub; ssh-keygen -q -t ed25519 -N "" -C "omni-gh-$GITHUB_RUN_ID" -f key
            OWN="omni-gh-$GITHUB_RUN_ID"; KEY_NAME="$OWN"
            python3 scripts/lambda_gpu.py delkey --name "$OWN" > /dev/null
            python3 scripts/lambda_gpu.py addkey --name "$OWN" --public-file key.pub > /dev/null
            echo "ownkey=$OWN" >> "$GITHUB_OUTPUT"
            echo "ekey=$(openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LAMBDA_API_KEY -in key | base64 -w0)" >> "$GITHUB_OUTPUT"
            echo "The stored SSH key was not used: this run made its own key, \`$OWN\`, registered with Lambda for this run and removed at its end." >> "$GITHUB_STEP_SUMMARY"
          fi
          [ -s keyname.txt ] && KEY_NAME=$(head -n 1 keyname.txt)       # the name Lambda holds for the stored key's other half
          set +e; python3 scripts/lambda_gpu.py plan --type "$TYPE" --hours "$HOURS" --max-cost "$MAX_COST" 2>&1 | tee plan.txt; rc=${PIPESTATUS[0]}; set -e
          { echo '```'; cat plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          [ "$rc" = 0 ] || { echo "::warning::$(tail -n 1 plan.txt) Nothing rented."; echo "Nothing rented." >> "$GITHUB_STEP_SUMMARY"; [ -z "$OWN" ] || python3 scripts/lambda_gpu.py delkey --name "$OWN"; rm -f key; exit 0; }
          if [ "$DRY" = yes ]; then echo "Dry run: the API key and an SSH key pair are ready; nothing rented." >> "$GITHUB_STEP_SUMMARY"; [ -z "$OWN" ] || python3 scripts/lambda_gpu.py delkey --name "$OWN"; rm -f key; exit 0; fi
          NAME="omni-$TEST-$(date +%s)-${BUDGET%.*}-r$GITHUB_RUN_ID"   # the run number last: its machines are found by it alone
          echo "name=$NAME" >> "$GITHUB_OUTPUT"      # a launch that fails after renting is still found by its name
          ID=$(python3 scripts/lambda_gpu.py launch --type "$TYPE" --name "$NAME" --ssh-key-name "$KEY_NAME" ${REGION:+--region "$REGION"})
          echo "id=$ID" >> "$GITHUB_OUTPUT"; echo "launched=true" >> "$GITHUB_OUTPUT"
          DEADLINE=$(python3 -c "import time; print(int(time.time() + $HOURS * 3600))")
          echo "deadline=$DEADLINE" >> "$GITHUB_OUTPUT"
          echo "Rented machine \`$ID\` ($NAME); given back by $(date -u -d @"$DEADLINE" '+%Y-%m-%d %H:%M') UTC at the latest." >> "$GITHUB_STEP_SUMMARY"
          IP=$(python3 scripts/lambda_gpu.py wait "$ID" --timeout 1800)
          echo "ip=$IP" >> "$GITHUB_OUTPUT"
          SSH="ssh -i key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 ubuntu@$IP"
          for i in $(seq 1 20); do $SSH true && break; sleep 15; done
          # the exact committed tree with its git record (the run's freeze checks read git: a plain copy stopped the run on 24
          # October), never the checkout's token or this run's key
          git config --local --unset-all 'http.https://github.com/.extraheader' || true
          tar czf "$RUNNER_TEMP/omni.tgz" --exclude=./key --exclude=./key.pub --exclude=./keycheck.txt --exclude=./keyname.txt --exclude=./plan.txt .
          mv "$RUNNER_TEMP/omni.tgz" omni.tgz
          # every step to the machine is bounded in time (24 October: the A100 run's start step waited 56 minutes on one
          # connection until the job's limit cut it off); the run itself starts detached from the connection that starts it
          timeout 900 scp -i key -o StrictHostKeyChecking=accept-new omni.tgz "ubuntu@$IP:omni.tgz"
          timeout 300 $SSH "mkdir -p omni && tar xzf omni.tgz -C omni && echo $GITHUB_SHA > omni/COMMIT"
          timeout 60 $SSH "cd omni && setsid nohup sudo -n env $ENVS bash $SCRIPT > run.log 2>&1 < /dev/null & disown; exit 0" || true
          sleep 30; timeout 60 $SSH "tail -n 5 omni/run.log; pgrep -x -f 'bash $SCRIPT' > /dev/null && echo 'the run is under way' || echo 'the run is not running'" | sed 's/^/  run: /'
          echo "Started; the watch below carries on until it is over." >> "$GITHUB_STEP_SUMMARY"
          rm -f key
      - name: Give the machine back if starting failed
        # a failed start, and a start cut off by the job's time limit or a cancel (whose outputs may never be handed on): every
        # machine of this run is found by the run number its name ends with
        if: failure() || cancelled()
        run: |
          python3 scripts/lambda_gpu.py terminate ${{ steps.go.outputs.id }} --run "$GITHUB_RUN_ID"
          python3 scripts/lambda_gpu.py delkey --name "omni-gh-$GITHUB_RUN_ID"
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"

  watch1:
    # watch 1 of 6: about 5.7 hours each, 34 hours in all; each carries on where the one before stopped
    needs: launch
    if: always() && needs.launch.outputs.launched == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    outputs: {state: "${{ steps.w.outputs.state }}"}
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4: the code, not the archive of raw runs (25 GB, more than the machine's disk)
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/results/live/raw/*
      - name: Watch, fetch, give back
        id: w
        env: {SSH_PRIVATE: "${{ secrets.LAMBDA_SSH_PRIVATE_KEY }}", EKEY: "${{ needs.launch.outputs.ekey }}"}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/key"
          if [ -n "$EKEY" ]; then printf '%s' "$EKEY" | base64 -d | openssl enc -d -aes-256-cbc -pbkdf2 -pass env:LAMBDA_API_KEY > "$RUNNER_TEMP/key"
          else printf '%s\n' "$SSH_PRIVATE" | python3 scripts/lambda_gpu.py fixkey > "$RUNNER_TEMP/key"; fi
          SSH_KEY="$RUNNER_TEMP/key" bash scripts/lambda_gpu_watch.sh "${{ needs.launch.outputs.id }}" \
            "${{ needs.launch.outputs.ip }}" "${{ needs.launch.outputs.deadline }}" 340 out
          echo "state=$(cat out/state 2>/dev/null || echo watching)" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/key"
      - name: Attach README, licenses and disclosures to this artifact
        id: omni_legal_export_1
        if: "always()"
        env:
          OMNI_EXPORT_PATHS: |
            out
        shell: python
        run: |
          #!/usr/bin/env python3
          # SPDX-License-Identifier: LicenseRef-OmniCompass-Evaluation-1.0
          # Copyright (c) 2026 The Omni-Compass LLC. All rights reserved.
          # Evaluation and Simulation use only; any commercialization, monetization or other use requires a signed, paid
          # Omni-Compass Enterprise License. See LICENSE, NOTICE and DISCLOSURES.md.
          # All patents, copyrights and trademarks filed in the USA. www.omni-compass.com
          """Attach the exact legal bundle inside an artifact without changing its result-file layout."""
          import glob
          import hashlib
          import json
          import os
          from pathlib import Path
          import urllib.parse
          import urllib.request
          import uuid
          
          BUNDLE = ('README.md', 'LICENSE', 'NOTICE', 'DISCLOSURES.md', 'PATENTS.md', 'TRADEMARKS.md')
          
          
          def search_root(pattern, workspace):
              path = Path(os.path.expanduser(pattern))
              if not path.is_absolute():
                  path = workspace / path
              prefix = Path(path.anchor)
              for part in path.parts[1:]:
                  if glob.has_magic(part):
                      return prefix
                  prefix /= part
              return path if path.is_dir() or (not path.exists() and not path.suffix) else path.parent
          
          
          def attach(paths, workspace, loader=None):
              workspace = Path(workspace).absolute()
              lines = [p.strip() for p in paths.splitlines() if p.strip()]
              roots = [search_root(p, workspace) for p in lines if not p.startswith('!')]
              if not roots:
                  raise ValueError('artifact has no positive output path')
              root = Path(os.path.commonpath([str(p) for p in roots]))
              if root == Path(root.anchor):
                  raise ValueError('refusing to write an export bundle at a filesystem root')
              legal = root / '_omni_legal'
              legal.mkdir(parents=True, exist_ok=True)
              hashes = {}
              for name in BUNDLE:
                  source = workspace / name
                  data = source.read_bytes() if source.is_file() else loader(name) if loader else None
                  if data is None:
                      raise FileNotFoundError('required export legal file is unavailable: ' + name)
                  target = legal / name
                  target.write_bytes(data)
                  hashes[name] = hashlib.sha256(data).hexdigest()
              (legal / 'SHA256SUMS.json').write_text(json.dumps(hashes, indent=2) + '\n')
              return '\n'.join([*lines, *(str(legal / n) for n in (*BUNDLE, 'SHA256SUMS.json'))])
          
          
          def main():
              workspace = Path(os.environ.get('GITHUB_WORKSPACE', '.')).absolute()
              def public_source(name):
                  # Collect-only jobs may not check out source. Fetch only these public legal files, pinned to the run commit.
                  repo, sha = os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA']
                  url = f'https://raw.githubusercontent.com/{repo}/{sha}/{urllib.parse.quote(name)}'
                  with urllib.request.urlopen(url, timeout=30) as response:
                      return response.read()
              paths = attach(os.environ['OMNI_EXPORT_PATHS'], workspace, public_source)
              delimiter = 'OMNI_LEGAL_' + uuid.uuid4().hex
              with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
                  out.write('paths<<' + delimiter + '\n' + paths + '\n' + delimiter + '\n')
          
          
          if __name__ == '__main__':
              main()
      - name: The results, as this run's artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: "lambda-gpu-${{ github.job }}-${{ github.run_id }}", path: "${{ steps.omni_legal_export_1.outputs.paths }}", if-no-files-found: ignore, retention-days: 90}
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"

  watch2:
    # watch 2 of 6: about 5.7 hours each, 34 hours in all; each carries on where the one before stopped
    needs: [launch, watch1]
    if: always() && needs.launch.outputs.launched == 'true' && needs.watch1.result != 'skipped' && !contains('done deadline gone', needs.watch1.outputs.state || 'x')
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    outputs: {state: "${{ steps.w.outputs.state }}"}
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4: the code, not the archive of raw runs (25 GB, more than the machine's disk)
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/results/live/raw/*
      - name: Watch, fetch, give back
        id: w
        env: {SSH_PRIVATE: "${{ secrets.LAMBDA_SSH_PRIVATE_KEY }}", EKEY: "${{ needs.launch.outputs.ekey }}"}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/key"
