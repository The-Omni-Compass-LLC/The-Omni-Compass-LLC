name: ycsb
# Omni-Compass on top of a database's operator-set cache size (docs/YCSB_PREREGISTRATION.md): MongoDB from its publisher's
# own repository, YCSB's published core workloads from the project's release (checked against the SHA-256 recorded before any
# run), the operator's fixed WiredTiger cache (native) against the same with the compass law on the cache size through the
# server's own console (omni). One job per workload, three paired repetitions each; one report (YCSB.md). Two workloads at a time.
on:
  workflow_dispatch:
    inputs:
      workloads:
        description: "Workloads, comma separated: tuning, b, c, f, burst; 'all' runs every one"
        default: "all"
      reps: {description: "Paired repetitions per workload", default: "3"}
      step_s: {description: "Seconds per key-space notch", default: "30"}
      objective: {description: "What the brain's verdict judges a step by: resource (work, speed, the resource and CPU together, the index's reading) or service (work and speed alone)", default: "resource"}
      native: {description: "Native: operator (the preregistered 512 MB cache) or shipped (MongoDB exactly as shipped: its own default cache)", default: "operator"}
env:
  OMNI_NOTICE: '© 2026 The Omni-Compass LLC. All rights reserved. **Evaluation and Simulation use only.** Any commercial use, commercialization, monetization, production use, redistribution or hosted service of any part of Omni-Compass requires a signed, paid Omni-Compass Enterprise License from The Omni-Compass LLC. Every copy, export, report and printout carries this notice with `LICENSE`, `NOTICE` and `DISCLOSURES.md`. All patents, copyrights and trademarks filed in the USA. www.omni-compass.com'
  MONGO_SERIES: "8.0"
# the token reads the code and nothing else: this workflow pushes nothing, starts nothing and reads no other run
# (docs/THREAT_MODEL.md, T9)
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs: {workloads: "${{ steps.w.outputs.workloads }}"}
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - id: w
        run: |
          if [ "${{ github.event.inputs.workloads }}" = all ] || [ -z "${{ github.event.inputs.workloads }}" ]; then
            w='["tuning","b","c","f","burst"]'
          else
            w=$(python3 -c "import json; print(json.dumps('${{ github.event.inputs.workloads }}'.split(',')))")
          fi
          echo "workloads=$w" | tee -a "$GITHUB_OUTPUT"
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
  run:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: {workload: "${{ fromJSON(needs.plan.outputs.workloads) }}"}
    # GitHub's ubuntu-22.04 machine (Linux 6.8, 4 cores, 16 GB), not ubuntu-24.04: from the image of 18 October (20261018.339.1)
    # ubuntu-24.04 runs Linux 7.0.0, and MongoDB 8.0 refuses or fails to start on Linux 6.19 to 7.0.13 (MongoDB's SERVER-121912,
    # its bundled TCMalloc's use of restartable sequences): all three omni-v12 runs failed there (docs/YCSB_PREREGISTRATION.md,
    # amendment 5). Every workload of A, B and C runs on this one machine.
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4: the code, not the archive of raw runs (25 GB, more than the machine's disk)
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/results/live/raw/*
      - name: Engine and source receipt
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"
          python3 tools/omni_version.py | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: {distribution: temurin, java-version: "17"}
      - run: pip install -r requirements.txt pymongo
      - name: MongoDB from its publisher's repository (signed by the publisher's key)
        run: |
          set -e
          curl -fsSL "https://www.mongodb.org/static/pgp/server-${MONGO_SERIES}.asc" | sudo gpg --dearmor -o /usr/share/keyrings/mongodb-server.gpg
          echo "deb [ signed-by=/usr/share/keyrings/mongodb-server.gpg ] https://repo.mongodb.org/apt/ubuntu $(lsb_release -cs)/mongodb-org/${MONGO_SERIES} multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org.list
          sudo apt-get update -q
          sudo apt-get install -y -q mongodb-org
          sudo systemctl enable --now mongod
          up=0
          for i in $(seq 1 30); do mongod --version >/dev/null 2>&1 && python -c "import pymongo; pymongo.MongoClient('mongodb://127.0.0.1:27017', serverSelectionTimeoutMS=2000).server_info()" 2>/dev/null && { up=1; break; }; sleep 2; done
          echo "kernel $(uname -r); $(lsb_release -ds)" | tee -a "$GITHUB_STEP_SUMMARY"
          mongod --version | head -1
          if [ "$up" != 1 ]; then
            # the server never answered: stop here with its own words, never run a workload on a server that is not up
            sudo systemctl status mongod --no-pager || true
            sudo journalctl -u mongod -n 100 --no-pager || true
            echo "::error::mongod did not answer after it was started on kernel $(uname -r)"; exit 1
          fi
          python tools/run_ycsb.py --setup --native "${{ github.event.inputs.native || 'operator' }}"
      - name: Run the workload, native and omni
        run: |
          set +e
          python tools/run_ycsb.py --workloads "${{ matrix.workload }}" --reps "${{ github.event.inputs.reps }}" --step-s "${{ github.event.inputs.step_s }}" --out out --objective "${{ github.event.inputs.objective || 'resource' }}" --native "${{ github.event.inputs.native || 'operator' }}" > run.log 2>&1
          code=$?
          tail -40 run.log
          grep "^==\|^   " run.log | tee -a "$GITHUB_STEP_SUMMARY"
          mkdir -p out
          sudo cat /var/log/mongodb/mongod.log > out/mongod.log 2>/dev/null || true
          sudo journalctl -u mongod --no-pager > out/mongod-journal.log 2>/dev/null || true   # the server's own record, in every run
          { echo "kernel $(uname -r)"; lsb_release -ds; echo "runner image ${ImageOS:-?} ${ImageVersion:-?}"; } > out/machine.txt
          exit $code
      - run: cd out && find . -type f -name '*.raw' -size +20M -delete; find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Attach README, licenses and disclosures to this artifact
        id: omni_legal_export_1
        if: "always()"
        env:
          OMNI_EXPORT_PATHS: |
            out
        shell: python
        run: |
          #!/usr/bin/env python3
          # SPDX-License-Identifier: LicenseRef-OmniCompass-Evaluation-1.0
          # Copyright (c) 2026 The Omni-Compass LLC. All rights reserved.
          # Evaluation and Simulation use only; any commercialization, monetization or other use requires a signed, paid
          # Omni-Compass Enterprise License. See LICENSE, NOTICE and DISCLOSURES.md.
          # All patents, copyrights and trademarks filed in the USA. www.omni-compass.com
          """Attach the exact legal bundle inside an artifact without changing its result-file layout."""
          import glob
          import hashlib
          import json
          import os
          from pathlib import Path
          import urllib.parse
          import urllib.request
          import uuid
          
          BUNDLE = ('README.md', 'LICENSE', 'NOTICE', 'DISCLOSURES.md', 'PATENTS.md', 'TRADEMARKS.md')
          
          
          def search_root(pattern, workspace):
              path = Path(os.path.expanduser(pattern))
              if not path.is_absolute():
                  path = workspace / path
              prefix = Path(path.anchor)
              for part in path.parts[1:]:
                  if glob.has_magic(part):
                      return prefix
                  prefix /= part
              return path if path.is_dir() or (not path.exists() and not path.suffix) else path.parent
          
          
          def attach(paths, workspace, loader=None):
              workspace = Path(workspace).absolute()
              lines = [p.strip() for p in paths.splitlines() if p.strip()]
              roots = [search_root(p, workspace) for p in lines if not p.startswith('!')]
              if not roots:
                  raise ValueError('artifact has no positive output path')
              root = Path(os.path.commonpath([str(p) for p in roots]))
              if root == Path(root.anchor):
                  raise ValueError('refusing to write an export bundle at a filesystem root')
              legal = root / '_omni_legal'
              legal.mkdir(parents=True, exist_ok=True)
              hashes = {}
              for name in BUNDLE:
                  source = workspace / name
                  data = source.read_bytes() if source.is_file() else loader(name) if loader else None
                  if data is None:
                      raise FileNotFoundError('required export legal file is unavailable: ' + name)
                  target = legal / name
                  target.write_bytes(data)
                  hashes[name] = hashlib.sha256(data).hexdigest()
              (legal / 'SHA256SUMS.json').write_text(json.dumps(hashes, indent=2) + '\n')
              return '\n'.join([*lines, *(str(legal / n) for n in (*BUNDLE, 'SHA256SUMS.json'))])
          
          
          def main():
              workspace = Path(os.environ.get('GITHUB_WORKSPACE', '.')).absolute()
              def public_source(name):
                  # Collect-only jobs may not check out source. Fetch only these public legal files, pinned to the run commit.
                  repo, sha = os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA']
                  url = f'https://raw.githubusercontent.com/{repo}/{sha}/{urllib.parse.quote(name)}'
                  with urllib.request.urlopen(url, timeout=30) as response:
                      return response.read()
              paths = attach(os.environ['OMNI_EXPORT_PATHS'], workspace, public_source)
              delimiter = 'OMNI_LEGAL_' + uuid.uuid4().hex
              with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
                  out.write('paths<<' + delimiter + '\n' + paths + '\n' + delimiter + '\n')
          
          
          if __name__ == '__main__':
              main()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: {name: "ycsb-${{ matrix.workload }}", path: "${{ steps.omni_legal_export_1.outputs.paths }}"}
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
  report:
    needs: run
    if: always() && needs.run.result != 'skipped'
    runs-on: ubuntu-24.04
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4: the code, not the archive of raw runs (25 GB, more than the machine's disk)
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/results/live/raw/*
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {pattern: "ycsb-*", path: all, merge-multiple: true}
      - run: ls all && python tools/run_ycsb.py --report-only all && cat all/YCSB.md >> "$GITHUB_STEP_SUMMARY"
      - name: Attach README, licenses and disclosures to this artifact
        id: omni_legal_export_2
        env:
          OMNI_EXPORT_PATHS: |
            all/YCSB.md
        shell: python
        run: |
          #!/usr/bin/env python3
          # SPDX-License-Identifier: LicenseRef-OmniCompass-Evaluation-1.0
          # Copyright (c) 2026 The Omni-Compass LLC. All rights reserved.
          # Evaluation and Simulation use only; any commercialization, monetization or other use requires a signed, paid
          # Omni-Compass Enterprise License. See LICENSE, NOTICE and DISCLOSURES.md.
          # All patents, copyrights and trademarks filed in the USA. www.omni-compass.com
          """Attach the exact legal bundle inside an artifact without changing its result-file layout."""
          import glob
          import hashlib
          import json
          import os
          from pathlib import Path
          import urllib.parse
          import urllib.request
          import uuid
          
          BUNDLE = ('README.md', 'LICENSE', 'NOTICE', 'DISCLOSURES.md', 'PATENTS.md', 'TRADEMARKS.md')
          
          
          def search_root(pattern, workspace):
              path = Path(os.path.expanduser(pattern))
              if not path.is_absolute():
                  path = workspace / path
              prefix = Path(path.anchor)
              for part in path.parts[1:]:
                  if glob.has_magic(part):
                      return prefix
                  prefix /= part
              return path if path.is_dir() or (not path.exists() and not path.suffix) else path.parent
          
          
          def attach(paths, workspace, loader=None):
              workspace = Path(workspace).absolute()
              lines = [p.strip() for p in paths.splitlines() if p.strip()]
              roots = [search_root(p, workspace) for p in lines if not p.startswith('!')]
              if not roots:
                  raise ValueError('artifact has no positive output path')
              root = Path(os.path.commonpath([str(p) for p in roots]))
              if root == Path(root.anchor):
                  raise ValueError('refusing to write an export bundle at a filesystem root')
              legal = root / '_omni_legal'
              legal.mkdir(parents=True, exist_ok=True)
              hashes = {}
              for name in BUNDLE:
                  source = workspace / name
                  data = source.read_bytes() if source.is_file() else loader(name) if loader else None
                  if data is None:
                      raise FileNotFoundError('required export legal file is unavailable: ' + name)
                  target = legal / name
                  target.write_bytes(data)
                  hashes[name] = hashlib.sha256(data).hexdigest()
              (legal / 'SHA256SUMS.json').write_text(json.dumps(hashes, indent=2) + '\n')
              return '\n'.join([*lines, *(str(legal / n) for n in (*BUNDLE, 'SHA256SUMS.json'))])
          
          
          def main():
              workspace = Path(os.environ.get('GITHUB_WORKSPACE', '.')).absolute()
              def public_source(name):
                  # Collect-only jobs may not check out source. Fetch only these public legal files, pinned to the run commit.
                  repo, sha = os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA']
                  url = f'https://raw.githubusercontent.com/{repo}/{sha}/{urllib.parse.quote(name)}'
                  with urllib.request.urlopen(url, timeout=30) as response:
                      return response.read()
              paths = attach(os.environ['OMNI_EXPORT_PATHS'], workspace, public_source)
              delimiter = 'OMNI_LEGAL_' + uuid.uuid4().hex
              with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
                  out.write('paths<<' + delimiter + '\n' + paths + '\n' + delimiter + '\n')
          
          
          if __name__ == '__main__':
              main()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: ycsb-report, path: "${{ steps.omni_legal_export_2.outputs.paths }}"}
      - name: Legal files beside the files this run hands out
        if: always()
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: _legal
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            README.md
            LICENSE
            NOTICE
            DISCLOSURES.md
            PATENTS.md
            TRADEMARKS.md
      - name: Legal notice handed out with this run's files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: legal-notice
          overwrite: true
          path: |
            _legal/README.md
            _legal/LICENSE
            _legal/NOTICE
            _legal/DISCLOSURES.md
            _legal/PATENTS.md
            _legal/TRADEMARKS.md
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
