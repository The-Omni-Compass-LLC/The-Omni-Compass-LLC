#
# Targeted free V27 controller verification. Does not invoke Azure, GPU or other
# paid infrastructure. Physical V27 AKS results require a separate bounded run.
name: v27-pod-scheduling-regression
on:
  pull_request:
    paths:
      - 'omni_controller/**'
      - 'tests/test_place_before_asking.py'
      - 'tests/test_standins.py'
      - 'tests/test_compass_controller.py'
      - '.github/workflows/v27-pod-scheduling-regression.yml'
      - 'docs/audits/V27_ONE_AZURE_VALIDATION_2026-11-22.md'
  push:
    branches:
      - 'audit/v27-azure-one-run-receipt-plan-20261122'
env:
  OMNI_NOTICE: '© 2026 Dubra Software Inc. / The Omni-Compass LLC. All rights reserved. **Evaluation and Simulation use only.** Any commercial use, commercialization, monetization, production use, redistribution or hosted service of any part of Omni-Compass requires a signed, paid Omni-Compass Enterprise License from Dubra Software Inc. / The Omni-Compass LLC. Every copy, export, report and printout carries this notice with LICENSE, NOTICE and DISCLOSURES.md. All patents, copyrights and trademarks filed in the USA. www.omni-compass.com'
permissions:
  contents: read
jobs:
  pod-scheduling:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\\n\\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify running source and engine identity
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python3 tools/omni_version.py
      - name: V27 place-before-asking and scheduling stand-ins
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_place_before_asking.py
          python3 tests/test_standins.py
          python3 tests/test_compass_controller.py
      - name: Explicit receipt limitation
        if: always()
        shell: bash
        run: |
          printf '%s\\n' 'This CI checks synthetic/stand-in scheduling decisions only.' 'It does not certify live Azure work per dollar, actual pod scheduling, or billed cost.' >> "$GITHUB_STEP_SUMMARY"
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\\n---\\n\\n*%s*\\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
