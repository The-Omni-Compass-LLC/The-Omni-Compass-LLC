name: prove-runs
# The one command a reader runs, run in public: GitHub's own machine builds the proof image (deploy/Dockerfile.proof: the
# toolchain alone, no copy of the repository), mounts this checkout into it read-only and runs scripts/prove_runs.sh. The log
# names the engine by its fingerprint, builds the C++ harness from source, checks every recorded set of the jump generator
# from the records themselves (tools/runs_ledger.py --check), runs one set three ways (the Python, the C++ harness, the live
# engine page's own code in node) and prints the three SHA-256 digests side by side with the digest the set's own record
# carries. It writes nothing to the repository: its record is this run's own log, which is public and not ours to edit. Our own
# models (class S): three implementations computing the same numbers, never a benchmark result. Nothing is billed.
on:
  workflow_dispatch:
    inputs:
      base: {description: "A base seed: a recorded set's (results/RUNS_LEDGER.md) or one of your own (empty: the newest recorded set)", default: ""}
      runs: {description: "Runs from the jump generator", default: "500"}
  schedule:
    # every Monday, on a freshly built image
    - cron: "23 5 * * 1"
  push:
    # a change to the proof itself is proved on GitHub before it reaches main
    branches: [main, "claude/**"]
    paths:
      - "deploy/Dockerfile.proof"
      - "scripts/prove_runs.sh"
      - ".github/workflows/prove-runs.yml"
permissions:
  contents: read
concurrency: {group: "prove-runs-${{ github.ref }}", cancel-in-progress: false}
env:
  OMNI_NOTICE: '© 2026 Dubra Software Inc. / The Omni-Compass LLC. All rights reserved. **Evaluation and Simulation use only.** Any commercial use, commercialization, monetization, production use, redistribution or hosted service of any part of Omni-Compass requires a signed, paid Omni-Compass Enterprise License from Dubra Software Inc. / The Omni-Compass LLC. Every copy, export, report and printout carries this notice with `LICENSE`, `NOTICE` and `DISCLOSURES.md`. All patents, copyrights and trademarks filed in the USA. www.omni-compass.com'
jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4: the code, not the archive of raw runs
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/results/live/raw/*
      - name: The proof image built (the toolchain alone)
        run: docker build -q -f deploy/Dockerfile.proof -t omni-proof .
      - name: The proof, in the container, on this checkout mounted read-only
        env:
          BASE: "${{ github.event.inputs.base }}"
          RUNS: "${{ github.event.inputs.runs || '500' }}"
        run: |
          set -euo pipefail
          [[ "$BASE" =~ ^[0-9]*$ ]] || { echo "::error::the base is a whole number"; exit 1; }
          [[ "$RUNS" =~ ^[0-9]+$ ]] || { echo "::error::the runs are a whole number"; exit 1; }
          {
            echo "### The jump generator's sets, proved on GitHub's machine (commit \`$GITHUB_SHA\`)"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          status=0
          docker run --rm -v "$PWD":/repo:ro omni-proof "$BASE" "$RUNS" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
