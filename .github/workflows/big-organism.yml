name: big-organism
# The organisms too big for one GitHub runner beside a cluster (1,000 copies of the whole tower, close to a million modelled muscles,
# and of the four stacked, 1.2 million): each repetition rents one larger Azure machine (Standard_D8s_v4, 8 vCPU, 32 GiB,
# list price about $0.38 an hour), runs the same paired test there (scripts/kind_paired.sh: native against native with
# Omni-Compass on top, a fresh six-worker kind cluster per arm, the organism at 1,000 copies with the real cluster
# inside), copies every file back, and deletes the machine and its resource group whatever happens. Uses the
# AZURE_CREDENTIALS secret; nothing to do by hand. 1, 10 and 100 copies only (the founder's order of 12 October): no
# 1,000-copy run is started, the default is 100, and the grid runs every square on GitHub's own machines.
on:
  workflow_dispatch:
    inputs:
      organisms: {description: "Organisms, comma separated", default: "tower,stack"}
      size: {description: "Copies of each organism on one clock (1, 10 or 100)", default: "100"}
      reps: {description: "Paired repetitions per organism", default: "3"}
      duration_s: {description: "Measured seconds per arm (240 organism steps)", default: "2880"}
      vm_size: {description: "Azure machine size", default: "Standard_D8s_v4"}
      location: {description: "Azure region", default: "eastus"}
concurrency:
  group: azure-benchmark-${{ github.event.inputs.location || 'eastus' }}
  cancel-in-progress: false
env:
  OMNI_NOTICE: '© 2026 Dubra Software Inc. / The Omni-Compass LLC. All rights reserved. **Evaluation and Simulation use only.** Any commercial use, commercialization, monetization, production use, redistribution or hosted service of any part of Omni-Compass requires a signed, paid Omni-Compass Enterprise License from Dubra Software Inc. / The Omni-Compass LLC. Every copy, export, report and printout carries this notice with `LICENSE`, `NOTICE` and `DISCLOSURES.md`. All patents, copyrights and trademarks filed in the USA. www.omni-compass.com'
# the token reads the code and nothing else: this workflow pushes nothing, starts nothing and reads no other run
# (docs/THREAT_MODEL.md, T9)
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs: {cells: "${{ steps.r.outputs.cells }}"}
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce paid cloud organism and repetition ceilings
        env:
          PAID_INPUTS: ${{ toJSON(github.event.inputs) }}
        run: |
          python3 - <<'PY_LIMITS'
          import json, os
          inputs = json.loads(os.environ.get('PAID_INPUTS') or '{}') or {}
          for key in ('size', 'scale', 'organism_scale'):
              if inputs.get(key):
                  assert int(inputs[key]) in (1, 10, 100), f'{key}: paid organism copies must be 1, 10 or 100'
          if inputs.get('reps'):
              assert 1 <= int(inputs['reps']) <= 100, 'paid repetitions must be between 1 and 100'
          PY_LIMITS
      - id: r
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          orgs = [o for o in "${{ github.event.inputs.organisms || 'tower,stack' }}".split(",") if o]
          reps = int("${{ github.event.inputs.reps || '3' }}")
          print("cells=" + json.dumps([{"organism": o, "rep": r} for o in orgs for r in range(1, reps + 1)]))
          PY
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
  run:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        cell: "${{ fromJSON(needs.plan.outputs.cells) }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      RG: omni-big-${{ github.run_id }}-${{ strategy.job-index }}
      LOC: ${{ github.event.inputs.location || 'eastus' }}
      SIZE: ${{ github.event.inputs.vm_size || 'Standard_D8s_v4' }}
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce paid cloud organism and repetition ceilings
        env:
          PAID_INPUTS: ${{ toJSON(github.event.inputs) }}
        run: |
          python3 - <<'PY_LIMITS'
          import json, os
          inputs = json.loads(os.environ.get('PAID_INPUTS') or '{}') or {}
          for key in ('size', 'scale', 'organism_scale'):
              if inputs.get(key):
                  assert int(inputs[key]) in (1, 10, 100), f'{key}: paid organism copies must be 1, 10 or 100'
          if inputs.get('reps'):
              assert 1 <= int(inputs['reps']) <= 100, 'paid repetitions must be between 1 and 100'
          PY_LIMITS
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4: the code, not the archive of raw runs (25 GB, more than the machine's disk)
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/results/live/raw/*
      - name: Engine and source receipt
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"
          python3 tools/omni_version.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The Azure key is whole (its shape only; not a character of it is printed; a key in another form never reaches the login, which would quote it)
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: python3 tools/cloud_key_check.py azure
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with: {creds: "${{ env.AZ_CREDS }}"}
      - name: Rent the machine
        run: |
          az group create -n "$RG" -l "$LOC" -o none
          # the size asked for first, then sizes with the same memory or more, in case the region or the quota refuses it;
          # Azure's own refusal is reported as an annotation (readable on the run's page and through the API)
          ok=""
          for sz in "$SIZE" Standard_D8s_v3 Standard_E4s_v4 Standard_E4s_v3 Standard_D8as_v4 Standard_B8ms; do
            if ! python3 scripts/azure_capacity.py wait --location "$LOC" --system-size "$sz" --pools '' --timeout 0; then
              echo "::notice::candidate machine unavailable within current CPU allowance; trying the next configured size"
              continue
            fi
            if az vm create -g "$RG" -n big --image Ubuntu2204 --size "$sz" --admin-username omni \
                 --generate-ssh-keys --public-ip-sku Standard --os-disk-size-gb 128 -o none 2> err.txt; then
              ok="$sz"; echo "::notice::rented $sz"; break
            fi
            echo "::warning::$sz refused: $(tr '\n' ' ' < err.txt | cut -c1-600)"
            az vm delete -g "$RG" -n big --yes -o none 2>/dev/null || true
          done
          [ -n "$ok" ] || { echo "::error::no machine size was granted"; az vm list-usage -l "$LOC" -o tsv | grep -Ei "regional|DSv4|DSv3|ESv4|ESv3|DASv4|BS " | head -8 | while read -r l; do echo "::warning::quota $l"; done; exit 1; }
          echo "SIZE=$ok" >> "$GITHUB_ENV"
          ip=$(az vm show -d -g "$RG" -n big --query publicIps -o tsv); echo "IP=$ip" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 omni@$ip true && break; sleep 10; done
      - name: Install the tools on it
        run: |
          ssh -o StrictHostKeyChecking=no omni@$IP 'set -e
            sudo apt-get update -qq && sudo apt-get install -y -qq docker.io jq git python3-pip python3-venv curl >/dev/null
            sudo usermod -aG docker omni
            # kind with seven nodes needs more inotify watchers than a fresh Ubuntu gives (kind known issues: kubelet-start fails on join)
            printf "fs.inotify.max_user_watches=524288\nfs.inotify.max_user_instances=512\n" | sudo tee /etc/sysctl.d/99-kind.conf >/dev/null && sudo sysctl -q --system
            curl -fsSLo kind https://github.com/kubernetes-sigs/kind/releases/latest/download/kind-linux-amd64 && sudo install kind /usr/local/bin/kind   # the same current kind the GitHub runs get (Kubernetes 1.34+, which the harness needs)
            curl -fsSLo kubectl "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" && sudo install kubectl /usr/local/bin/kubectl
            git clone -q https://github.com/${{ github.repository }}.git omni && cd omni && git checkout -q ${{ github.sha }}
            python3 -m venv .v && .v/bin/pip install -q -r requirements.txt'
      - name: Run the paired test on it
        run: |
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 omni@$IP "cd omni && sg docker -c '
            export PATH=\$PWD/.v/bin:\$PATH REP=${{ matrix.cell.rep }} ARMS=\"native compass\" DURATION=${{ github.event.inputs.duration_s || '2880' }}
            export ORGANISM=${{ matrix.cell.organism }} ORGANISM_SCALE=${{ github.event.inputs.size || '100' }} LOAD_MAX=6 LOADGEN=open
            export CLOSURE=tuning/GLOBAL_LEAGUE_PREREGISTRATION.json
            bash scripts/kind_paired.sh > paired.log 2>&1; echo \$? > paired.exit'" || true
          scp -o StrictHostKeyChecking=no "omni@$IP:omni/paired.log" "omni@$IP:omni/paired.exit" . 2>/dev/null || true
          code=$(cat paired.exit 2>/dev/null || echo missing)
          if [ "$code" != 0 ]; then
            # the lines that say why (kind's own progress lines left out), then the end of the log
            grep -v -E "^ [✓•]|Preparing nodes|^Set kubectl context|^You can now use|^Have a nice day|^Thanks for using kind" paired.log 2>/dev/null \
              | grep -i -E "error|invalid|fail|refused|denied|not found|cannot|timed out|exit" | tail -10 | while IFS= read -r l; do echo "::warning::$l"; done
            grep -v -E "^ [✓•]|Preparing nodes" paired.log 2>/dev/null | tail -10 | while IFS= read -r l; do echo "::notice::$l"; done
            echo "::error::the paired test on the rented machine ended with $code (paired.log in the artifact)"; exit 1
          fi
      - name: Copy every file back
        if: always()
        run: |
          mkdir -p out && scp -o StrictHostKeyChecking=no -r "omni@$IP:omni/bench-*" out/ || true
          cp paired.log out/ 2>/dev/null || true
          ssh -o StrictHostKeyChecking=no omni@$IP 'free -g; df -h /' > out/machine.txt 2>&1 || true
          echo "${{ matrix.cell.organism }} x${{ github.event.inputs.size || '100' }} rep ${{ matrix.cell.rep }} on $SIZE" >> out/machine.txt
      - name: Attach README, licenses and disclosures to this artifact
        id: omni_legal_export_1
        if: "always()"
        env:
          OMNI_EXPORT_PATHS: |
            out
        shell: python
        run: |
          #!/usr/bin/env python3
          # SPDX-License-Identifier: LicenseRef-OmniCompass-Evaluation-1.0
          # Copyright (c) 2026 Dubra Software Inc. / The Omni-Compass LLC. All rights reserved.
          # Evaluation and Simulation use only; any commercialization, monetization or other use requires a signed, paid
          # Omni-Compass Enterprise License. See LICENSE, NOTICE and DISCLOSURES.md.
          # All patents, copyrights and trademarks filed in the USA. www.omni-compass.com
          """Attach the exact legal bundle inside an artifact without changing its result-file layout."""
          import glob
          import hashlib
          import json
          import os
          from pathlib import Path
          import urllib.parse
          import urllib.request
          import uuid
          
          BUNDLE = ('README.md', 'LICENSE', 'NOTICE', 'DISCLOSURES.md', 'PATENTS.md', 'TRADEMARKS.md')
          
          
          def search_root(pattern, workspace):
              path = Path(os.path.expanduser(pattern))
              if not path.is_absolute():
                  path = workspace / path
              prefix = Path(path.anchor)
              for part in path.parts[1:]:
                  if glob.has_magic(part):
                      return prefix
                  prefix /= part
              return path if path.is_dir() or (not path.exists() and not path.suffix) else path.parent
          
          
          def attach(paths, workspace, loader=None):
              workspace = Path(workspace).absolute()
              lines = [p.strip() for p in paths.splitlines() if p.strip()]
              roots = [search_root(p, workspace) for p in lines if not p.startswith('!')]
              if not roots:
                  raise ValueError('artifact has no positive output path')
              root = Path(os.path.commonpath([str(p) for p in roots]))
              if root == Path(root.anchor):
                  raise ValueError('refusing to write an export bundle at a filesystem root')
              legal = root / '_omni_legal'
              legal.mkdir(parents=True, exist_ok=True)
              hashes = {}
              for name in BUNDLE:
                  source = workspace / name
                  data = source.read_bytes() if source.is_file() else loader(name) if loader else None
                  if data is None:
                      raise FileNotFoundError('required export legal file is unavailable: ' + name)
                  target = legal / name
                  target.write_bytes(data)
                  hashes[name] = hashlib.sha256(data).hexdigest()
              (legal / 'SHA256SUMS.json').write_text(json.dumps(hashes, indent=2) + '\n')
              return '\n'.join([*lines, *(str(legal / n) for n in (*BUNDLE, 'SHA256SUMS.json'))])
          
          
          def main():
              workspace = Path(os.environ.get('GITHUB_WORKSPACE', '.')).absolute()
              def public_source(name):
                  # Collect-only jobs may not check out source. Fetch only these public legal files, pinned to the run commit.
                  repo, sha = os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA']
                  url = f'https://raw.githubusercontent.com/{repo}/{sha}/{urllib.parse.quote(name)}'
                  with urllib.request.urlopen(url, timeout=30) as response:
                      return response.read()
              paths = attach(os.environ['OMNI_EXPORT_PATHS'], workspace, public_source)
              delimiter = 'OMNI_LEGAL_' + uuid.uuid4().hex
              with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
                  out.write('paths<<' + delimiter + '\n' + paths + '\n' + delimiter + '\n')
          
          
          if __name__ == '__main__':
              main()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: {name: "six-${{ matrix.cell.organism }}-x${{ github.event.inputs.size || '100' }}-${{ matrix.cell.rep }}", path: "${{ steps.omni_legal_export_1.outputs.paths }}"}
      - name: Delete the machine
        if: always()
        run: python3 scripts/azure_capacity.py cleanup --group "$RG"
      - name: Legal files beside the files this run hands out
        if: always() && strategy.job-index == 0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: _legal
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            README.md
            LICENSE
            NOTICE
            DISCLOSURES.md
            PATENTS.md
            TRADEMARKS.md
      - name: Legal notice handed out with this run's files
        if: always() && strategy.job-index == 0
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: legal-notice
          overwrite: true
          path: |
            _legal/README.md
            _legal/LICENSE
            _legal/NOTICE
            _legal/DISCLOSURES.md
            _legal/PATENTS.md
            _legal/TRADEMARKS.md
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
