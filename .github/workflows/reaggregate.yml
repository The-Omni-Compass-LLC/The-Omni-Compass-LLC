name: reaggregate
# Recompute a finished benchmark-reps run's table with the current tools/live_reps.py, from that run's own raw files
# (its paired-* artifacts), without rerunning anything. The run id comes from the dispatch input, or from
# results/live/reaggregate_run.txt on a push that changes that file. The table goes to the job summary and log, and to
# results/live/reaggregated/LIVE_REPS_<run id>.md committed back to the branch.
on:
  workflow_dispatch:
    inputs:
      run_id: {description: "benchmark-reps run id", required: true}
  push:
    paths: ["results/live/reaggregate_run.txt"]
permissions:
  contents: write
  actions: read
env:
  OMNI_NOTICE: '© 2026 Dubra Software Inc. / The Omni-Compass LLC. All rights reserved. **Evaluation and Simulation use only.** Any commercial use, commercialization, monetization, production use, redistribution or hosted service of any part of Omni-Compass requires a signed, paid Omni-Compass Enterprise License from Dubra Software Inc. / The Omni-Compass LLC. Every copy, export, report and printout carries this notice with `LICENSE`, `NOTICE` and `DISCLOSURES.md`. All patents, copyrights and trademarks filed in the USA. www.omni-compass.com'
jobs:
  reaggregate:
    runs-on: ubuntu-24.04
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4: the code, not the archive of raw runs (25 GB, more than the machine's disk)
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/results/live/raw/*
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - id: rid
        run: |
          ID="${{ github.event.inputs.run_id }}"
          [ -z "$ID" ] && ID=$(head -1 results/live/reaggregate_run.txt | tr -dc 0-9)
          echo "id=$ID" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: "paired-*"
          path: reps
          merge-multiple: true
          run-id: ${{ steps.rid.outputs.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: python tools/live_reps.py reps
      - run: python tools/closed_loop_estimate.py reps | tee -a reps/LIVE_REPS.md
      - run: cat reps/LIVE_REPS.md >> "$GITHUB_STEP_SUMMARY"
      - name: commit the recomputed table
        run: |
          mkdir -p results/live/reaggregated
          cp reps/LIVE_REPS.md "results/live/reaggregated/LIVE_REPS_${{ steps.rid.outputs.id }}.md"
          cp reps/LIVE_REPS.json "results/live/reaggregated/LIVE_REPS_${{ steps.rid.outputs.id }}.json"
          cp reps/CLOSED_LOOP_ESTIMATE.json "results/live/reaggregated/CLOSED_LOOP_ESTIMATE_${{ steps.rid.outputs.id }}.json" || true
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 tools/legal.py --fix results/live/reaggregated
          git add results/live/reaggregated
          git commit -m "Recomputed run ${{ steps.rid.outputs.id }} with the current tools/live_reps.py" || exit 0
          for i in 1 2 3 4; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep $((2**i)); done
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
