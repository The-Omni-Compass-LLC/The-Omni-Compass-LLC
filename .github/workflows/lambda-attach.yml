  watch3:
    # watch 3 of 6: about 5.7 hours each, 34 hours in all; each carries on where the one before stopped
    needs: [launch, watch2]
    if: always() && needs.launch.outputs.launched == 'true' && needs.watch2.result != 'skipped' && !contains('done deadline gone', needs.watch2.outputs.state || 'x')
    runs-on: ubuntu-24.04
