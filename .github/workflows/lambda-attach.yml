  give-back:
    # whatever happened above, the machine goes back when give_back is yes (asking twice); with no it is kept, and this run's
    # own key is taken off it
    needs: [launch, watch1, watch2, watch3, watch4, watch5, watch6]
    if: always() && needs.launch.outputs.launched == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4: the code, not the archive of raw runs (25 GB, more than the machine's disk)
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/results/live/raw/*
      - name: Give the machine back, or take this run's key off it
        env: {EKEY: "${{ needs.launch.outputs.ekey }}", ID: "${{ needs.launch.outputs.id }}"}
        run: |
          if [ "${{ github.event.inputs.give_back }}" = no ]; then
            python3 -m pip install -q websocket-client
            install -m 600 /dev/null "$RUNNER_TEMP/key"
            printf '%s' "$EKEY" | base64 -d | openssl enc -d -aes-256-cbc -pbkdf2 -pass env:LAMBDA_API_KEY > "$RUNNER_TEMP/key" || true
            ssh-keygen -y -f "$RUNNER_TEMP/key" > key.pub 2>/dev/null && python3 scripts/lambda_attach.py deauthorize "$ID" --public-file key.pub || true
            rm -f "$RUNNER_TEMP/key"
            echo "The machine is kept (give_back: no): it bills until it is given back on cloud.lambda.ai." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          bad=0
          python3 scripts/lambda_gpu.py terminate "$ID" || { sleep 30; python3 scripts/lambda_gpu.py terminate "$ID"; } || {
            bad=1; echo "::error::Lambda did not confirm the machine given back: it may still be billing. Terminate it by hand: cloud.lambda.ai, Instances, tick it, Terminate."; }
          exit $bad
      - name: Where the results are
        if: always()
        run: |
          { echo "The results are this run's artifacts (lambda-attach-watch*-${{ github.run_id }}); the archive bot lands every"
            echo "finished run's files on the branch raw by itself."; } >> "$GITHUB_STEP_SUMMARY"
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
