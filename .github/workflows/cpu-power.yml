name: cpu-power
# Omni-Compass on top of the Linux kernel's own CPU frequency governor, energy read by the processor's own meter
# (docs/CPU_POWER_PREREGISTRATION.md). GitHub's own machines are virtual: they expose neither the governor nor the meter, so
# here they run the harness's tests and the probe only (expected: "CANNOT RUN HERE"). The benchmark itself runs on a machine
# whose kernel exposes both, as root: a self-hosted runner registered on the founder's own tower or on a rented bare-metal
# server, named by its label in the `runner` input; or by hand with scripts/cpu_power_run.sh.
on:
  workflow_dispatch:
    inputs:
      runner: {description: "Where the benchmark runs: the label of a self-hosted runner on a machine whose governor and meter are writable; ubuntu-24.04 runs the checks and the probe only", default: "ubuntu-24.04"}
      workloads: {description: "Workloads, comma separated: tuning, wandering, burst; 'all' runs every one", default: "all"}
      reps: {description: "Paired repetitions per workload", default: "3"}
      step_s: {description: "Seconds per demand step", default: "60"}
      objective: {description: "What the brain's verdict judges a notch by: resource (energy, speed and work together, the index's reading), per-work (energy per request inside the line, the line the guardrail) or service (speed and work alone)", default: "resource"}
env:
  OMNI_NOTICE: '© 2026 The Omni-Compass LLC. All rights reserved. **Evaluation and Simulation use only.** Any commercial use, commercialization, monetization, production use, redistribution or hosted service of any part of Omni-Compass requires a signed, paid Omni-Compass Enterprise License from The Omni-Compass LLC. Every copy, export, report and printout carries this notice with `LICENSE`, `NOTICE` and `DISCLOSURES.md`. All patents, copyrights and trademarks filed in the USA. www.omni-compass.com'
# the token reads the code and nothing else: this workflow pushes nothing, starts nothing and reads no other run
# (docs/THREAT_MODEL.md, T9)
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4: the code, not the archive of raw runs (25 GB, more than the machine's disk)
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/results/live/raw/*
      - name: Engine and source receipt
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"
          python3 tools/omni_version.py | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python tools/omni_version.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The harness's own checks (a modelled machine)
        run: python -m unittest -v tests.test_run_cpu_power
      - name: "Can this machine run it? (GitHub's machines are virtual: expected no)"
        run: |
          set +e
          set -o pipefail
          sudo -E python3 tools/run_cpu_power.py --probe | tee -a "$GITHUB_STEP_SUMMARY"
          code=$?
          if [ "$code" -eq 2 ]; then
            echo "::notice::CPU power benchmark unavailable on this virtual runner; use eligible bare metal."
            exit 0
          fi
          exit "$code"
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
  run:
    needs: checks
    if: github.event.inputs.runner != '' && !startsWith(github.event.inputs.runner, 'ubuntu-')
    runs-on: ${{ github.event.inputs.runner }}
    timeout-minutes: 720
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4: the code, not the archive of raw runs (25 GB, more than the machine's disk)
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/results/live/raw/*
      - run: python3 -m pip install -q -r requirements.txt
      - run: python3 tools/omni_version.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The machine, as found
        shell: bash
        run: |
          set -euo pipefail
          sudo -E python3 tools/run_cpu_power.py --probe | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run every workload, native and omni
        run: |
          set +e
          sudo -E python3 tools/run_cpu_power.py --workloads "${{ github.event.inputs.workloads }}" --reps "${{ github.event.inputs.reps }}" --step-s "${{ github.event.inputs.step_s }}" --objective "${{ github.event.inputs.objective || 'resource' }}" --out out > run.log 2>&1
          code=$?
          sudo chown -R "$(id -u):$(id -g)" out run.log || true
          tail -40 run.log
          # A summary without matching lines must not overwrite the actual benchmark exit status.
          { grep -E "^(==|   )" run.log || true; } | tee -a "$GITHUB_STEP_SUMMARY"
          mkdir -p out
          mv run.log out/run.log
          exit "$code"
      - run: cd out && find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - run: cat out/CPU_POWER.md >> "$GITHUB_STEP_SUMMARY"
      - name: Attach README, licenses and disclosures to this artifact
        id: omni_legal_export_1
        if: "always()"
        env:
          OMNI_EXPORT_PATHS: |
            out
        shell: python
        run: |
          #!/usr/bin/env python3
          # SPDX-License-Identifier: LicenseRef-OmniCompass-Evaluation-1.0
          # Copyright (c) 2026 The Omni-Compass LLC. All rights reserved.
          # Evaluation and Simulation use only; any commercialization, monetization or other use requires a signed, paid
          # Omni-Compass Enterprise License. See LICENSE, NOTICE and DISCLOSURES.md.
          # All patents, copyrights and trademarks filed in the USA. www.omni-compass.com
          """Attach the exact legal bundle inside an artifact without changing its result-file layout."""
          import glob
          import hashlib
          import json
          import os
          from pathlib import Path
          import urllib.parse
          import urllib.request
          import uuid
          
          BUNDLE = ('README.md', 'LICENSE', 'NOTICE', 'DISCLOSURES.md', 'PATENTS.md', 'TRADEMARKS.md')
          
          
          def search_root(pattern, workspace):
              path = Path(os.path.expanduser(pattern))
              if not path.is_absolute():
                  path = workspace / path
              prefix = Path(path.anchor)
              for part in path.parts[1:]:
                  if glob.has_magic(part):
                      return prefix
                  prefix /= part
              return path if path.is_dir() or (not path.exists() and not path.suffix) else path.parent
          
          
          def attach(paths, workspace, loader=None):
              workspace = Path(workspace).absolute()
              lines = [p.strip() for p in paths.splitlines() if p.strip()]
              roots = [search_root(p, workspace) for p in lines if not p.startswith('!')]
              if not roots:
                  raise ValueError('artifact has no positive output path')
              root = Path(os.path.commonpath([str(p) for p in roots]))
              if root == Path(root.anchor):
                  raise ValueError('refusing to write an export bundle at a filesystem root')
              legal = root / '_omni_legal'
              legal.mkdir(parents=True, exist_ok=True)
              hashes = {}
              for name in BUNDLE:
                  source = workspace / name
                  data = source.read_bytes() if source.is_file() else loader(name) if loader else None
                  if data is None:
                      raise FileNotFoundError('required export legal file is unavailable: ' + name)
                  target = legal / name
                  target.write_bytes(data)
                  hashes[name] = hashlib.sha256(data).hexdigest()
              (legal / 'SHA256SUMS.json').write_text(json.dumps(hashes, indent=2) + '\n')
              return '\n'.join([*lines, *(str(legal / n) for n in (*BUNDLE, 'SHA256SUMS.json'))])
          
          
          def main():
              workspace = Path(os.environ.get('GITHUB_WORKSPACE', '.')).absolute()
              def public_source(name):
                  # Collect-only jobs may not check out source. Fetch only these public legal files, pinned to the run commit.
                  repo, sha = os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA']
                  url = f'https://raw.githubusercontent.com/{repo}/{sha}/{urllib.parse.quote(name)}'
                  with urllib.request.urlopen(url, timeout=30) as response:
                      return response.read()
              paths = attach(os.environ['OMNI_EXPORT_PATHS'], workspace, public_source)
              delimiter = 'OMNI_LEGAL_' + uuid.uuid4().hex
              with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
                  out.write('paths<<' + delimiter + '\n' + paths + '\n' + delimiter + '\n')
          
          
          if __name__ == '__main__':
              main()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: {name: cpu-power, path: "${{ steps.omni_legal_export_1.outputs.paths }}"}
      - name: Legal files beside the files this run hands out
        if: always()
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: _legal
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            README.md
            LICENSE
            NOTICE
            DISCLOSURES.md
            PATENTS.md
            TRADEMARKS.md
      - name: Legal notice handed out with this run's files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: legal-notice
          overwrite: true
          path: |
            _legal/README.md
            _legal/LICENSE
            _legal/NOTICE
            _legal/DISCLOSURES.md
            _legal/PATENTS.md
            _legal/TRADEMARKS.md
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
