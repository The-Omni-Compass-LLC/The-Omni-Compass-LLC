              (legal / 'SHA256SUMS.json').write_text(json.dumps(hashes, indent=2) + '\n')
              return '\n'.join([*lines, *(str(legal / n) for n in (*BUNDLE, 'SHA256SUMS.json'))])
          
          
          def main():
              workspace = Path(os.environ.get('GITHUB_WORKSPACE', '.')).absolute()
              def public_source(name):
                  # Collect-only jobs may not check out source. Fetch only these public legal files, pinned to the run commit.
                  repo, sha = os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA']
                  url = f'https://raw.githubusercontent.com/{repo}/{sha}/{urllib.parse.quote(name)}'
                  with urllib.request.urlopen(url, timeout=30) as response:
                      return response.read()
              paths = attach(os.environ['OMNI_EXPORT_PATHS'], workspace, public_source)
              delimiter = 'OMNI_LEGAL_' + uuid.uuid4().hex
              with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
                  out.write('paths<<' + delimiter + '\n' + paths + '\n' + delimiter + '\n')
          
          
          if __name__ == '__main__':
              main()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: {name: goldilocks-reps, path: "${{ steps.omni_legal_export_2.outputs.paths }}"}
      - name: The results, saved on the branch raw
        if: always()
        run: |
          [ -d reps-goldilocks ] || exit 0
          d="results/live/raw/goldilocks-run-${{ github.run_id }}"
          mkdir -p "$d"
          cp -r reps-goldilocks/. "$d/"
          ( cd "$d" && find . -type f ! -name SHA256SUMS_ALL.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS_ALL.txt )
          # onto the branch raw, built on its newest tip (scripts/raw_archive.sh); main's tree keeps the code and the tables
          bash scripts/raw_archive.sh save "${d#results/live/raw/}" "Goldilocks test, run ${{ github.run_id }}: raw files and table"
      - name: Legal files beside the files this run hands out
        if: always()
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: _legal
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            README.md
            LICENSE
            NOTICE
            DISCLOSURES.md
            PATENTS.md
            TRADEMARKS.md
      - name: Legal notice handed out with this run's files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: legal-notice
          overwrite: true
          path: |
            _legal/README.md
            _legal/LICENSE
            _legal/NOTICE
            _legal/DISCLOSURES.md
            _legal/PATENTS.md
            _legal/TRADEMARKS.md
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
