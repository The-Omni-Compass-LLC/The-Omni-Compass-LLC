name: swarm
# Omni-Compass on top of a drone swarm's own autopilots (docs/SWARM_PREREGISTRATION.md): gym-pybullet-drones (University
# of Toronto, DSL; MIT) integrates every Crazyflie 2.x and flies it with the position controller it ships with. One job per
# cell (the tuning swarm of 5 drones; the untouched swarms of 20: short, mixed and long missions, and from omni-v12 the same
# three on mission draws never flown, amendment 2), native and omni on the same missions; one report (SWARM.md) and one JSON per cell. The package is installed from its repository at a pinned
# commit (it is not on PyPI) without its learning extras, which the controller does not need.
on:
  workflow_dispatch:
    inputs:
      cells:
        description: "Cells, comma separated: tuning, short, mixed, long, short-314, mixed-315, long-316 (fresh draws, amendment 2); 'all' runs every cell"
        default: "all"
env:
  OMNI_NOTICE: '© 2026 The Omni-Compass LLC / Dubra Software. All rights reserved. **Evaluation and Simulation use only.** Any commercial use, commercialization, monetization, production use, redistribution or hosted service of any part of Omni-Compass requires a signed, paid Omni-Compass Enterprise License from The Omni-Compass LLC / Dubra Software. Every copy, export, report and printout carries this notice with `LICENSE`, `NOTICE` and `DISCLOSURES.md`. All patents, copyrights and trademarks filed in the USA. www.omni-compass.com'
# the token reads the code and nothing else: this workflow pushes nothing, starts nothing and reads no other run
# (docs/THREAT_MODEL.md, T9)
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs: {cells: "${{ steps.c.outputs.cells }}"}
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - id: c
        run: |
          if [ "${{ github.event.inputs.cells }}" = all ] || [ -z "${{ github.event.inputs.cells }}" ]; then
            cells='["tuning","short","mixed","long","short-314","mixed-315","long-316"]'
          else
            cells=$(python3 -c "import json; print(json.dumps('${{ github.event.inputs.cells }}'.split(',')))")
          fi
          echo "cells=$cells" | tee -a "$GITHUB_OUTPUT"
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
  run:
    needs: plan
    strategy:
      fail-fast: false
      matrix: {cell: "${{ fromJSON(needs.plan.outputs.cells) }}"}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4: the code, not the archive of raw runs (25 GB, more than the machine's disk)
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/results/live/raw/*
      - name: Engine and source receipt
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"
          python3 tools/omni_version.py | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: The simulator, pinned (gym-pybullet-drones 2.2.0 at 7ebad1ec, MIT; PyBullet)
        run: |
          pip install numpy scipy matplotlib pillow gymnasium transforms3d pybullet
          pip install --no-deps "git+https://github.com/utiasDSL/gym-pybullet-drones@7ebad1ecabd28a7000add2d05f888aa2e837c2cc"
          python -c "import gym_pybullet_drones, pybullet; print('gym-pybullet-drones', gym_pybullet_drones.__file__); print('pybullet ok')"
      - name: Fly the cell, native and omni
        run: python tools/run_swarm.py --cell "${{ matrix.cell }}" --out "swarm-${{ matrix.cell }}" 2>&1 | grep -v "gym.logger\|WARN\|\[INFO\]" | tee -a "$GITHUB_STEP_SUMMARY"
      - run: cd "swarm-${{ matrix.cell }}" && sha256sum * > SHA256SUMS.txt
      - name: Attach README, licenses and disclosures to this artifact
        id: omni_legal_export_1
        env:
          OMNI_EXPORT_PATHS: |
            swarm-${{ matrix.cell }}
        shell: python
        run: |
          #!/usr/bin/env python3
          # SPDX-License-Identifier: LicenseRef-OmniCompass-Evaluation-1.0
          # Copyright (c) 2026 The Omni-Compass LLC / Dubra Software. All rights reserved.
          # Evaluation and Simulation use only; any commercialization, monetization or other use requires a signed, paid
          # Omni-Compass Enterprise License. See LICENSE, NOTICE and DISCLOSURES.md.
          # All patents, copyrights and trademarks filed in the USA. www.omni-compass.com
          """Attach the exact legal bundle inside an artifact without changing its result-file layout."""
          import glob
          import hashlib
          import json
          import os
          from pathlib import Path
          import urllib.parse
          import urllib.request
          import uuid
          
          BUNDLE = ('README.md', 'LICENSE', 'NOTICE', 'DISCLOSURES.md', 'PATENTS.md', 'TRADEMARKS.md')
          
          
          def search_root(pattern, workspace):
              path = Path(os.path.expanduser(pattern))
              if not path.is_absolute():
                  path = workspace / path
              prefix = Path(path.anchor)
              for part in path.parts[1:]:
                  if glob.has_magic(part):
                      return prefix
                  prefix /= part
              return path if path.is_dir() or (not path.exists() and not path.suffix) else path.parent
          
          
          def attach(paths, workspace, loader=None):
              workspace = Path(workspace).absolute()
              lines = [p.strip() for p in paths.splitlines() if p.strip()]
              roots = [search_root(p, workspace) for p in lines if not p.startswith('!')]
              if not roots:
                  raise ValueError('artifact has no positive output path')
              root = Path(os.path.commonpath([str(p) for p in roots]))
              if root == Path(root.anchor):
                  raise ValueError('refusing to write an export bundle at a filesystem root')
              legal = root / '_omni_legal'
              legal.mkdir(parents=True, exist_ok=True)
              hashes = {}
              for name in BUNDLE:
                  source = workspace / name
                  data = source.read_bytes() if source.is_file() else loader(name) if loader else None
                  if data is None:
                      raise FileNotFoundError('required export legal file is unavailable: ' + name)
                  target = legal / name
                  target.write_bytes(data)
                  hashes[name] = hashlib.sha256(data).hexdigest()
              (legal / 'SHA256SUMS.json').write_text(json.dumps(hashes, indent=2) + '\n')
              return '\n'.join([*lines, *(str(legal / n) for n in (*BUNDLE, 'SHA256SUMS.json'))])
          
          
          def main():
              workspace = Path(os.environ.get('GITHUB_WORKSPACE', '.')).absolute()
              def public_source(name):
                  # Collect-only jobs may not check out source. Fetch only these public legal files, pinned to the run commit.
                  repo, sha = os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA']
                  url = f'https://raw.githubusercontent.com/{repo}/{sha}/{urllib.parse.quote(name)}'
                  with urllib.request.urlopen(url, timeout=30) as response:
                      return response.read()
              paths = attach(os.environ['OMNI_EXPORT_PATHS'], workspace, public_source)
              delimiter = 'OMNI_LEGAL_' + uuid.uuid4().hex
              with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
                  out.write('paths<<' + delimiter + '\n' + paths + '\n' + delimiter + '\n')
          
          
          if __name__ == '__main__':
              main()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: "swarm-${{ matrix.cell }}", path: "${{ steps.omni_legal_export_1.outputs.paths }}"}
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
  report:
    needs: run
    if: always() && needs.run.result != 'skipped'
    runs-on: ubuntu-24.04
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4: the code, not the archive of raw runs (25 GB, more than the machine's disk)
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/results/live/raw/*
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {pattern: "swarm-*", path: cells, merge-multiple: true}
      - run: ls cells && python tools/run_swarm.py --report-only cells && cat cells/SWARM.md >> "$GITHUB_STEP_SUMMARY"
      - name: Attach README, licenses and disclosures to this artifact
        id: omni_legal_export_2
        env:
          OMNI_EXPORT_PATHS: |
            cells/SWARM.md
        shell: python
        run: |
          #!/usr/bin/env python3
          # SPDX-License-Identifier: LicenseRef-OmniCompass-Evaluation-1.0
          # Copyright (c) 2026 The Omni-Compass LLC / Dubra Software. All rights reserved.
          # Evaluation and Simulation use only; any commercialization, monetization or other use requires a signed, paid
          # Omni-Compass Enterprise License. See LICENSE, NOTICE and DISCLOSURES.md.
          # All patents, copyrights and trademarks filed in the USA. www.omni-compass.com
          """Attach the exact legal bundle inside an artifact without changing its result-file layout."""
          import glob
          import hashlib
          import json
          import os
          from pathlib import Path
          import urllib.parse
          import urllib.request
          import uuid
          
          BUNDLE = ('README.md', 'LICENSE', 'NOTICE', 'DISCLOSURES.md', 'PATENTS.md', 'TRADEMARKS.md')
          
          
          def search_root(pattern, workspace):
              path = Path(os.path.expanduser(pattern))
              if not path.is_absolute():
                  path = workspace / path
              prefix = Path(path.anchor)
