                      return response.read()
              paths = attach(os.environ['OMNI_EXPORT_PATHS'], workspace, public_source)
              delimiter = 'OMNI_LEGAL_' + uuid.uuid4().hex
              with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
                  out.write('paths<<' + delimiter + '\n' + paths + '\n' + delimiter + '\n')
          
          
          if __name__ == '__main__':
              main()
      - name: The results, as this run's artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: "aws-gpu-${{ github.job }}-${{ github.run_id }}", path: "${{ steps.omni_legal_export_6.outputs.paths }}", if-no-files-found: ignore, retention-days: 90}
      - name: Legal files beside the files this run hands out
        if: always()
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: _legal
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            README.md
            LICENSE
            NOTICE
            DISCLOSURES.md
            PATENTS.md
            TRADEMARKS.md
      - name: Legal notice handed out with this run's files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: legal-notice
          overwrite: true
          path: |
            _legal/README.md
            _legal/LICENSE
            _legal/NOTICE
            _legal/DISCLOSURES.md
            _legal/PATENTS.md
            _legal/TRADEMARKS.md
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"

  give-back:
    # whatever happened above, the machine goes back (asking twice; an already given-back machine is fine)
    needs: [launch, watch1, watch2, watch3, watch4, watch5, watch6]
    if: always() && needs.launch.result != 'skipped'
    runs-on: ubuntu-24.04
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {sparse-checkout: "scripts"}
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ github.event.inputs.region || 'us-east-1' }}
      - name: Give the machine back
        run: |
          id="${{ needs.launch.outputs.id }}"
          bash scripts/aws_gpu.sh terminate $id --run "$GITHUB_RUN_ID" --region "$AWS_REGION" || { sleep 30; bash scripts/aws_gpu.sh terminate $id --run "$GITHUB_RUN_ID" --region "$AWS_REGION"; } || {
            echo "::error::Amazon did not confirm this run's machine given back: it may still be billing (it terminates itself at its deadline). By hand: console.aws.amazon.com/ec2, Instances, tick it, Instance state, Terminate."; exit 1; }
      - name: Where the results are
        if: always()
        run: |
          { echo "The results are this run's artifacts (aws-gpu-watch*-${{ github.run_id }}); the archive bot lands them on the"
            echo "branch raw."; } >> "$GITHUB_STEP_SUMMARY"
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
