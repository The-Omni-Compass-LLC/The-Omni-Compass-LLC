name: realms-v5
# Omni v5 at the max on the whole v5 muscle catalog (realms/catalog_v5.csv, 1,107 muscles in 70 families) on GitHub's
# own machine: every muscle alone and the seven organisms, at their own load and in the climb, native against Omni on top
# (realms/compass_arm_v5.py, the max), on the preregistered seeds 3000-3009 (tools/run_realms_v5.py). Evidence class S
# (modelled). The run is deterministic: every label must match the table committed in results/realms_v5/, every number
# within 1e-3 or 0.5%, and no muscle alone may read LOSS against native (the no-harm check). Started by hand (Actions -> realms-v5 -> Run workflow), by a commit message
# containing [realms-v5], or by v5-all-benchmarks.yml.
on:
  workflow_dispatch:
env:
  OMNI_NOTICE: '© 2026 The Omni-Compass LLC. All rights reserved. **Evaluation and Simulation use only.** Any commercial use, commercialization, monetization, production use, redistribution or hosted service of any part of Omni-Compass requires a signed, paid Omni-Compass Enterprise License from The Omni-Compass LLC. Every copy, export, report and printout carries this notice with `LICENSE`, `NOTICE` and `DISCLOSURES.md`. All patents, copyrights and trademarks filed in the USA. www.omni-compass.com'
# the token reads the code and nothing else: this workflow pushes nothing, starts nothing and reads no other run
# (docs/THREAT_MODEL.md, T9)
permissions:
  contents: read
jobs:
  realms-v5:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[realms-v5]')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4: the code, not the archive of raw runs (25 GB, more than the machine's disk)
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/results/live/raw/*
      - name: Engine and source receipt
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"
          python3 tools/omni_version.py | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: The engine reads omni-v5
        run: python3 tools/omni_version.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The max does no harm to any muscle alone; the tune-down keeps its own promise (tests/test_compass_arm_v5.py)
        run: python3 tests/test_compass_arm_v5.py
      - name: Every muscle alone and the seven organisms at the max, own load, the climb and the line (seeds 3000-3009)
        run: python3 tools/run_realms_v5.py --out realms5-out
      - name: Same table as the one published, and no muscle with a LOSS against native
        run: |
          set -o pipefail
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import csv, json, sys
          a = list(csv.DictReader(open("realms5-out/MUSCLES_V5.csv")))
          muscles = {x["muscle_id"]: x for x in a}                 # one row per muscle and load; its label over all loads
          # the labels of the table (tools/run_realms_v5.py: LOSS, GAIN AND LOSS), and the ones the tables written before used
          away = sorted({x["muscle"] for x in a if x.get("label_all_loads", x["label"]) in ("LOSS", "GAIN AND LOSS", "AWAY FROM ITS AIMS", "BOTH WAYS", "WORSE", "MIXED")})
          print(f"no-harm: {len(muscles)} muscles, {len(away)} with a LOSS (LOSS or GAIN AND LOSS) against native under any load" + (": " + ", ".join(away) if away else ""))
          try:
              b = list(csv.DictReader(open("results/realms_v5/MUSCLES_V5.csv")))
              mine, pub = json.load(open("realms5-out/RUN.json")), json.load(open("results/realms_v5/RUN.json"))
          except FileNotFoundError:
              b, mine, pub = [], {}, {}
          if len(b) != len(a) or mine.get("frozen_tree_sha256") != pub.get("frozen_tree_sha256"):
              print("::notice::the committed table is from another engine tree: nothing to compare yet; this run's table is the first on this tree")
              sys.exit(1 if away else 0)
          bad = []
          for x, y in zip(a, b):
              for k in x:
                  try:
                      fx, fy = float(x[k]), float(y[k])
                      ok = abs(fx - fy) <= max(1e-3, 0.005 * abs(fy))
                  except ValueError:
                      ok = x[k] == y[k]
                  if not ok:
                      bad.append((x["muscle"], k, x[k], y[k]))
          print(f"published v5 table reproduced: {len(a)} muscles, {len(bad)} differences beyond 1e-3 (or 0.5%)")
          for d in bad[:40]:
              print("  differs:", d)
          sys.exit(1 if (bad or away) else 0)
          PY
      - name: Results summary
        if: always()
        run: sed -n '/## The seven organisms/,/## Every muscle alone, by home/p' realms5-out/REALMS_V5.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Attach README, licenses and disclosures to this artifact
        id: omni_legal_export_1
        if: "always()"
        env:
          OMNI_EXPORT_PATHS: |
            realms5-out
        shell: python
        run: |
          #!/usr/bin/env python3
          # SPDX-License-Identifier: LicenseRef-OmniCompass-Evaluation-1.0
          # Copyright (c) 2026 The Omni-Compass LLC. All rights reserved.
          # Evaluation and Simulation use only; any commercialization, monetization or other use requires a signed, paid
          # Omni-Compass Enterprise License. See LICENSE, NOTICE and DISCLOSURES.md.
          # All patents, copyrights and trademarks filed in the USA. www.omni-compass.com
          """Attach the exact legal bundle inside an artifact without changing its result-file layout."""
          import glob
          import hashlib
          import json
          import os
          from pathlib import Path
          import urllib.parse
          import urllib.request
          import uuid
          
          BUNDLE = ('README.md', 'LICENSE', 'NOTICE', 'DISCLOSURES.md', 'PATENTS.md', 'TRADEMARKS.md')
          
          
          def search_root(pattern, workspace):
              path = Path(os.path.expanduser(pattern))
              if not path.is_absolute():
                  path = workspace / path
              prefix = Path(path.anchor)
              for part in path.parts[1:]:
                  if glob.has_magic(part):
                      return prefix
                  prefix /= part
              return path if path.is_dir() or (not path.exists() and not path.suffix) else path.parent
          
          
          def attach(paths, workspace, loader=None):
              workspace = Path(workspace).absolute()
              lines = [p.strip() for p in paths.splitlines() if p.strip()]
              roots = [search_root(p, workspace) for p in lines if not p.startswith('!')]
              if not roots:
                  raise ValueError('artifact has no positive output path')
              root = Path(os.path.commonpath([str(p) for p in roots]))
              if root == Path(root.anchor):
                  raise ValueError('refusing to write an export bundle at a filesystem root')
              legal = root / '_omni_legal'
              legal.mkdir(parents=True, exist_ok=True)
              hashes = {}
              for name in BUNDLE:
                  source = workspace / name
                  data = source.read_bytes() if source.is_file() else loader(name) if loader else None
                  if data is None:
                      raise FileNotFoundError('required export legal file is unavailable: ' + name)
                  target = legal / name
                  target.write_bytes(data)
                  hashes[name] = hashlib.sha256(data).hexdigest()
              (legal / 'SHA256SUMS.json').write_text(json.dumps(hashes, indent=2) + '\n')
              return '\n'.join([*lines, *(str(legal / n) for n in (*BUNDLE, 'SHA256SUMS.json'))])
          
          
          def main():
              workspace = Path(os.environ.get('GITHUB_WORKSPACE', '.')).absolute()
              def public_source(name):
                  # Collect-only jobs may not check out source. Fetch only these public legal files, pinned to the run commit.
                  repo, sha = os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA']
                  url = f'https://raw.githubusercontent.com/{repo}/{sha}/{urllib.parse.quote(name)}'
                  with urllib.request.urlopen(url, timeout=30) as response:
                      return response.read()
              paths = attach(os.environ['OMNI_EXPORT_PATHS'], workspace, public_source)
              delimiter = 'OMNI_LEGAL_' + uuid.uuid4().hex
              with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
                  out.write('paths<<' + delimiter + '\n' + paths + '\n' + delimiter + '\n')
          
          
          if __name__ == '__main__':
              main()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: {name: realms-v5-results, path: "${{ steps.omni_legal_export_1.outputs.paths }}"}
      - name: Legal files beside the files this run hands out
        if: always()
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: _legal
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            README.md
            LICENSE
            NOTICE
            DISCLOSURES.md
            PATENTS.md
            TRADEMARKS.md
      - name: Legal notice handed out with this run's files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: legal-notice
          overwrite: true
          path: |
            _legal/README.md
            _legal/LICENSE
            _legal/NOTICE
            _legal/DISCLOSURES.md
            _legal/PATENTS.md
            _legal/TRADEMARKS.md
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
