name: front-page
# The repository keeps itself current (the founder's order of 10 October 2026: the newest result is always at the front, and
# the repository, not a person, moves it there). Within minutes of every finished benchmark run, and every hour besides:
#   1. a finished run of a live product (Redis, Kafka, PostgreSQL, MySQL, MongoDB) has its raw files archived with the code
#      (run-<id>/ on the branch raw, opened at results/live/raw/; the same copy the archive-run workflow makes);
#   2. tools/front_page.py rebuilds every table whose three newest runs are in (the superseded table goes whole into
#      docs/history), then the index, the wiring page, the benefit sheet and the dossier;
#   3. the front page's own blocks are written again: the engine on main and the index now, every result table by when it
#      last changed, and the newest finished run of every benchmark;
#   4. the legal notice is checked on every page it touched, and the result is pushed.
# The checkout leaves out the archived runs it does not read (the archive is tens of gigabytes; the product runs' own folders
# are all the rebuild needs). One refresh at a time.
on:
  workflow_run:
    workflows: [redis, kafka, pgbench, sysbench, ycsb, live-kind, live-kind-full, live-kind-levers, live-shadow, benchmark,
                benchmark-reps, robustness, six, six-kube, big-organism, big-organism-detached, realms, citylearn, mujoco,
                pandapower, swarm, cpu-power, kwok-scale, gpu-bench, aks-metered, kind-addons]
    branches: [main, "gpu-omni-*"]   # only a run on main or a GPU branch starts it (27 October: 20 pushes to one review branch, each
                                     # with its 23 skipped runs, started 111 front pages, 111 live engines and 142 sweeps in an hour)
    types: [completed]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      run_id: {description: "A finished run to archive before the refresh (optional; the refresh alone when empty)", default: ""}
permissions:
  contents: write
  actions: read
env:
  OMNI_NOTICE: '© 2026 The Omni-Compass LLC. All rights reserved. **Evaluation and Simulation use only.** Any commercial use, commercialization, monetization, production use, redistribution or hosted service of any part of Omni-Compass requires a signed, paid Omni-Compass Enterprise License from The Omni-Compass LLC. Every copy, export, report and printout carries this notice with `LICENSE`, `NOTICE` and `DISCLOSURES.md`. All patents, copyrights and trademarks filed in the USA. www.omni-compass.com'
jobs:
  refresh:
    # a run that skipped itself or was cancelled has nothing new to show; only a finished run (or the hour, or a hand) refreshes
    if: >-
      github.event_name != 'workflow_run' ||
      contains(fromJSON('["success", "failure", "timed_out"]'), github.event.workflow_run.conclusion)
    # one refresh at a time; the queue is the job's, so a run whose job is skipped never displaces one waiting to refresh
    concurrency: {group: front-page, cancel-in-progress: false}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/results/live/raw/*
      - name: The live products' raw folders the tables read, from the branch raw
        run: bash scripts/raw_archive.sh open '/*/redis-*/' '/*/kafka-*/' '/*/pgbench-*/' '/*/sysbench-*/' '/*/ycsb-*/'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - name: Archive the finished run with the code
        # a live product's successful run, or a run named by hand, at once (its tables are rebuilt from it in this job); every
        # other finished run is taken onto the branch raw within the hour by archive-run.yml
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
           contains(fromJSON('["redis", "kafka", "pgbench", "sysbench", "ycsb"]'), github.event.workflow_run.name))
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          RUN: "${{ github.event.workflow_run.id || github.event.inputs.run_id }}"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -n "$RUN" ] || { echo "::notice::no run named: the refresh alone"; exit 0; }
          d="results/live/raw/run-$RUN"
          if bash scripts/raw_archive.sh has "run-$RUN"; then echo "::notice::run $RUN is already archived"; exit 0; fi
          state=$(gh run view "$RUN" -R "${{ github.repository }}" --json status,conclusion -q '.status + " " + .conclusion')
          case "$state" in completed*) ;; *) echo "::warning::run $RUN is not finished ($state)"; exit 0;; esac
          gh run download "$RUN" -R "${{ github.repository }}" -D "$d" || { echo "::warning::run $RUN: no files to copy"; exit 0; }
          find "$d" -type f -size +50M -exec gzip -n -9 {} \;
          ( cd "$d" && find . -type f ! -name SHA256SUMS_ALL.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS_ALL.txt )
          bash scripts/raw_archive.sh save "run-$RUN" "Raw files of live run $RUN archived with the code"
          grep -qx "$RUN" .github/archive_request.txt || echo "$RUN" >> .github/archive_request.txt
          git add .github/archive_request.txt
          git commit -q -m "Live run $RUN archived on the branch raw"
          echo "::notice::run $RUN archived: $(find "$d" -type f | wc -l) files"
      - name: Rebuild what is complete, then the pages read from every table, then the front page's own blocks
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "## Front page" >> "$GITHUB_STEP_SUMMARY"
          python tools/front_page.py | tee plan.json
          summary=$(python tools/front_page.py --summary)
          python tools/front_page.py --apply | tee -a "$GITHUB_STEP_SUMMARY"
          # the pages read from every table, rebuilt with them, so main is never left behind its own tables (24 October: two
          # refreshes added v18 tables and left the levels, the loss ledger and the state of play behind, which the next push's
          # verification refused)
          python tools/reread.py
          python tools/levels.py
          python tools/loss_ledger.py
          python tools/summary.py --fix
          python tools/readings.py --fix       # a rebuilt table carries the reading key again, word for word (verify checks it)
          python tools/legal.py --fix results docs README.md
          python tools/release_manifest.py --refresh-generated
          python tools/legal.py --check > legal.txt || { tail -20 legal.txt; echo "::error::a page lacks the legal notice"; exit 1; }
          tail -1 legal.txt >> "$GITHUB_STEP_SUMMARY"
          git add -A results docs README.md RELEASE_MANIFEST.json
          git commit -q -m "Front page refreshed: $summary" || echo "::notice::nothing new for the front page"
      - name: Push, trying again if the branch moved meanwhile
        run: |
          for attempt in 1 2 3 4 5 6; do
            git pull -q --rebase && git push && exit 0
            echo "::warning::push attempt $attempt failed (the branch moved); trying again"; sleep 15
          done
          echo "::error::the refreshed front page could not be pushed after six attempts"; exit 1
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
