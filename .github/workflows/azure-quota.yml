name: azure-quota
# Asks Azure to raise the subscription's compute core allowance in one region (the Microsoft.Quota API, free of charge;
# Azure grants or refuses, usually within minutes to a day). Two allowances bind an AKS fleet: the region's total vCPUs
# and the machine family's vCPUs (2 a worker, one machine for the system pool). The first run raised the regional total
# to 200 but the family stayed at 10, so this job asks for every worker-capable family it can and reports which were
# granted; the metered runs then pick a worker size from a granted family (aks-metered's vm_size input). Prints the
# allowances before and after. Nothing is rented. Uses the AZURE_CREDENTIALS secret; a family Azure refuses to raise
# through the API is named for the owner to request in the portal (Quotas > Compute > the region).
on:
  workflow_dispatch:
    inputs:
      location: {description: "Azure region", default: "eastus"}
      cores: {description: "vCPUs to ask for, for the regional total and for each family", default: "200"}
      families: {description: "Machine families to raise, space separated (list-usage names)", default: "standardDSv4Family standardDASv4Family standardDSv5Family standardDASv5Family standardDSv3Family standardDv4Family standardDAv4Family standardDDSv4Family standardDDSv5Family standardDADSv5Family standardESv4Family standardEASv4Family"}
env:
  OMNI_NOTICE: '© 2026 Dubra Software Inc. / The Omni-Compass LLC. All rights reserved. **Evaluation and Simulation use only.** Any commercial use, commercialization, monetization, production use, redistribution or hosted service of any part of Omni-Compass requires a signed, paid Omni-Compass Enterprise License from Dubra Software Inc. / The Omni-Compass LLC. Every copy, export, report and printout carries this notice with `LICENSE`, `NOTICE` and `DISCLOSURES.md`. All patents, copyrights and trademarks filed in the USA. www.omni-compass.com'
# the token reads the code and nothing else: this workflow pushes nothing, starts nothing and reads no other run
# (docs/THREAT_MODEL.md, T9)
permissions:
  contents: read
jobs:
  quota:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4: the key check alone, read before Azure's login
        with: {sparse-checkout: "tools/cloud_key_check.py", sparse-checkout-cone-mode: false, path: _keycheck}
      - name: The Azure key is whole (its shape only; not a character of it is printed; a key in another form never reaches the login, which would quote it)
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: python3 _keycheck/tools/cloud_key_check.py azure
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with: {creds: "${{ env.AZ_CREDS }}"}
      - name: Ask for the allowances
        run: |
          LOC="${{ github.event.inputs.location || 'eastus' }}"; CORES="${{ github.event.inputs.cores || '200' }}"
          FAMS="${{ github.event.inputs.families || 'standardDSv4Family standardDASv4Family standardDSv5Family standardDASv5Family standardDSv3Family standardDv4Family standardDAv4Family standardDDSv4Family standardDDSv5Family standardDADSv5Family standardESv4Family standardEASv4Family' }}"
          SUB=$(az account show --query id -o tsv)
          echo "subscription: $(az account show --query '[name, state]' -o tsv | tr '\n' ' ')"
          az extension add -n quota -y >/dev/null 2>&1 || true
          az provider register --namespace Microsoft.Quota --wait 2>&1 | tail -1 || true
          echo "before ($LOC):"; az vm list-usage -l "$LOC" -o tsv --query "[?name.value=='cores' || contains(name.value,'Family')].[name.value, currentValue, limit]" | awk '$3 > 0' | sort
          SCOPE="/subscriptions/$SUB/providers/Microsoft.Compute/locations/$LOC"
          granted=""; refused=""
          for res in cores $FAMS; do
            cur=$(az vm list-usage -l "$LOC" -o tsv --query "[?name.value=='$res'].limit | [0]" 2>/dev/null); cur=${cur:-?}
            if [ "$cur" != "?" ] && [ "$cur" -ge "$CORES" ] 2>/dev/null; then echo "$res already $cur"; granted="$granted $res=$cur"; continue; fi
            if az quota update --resource-name "$res" --scope "$SCOPE" --limit-object value="$CORES" --resource-type dedicated -o json > "q-$res.json" 2> "q-$res.err"; then
              new=$(python3 -c "import json;d=json.load(open('q-$res.json'));print(d.get('properties',{}).get('limit',{}).get('value',''))")
              echo "$res: asked $CORES, now $new"; granted="$granted $res=$new"
            else
              echo "$res: refused: $(grep -oE '\([A-Za-z]+\)' "q-$res.err" | head -1)"; refused="$refused $res"
            fi
          done
          echo "after ($LOC):"; az vm list-usage -l "$LOC" -o tsv --query "[?name.value=='cores' || contains(name.value,'Family')].[name.value, currentValue, limit]" | awk '$3 > 0' | sort
          echo "::notice::granted or already there:$granted"
          [ -z "$refused" ] || echo "::warning::refused through the API:$refused (the owner can ask in the portal: Subscriptions > Usage + quotas > Compute > $LOC > the family > Request increase; a Free Trial subscription cannot raise family allowances until it is upgraded to pay-as-you-go, which keeps the credits)"
          # the biggest worker fleet now possible from any granted family: (family limit - 2 for the system machine) / 2
          best=$(az vm list-usage -l "$LOC" -o tsv --query "[?contains(name.value,'Family') && (contains(name.value,'DS') || contains(name.value,'DAS') || contains(name.value,'Dv') || contains(name.value,'DAv') || contains(name.value,'DDS') || contains(name.value,'DADS') || contains(name.value,'ES') || contains(name.value,'EAS'))].[limit, name.value]" | sort -n | tail -1)
          echo "::notice::largest family allowance in $LOC: $best vCPUs -> up to $(( ($(echo "$best" | cut -f1) - 2) / 2 )) workers of 2 vCPUs with one system machine"
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
