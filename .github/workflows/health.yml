name: health
# The repository's health watch (tools/health_watch.py): every 15 minutes it reads every workflow's runs of the last hour and
# goes red, with the reason in its report and in one open issue, when a workflow failed four times or more in the hour, or
# started more runs than its limit (a chain that starts itself). 24 October 2026: the conductor failed and restarted itself
# about every 15 seconds for eight hours before anyone read it; this watch reads it within a quarter of an hour. It reads and
# reports only: it starts, stops and cancels nothing.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  issues: write
concurrency: {group: health-watch, cancel-in-progress: false}
env:
  OMNI_NOTICE: '© 2026 The Omni-Compass LLC. All rights reserved. **Evaluation and Simulation use only.** Any commercial use, commercialization, monetization, production use, redistribution or hosted service of any part of Omni-Compass requires a signed, paid Omni-Compass Enterprise License from The Omni-Compass LLC. Every copy, export, report and printout carries this notice with `LICENSE`, `NOTICE` and `DISCLOSURES.md`. All patents, copyrights and trademarks filed in the USA. www.omni-compass.com'
jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/health_watch.py
            tools/repo.py
      - name: Verify health-watch imports before querying GitHub
        run: python3 -c 'import tools.repo; import tools.health_watch'
      - name: Every workflow's last hour
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python3 tools/health_watch.py --notify | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
