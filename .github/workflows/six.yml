name: six
# The seven organisms, native and Omni (tools/run_scale.py): the spine, the four realms, the four stacked with every duplicate kept
# and the whole tower, on the engine's v5 law at the max on the v5 catalog, with work waiting in line (the founder's
# order). Started with its defaults (Actions -> six -> Run workflow), it starts the whole grid: every organism at 1, 10,
# 100 and 500 copies, every size to 500 runs (free GitHub runners only, the ladder of the Python's 500-run Monte Carlo, the founder's order of 25 October; scripts/dispatch_grid.py:
# the conductor starts the runs not yet started, small squares first, and grid.yml keeps it going every 15 minutes until
# every square is full, using every runner GitHub gives this repository). Started with what = runs, it runs one dispatch: the runs first .. first+runs-1 of the organisms
# asked, at one size, cut into shards from the max's measured run times; each shard stops starting runs at its deadline
# and hands in every run it finished. The shards are pooled into one receipt (tools/pool_scale.py); six-pool pools a
# whole square from many dispatches.
run-name: >-
  ${{ github.event_name != 'workflow_dispatch' && 'six' ||
      inputs.what != 'runs' && 'six: start every square of the grid' ||
      format('six x{0} {1} orgs {2} runs {3}+{4}', inputs.scale, inputs.load, inputs.orgs, inputs.first, inputs.runs) }}
on:
  workflow_dispatch:
    inputs:
      what: {description: "grid (start every square of the whole grid: 1, 10, 100 and 500 copies, every size to 500 runs) or runs (only the runs below)", default: "grid"}
      scale: {description: "runs: copies of each organism on one clock (1, 10, 100 or 500; free runners only)", default: "1"}
      orgs: {description: "runs: organisms, comma-separated numbers 1-7 (7 the spine)", default: "1,2,3,4,5,6,7"}
      first: {description: "runs: the first run (0-based; seeds 7000+first on, so the 1-, 10- and 100-run squares nest)", default: "0"}
      runs: {description: "runs: how many runs of each organism", default: "100"}
      per_shard: {description: "runs: runs per runner by organism as JSON, e.g. {\"1\":64} (empty: cut from the measured run times)", default: ""}
      workers: {description: "runs: processes per runner by organism as JSON, or one number (empty: from the measured memory)", default: ""}
      arm: {description: "v5 (the engine's law, the v5 catalog) or compass (the v3 law, v3's catalog, its stored grid)", default: "v5"}
      load: {description: "The organisms' work demand: line (work waiting in line), normal (their own) or climb (1 2 3 2 3 4 ...)", default: "line"}
      deadline_min: {description: "runs: a shard starts no run that would end after this many minutes (GitHub cuts a job at 360)", default: "320"}
permissions:
  actions: write
  contents: read
env:
  OMNI_NOTICE: '© 2026 The Omni-Compass LLC. All rights reserved. **Evaluation and Simulation use only.** Any commercial use, commercialization, monetization, production use, redistribution or hosted service of any part of Omni-Compass requires a signed, paid Omni-Compass Enterprise License from The Omni-Compass LLC. Every copy, export, report and printout carries this notice with `LICENSE`, `NOTICE` and `DISCLOSURES.md`. All patents, copyrights and trademarks filed in the USA. www.omni-compass.com'
jobs:
  grid:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.what != 'runs'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {sparse-checkout: "scripts\nresults/grid_v23\ntools\nrealms\nomnicompass\nomni_controller"}
      - name: Start every square of the modelled grid not yet started
        env: {GITHUB_TOKEN: "${{ github.token }}"}
        run: python3 scripts/dispatch_grid.py tick --grid six --ref "${{ github.ref_name }}"
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
  plan:
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.what == 'runs') || contains(github.event.head_commit.message, '[six]')
    runs-on: ubuntu-24.04
    outputs: {matrix: "${{ steps.p.outputs.matrix }}"}
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {sparse-checkout: scripts}
      - id: p
        env:
          SCALE: ${{ github.event.inputs.scale || '1' }}
          ORGS: ${{ github.event.inputs.orgs || '1,2,3,4,5,6,7' }}
          FIRST: ${{ github.event.inputs.first || '0' }}
          RUNS: ${{ github.event.inputs.runs || '100' }}
          PER: ${{ github.event.inputs.per_shard || '' }}
          W: ${{ github.event.inputs.workers || '' }}
        run: |
          echo "matrix=$(python3 scripts/dispatch_grid.py matrix --scale "$SCALE" --orgs "$ORGS" --first "$FIRST" --runs "$RUNS" \
            --per-shard "$PER" --workers "$W")" >> "$GITHUB_OUTPUT"
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
  shard:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 256  # the conductor keeps the repository's jobs at what GitHub runs plus a margin (scripts/dispatch_grid.py)
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4: only the code the run needs: the whole tree (82,000 result files) took 16 minutes
        with: {sparse-checkout: "realms\ntools\nomnicompass\nomni_controller"}
      - name: Engine and source receipt
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"
          python3 tools/omni_version.py | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: The runs (each kept as it finishes; none started past the deadline)
        timeout-minutes: 340
        run: |
          python3 tools/run_scale.py --runs "${{ matrix.n }}" --first "${{ matrix.first }}" --scale "${{ github.event.inputs.scale || '1' }}" \
            --organisms "${{ matrix.org }}" --out "part-${{ matrix.org }}-${{ matrix.first }}" \
            --workers "${{ matrix.w }}" --arm "${{ github.event.inputs.arm || 'v5' }}" --load "${{ github.event.inputs.load || 'line' }}" \
            --deadline-min "${{ github.event.inputs.deadline_min || '320' }}"
      - name: Attach README, licenses and disclosures to this artifact
        id: omni_legal_export_1
        if: "always()"
        env:
          OMNI_EXPORT_PATHS: |
            part-${{ matrix.org }}-${{ matrix.first }}
        shell: python
        run: |
          #!/usr/bin/env python3
          # SPDX-License-Identifier: LicenseRef-OmniCompass-Evaluation-1.0
          # Copyright (c) 2026 The Omni-Compass LLC. All rights reserved.
          # Evaluation and Simulation use only; any commercialization, monetization or other use requires a signed, paid
          # Omni-Compass Enterprise License. See LICENSE, NOTICE and DISCLOSURES.md.
          # All patents, copyrights and trademarks filed in the USA. www.omni-compass.com
          """Attach the exact legal bundle inside an artifact without changing its result-file layout."""
          import glob
          import hashlib
          import json
          import os
          from pathlib import Path
          import urllib.parse
          import urllib.request
          import uuid
          
          BUNDLE = ('README.md', 'LICENSE', 'NOTICE', 'DISCLOSURES.md', 'PATENTS.md', 'TRADEMARKS.md')
          
          
          def search_root(pattern, workspace):
              path = Path(os.path.expanduser(pattern))
              if not path.is_absolute():
                  path = workspace / path
              prefix = Path(path.anchor)
              for part in path.parts[1:]:
                  if glob.has_magic(part):
                      return prefix
                  prefix /= part
              return path if path.is_dir() or (not path.exists() and not path.suffix) else path.parent
          
          
          def attach(paths, workspace, loader=None):
              workspace = Path(workspace).absolute()
              lines = [p.strip() for p in paths.splitlines() if p.strip()]
              roots = [search_root(p, workspace) for p in lines if not p.startswith('!')]
              if not roots:
                  raise ValueError('artifact has no positive output path')
              root = Path(os.path.commonpath([str(p) for p in roots]))
              if root == Path(root.anchor):
                  raise ValueError('refusing to write an export bundle at a filesystem root')
              legal = root / '_omni_legal'
              legal.mkdir(parents=True, exist_ok=True)
              hashes = {}
              for name in BUNDLE:
                  source = workspace / name
                  data = source.read_bytes() if source.is_file() else loader(name) if loader else None
                  if data is None:
                      raise FileNotFoundError('required export legal file is unavailable: ' + name)
                  target = legal / name
                  target.write_bytes(data)
                  hashes[name] = hashlib.sha256(data).hexdigest()
              (legal / 'SHA256SUMS.json').write_text(json.dumps(hashes, indent=2) + '\n')
              return '\n'.join([*lines, *(str(legal / n) for n in (*BUNDLE, 'SHA256SUMS.json'))])
          
          
          def main():
              workspace = Path(os.environ.get('GITHUB_WORKSPACE', '.')).absolute()
              def public_source(name):
                  # Collect-only jobs may not check out source. Fetch only these public legal files, pinned to the run commit.
                  repo, sha = os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA']
                  url = f'https://raw.githubusercontent.com/{repo}/{sha}/{urllib.parse.quote(name)}'
                  with urllib.request.urlopen(url, timeout=30) as response:
                      return response.read()
              paths = attach(os.environ['OMNI_EXPORT_PATHS'], workspace, public_source)
              delimiter = 'OMNI_LEGAL_' + uuid.uuid4().hex
              with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
                  out.write('paths<<' + delimiter + '\n' + paths + '\n' + delimiter + '\n')
          
          
          if __name__ == '__main__':
              main()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: {name: "part-${{ matrix.org }}-${{ matrix.first }}", path: "${{ steps.omni_legal_export_1.outputs.paths }}", if-no-files-found: warn}
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
  receipts:
    needs: shard
    if: always() && needs.shard.result != 'skipped'
    runs-on: ubuntu-24.04
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {sparse-checkout: "realms\ntools\nomnicompass\nomni_controller"}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {path: parts, pattern: "part-*"}
      - run: python3 tools/pool_scale.py SIX.md "parts/*/SCALE.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Attach README, licenses and disclosures to this artifact
        id: omni_legal_export_2
        env:
          OMNI_EXPORT_PATHS: |
            SIX.*
        shell: python
        run: |
          #!/usr/bin/env python3
          # SPDX-License-Identifier: LicenseRef-OmniCompass-Evaluation-1.0
          # Copyright (c) 2026 The Omni-Compass LLC. All rights reserved.
          # Evaluation and Simulation use only; any commercialization, monetization or other use requires a signed, paid
          # Omni-Compass Enterprise License. See LICENSE, NOTICE and DISCLOSURES.md.
          # All patents, copyrights and trademarks filed in the USA. www.omni-compass.com
          """Attach the exact legal bundle inside an artifact without changing its result-file layout."""
          import glob
          import hashlib
          import json
          import os
          from pathlib import Path
          import urllib.parse
          import urllib.request
          import uuid
          
          BUNDLE = ('README.md', 'LICENSE', 'NOTICE', 'DISCLOSURES.md', 'PATENTS.md', 'TRADEMARKS.md')
          
          
          def search_root(pattern, workspace):
              path = Path(os.path.expanduser(pattern))
              if not path.is_absolute():
                  path = workspace / path
              prefix = Path(path.anchor)
              for part in path.parts[1:]:
                  if glob.has_magic(part):
                      return prefix
                  prefix /= part
              return path if path.is_dir() or (not path.exists() and not path.suffix) else path.parent
          
          
          def attach(paths, workspace, loader=None):
              workspace = Path(workspace).absolute()
              lines = [p.strip() for p in paths.splitlines() if p.strip()]
              roots = [search_root(p, workspace) for p in lines if not p.startswith('!')]
              if not roots:
                  raise ValueError('artifact has no positive output path')
              root = Path(os.path.commonpath([str(p) for p in roots]))
              if root == Path(root.anchor):
                  raise ValueError('refusing to write an export bundle at a filesystem root')
              legal = root / '_omni_legal'
              legal.mkdir(parents=True, exist_ok=True)
              hashes = {}
              for name in BUNDLE:
                  source = workspace / name
                  data = source.read_bytes() if source.is_file() else loader(name) if loader else None
                  if data is None:
                      raise FileNotFoundError('required export legal file is unavailable: ' + name)
                  target = legal / name
                  target.write_bytes(data)
                  hashes[name] = hashlib.sha256(data).hexdigest()
              (legal / 'SHA256SUMS.json').write_text(json.dumps(hashes, indent=2) + '\n')
              return '\n'.join([*lines, *(str(legal / n) for n in (*BUNDLE, 'SHA256SUMS.json'))])
          
          
          def main():
              workspace = Path(os.environ.get('GITHUB_WORKSPACE', '.')).absolute()
              def public_source(name):
                  # Collect-only jobs may not check out source. Fetch only these public legal files, pinned to the run commit.
                  repo, sha = os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA']
                  url = f'https://raw.githubusercontent.com/{repo}/{sha}/{urllib.parse.quote(name)}'
                  with urllib.request.urlopen(url, timeout=30) as response:
                      return response.read()
              paths = attach(os.environ['OMNI_EXPORT_PATHS'], workspace, public_source)
              delimiter = 'OMNI_LEGAL_' + uuid.uuid4().hex
              with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
                  out.write('paths<<' + delimiter + '\n' + paths + '\n' + delimiter + '\n')
          
          
          if __name__ == '__main__':
              main()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: six-receipts, path: "${{ steps.omni_legal_export_2.outputs.paths }}"}
      - name: Legal files beside the files this run hands out
        if: always()
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: _legal
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            README.md
            LICENSE
            NOTICE
            DISCLOSURES.md
            PATENTS.md
            TRADEMARKS.md
      - name: Legal notice handed out with this run's files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: legal-notice
          overwrite: true
          path: |
            _legal/README.md
            _legal/LICENSE
            _legal/NOTICE
            _legal/DISCLOSURES.md
            _legal/PATENTS.md
            _legal/TRADEMARKS.md
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
