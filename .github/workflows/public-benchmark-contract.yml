name: Public benchmark evidence contract

on:
  push:
    branches: [main]
    paths:
      - "results/OMNI_INDEX.json"
      - "results/OMNI_INDEX.md"
      - "results/SITE_NUMBERS.json"
      - "results/SITE_NUMBERS.md"
      - "results/TWO_BILLS.json"
      - "docs/WEBSITE_CLAIMS.md"
      - "docs/OMNI_V*.md"
      - "OMNI_V*.json"
      - "tools/site_numbers.py"
      - "tests/test_public_benchmark_contract.py"
      - "tests/test_site_surface_contract.py"
      - "tools/site_surface_contract.py"
      - "results/WEBSITE_SURFACE_CONTRACT.json"
      - "docs/WEBSITE_GITHUB_ALIGNMENT_CONTRACT.md"
      - "docs/COMMERCIAL_TERMS_PROPOSAL.md"
      - "tools/company_attribution.py"
      - "tests/test_company_attribution.py"
      - "LICENSE"
      - "NOTICE"
      - "DISCLOSURES.md"
      - "AGENTS.md"
      - "tests/test_index_raw_provenance.py"
      - "results/live/V*_*.json"
      - "llms.txt"
      - "docs/FORMAL_STATUS.md"
      - "docs/EVIDENCE_LEDGER.md"
      - "docs/ENGINE_PROOFS.md"
      - "docs/audits/MANUAL_EVIDENCE_CORRIGENDUM_*.md"
      - "docs/OMNI_COMPASS_MANUAL.md"
      - "docs/OMNI_COMPASS_OWNERS_MANUAL.md"
      - "docs/OMNI_COMPASS_LIVE_ENGINE_MANUAL.md"
      - ".github/workflows/public-benchmark-contract.yml"
  pull_request:
    paths:
      - "results/OMNI_INDEX.json"
      - "results/OMNI_INDEX.md"
      - "results/SITE_NUMBERS.json"
      - "results/SITE_NUMBERS.md"
      - "results/TWO_BILLS.json"
      - "docs/WEBSITE_CLAIMS.md"
      - "docs/OMNI_V*.md"
      - "OMNI_V*.json"
      - "tools/site_numbers.py"
      - "tests/test_public_benchmark_contract.py"
      - "tests/test_site_surface_contract.py"
      - "tools/site_surface_contract.py"
      - "results/WEBSITE_SURFACE_CONTRACT.json"
      - "docs/WEBSITE_GITHUB_ALIGNMENT_CONTRACT.md"
      - "docs/COMMERCIAL_TERMS_PROPOSAL.md"
      - "tools/company_attribution.py"
      - "tests/test_company_attribution.py"
      - "LICENSE"
      - "NOTICE"
      - "DISCLOSURES.md"
      - "AGENTS.md"
      - "tests/test_index_raw_provenance.py"
      - "results/live/V*_*.json"
      - "llms.txt"
      - "docs/FORMAL_STATUS.md"
      - "docs/EVIDENCE_LEDGER.md"
      - "docs/ENGINE_PROOFS.md"
      - "docs/audits/MANUAL_EVIDENCE_CORRIGENDUM_*.md"
      - "docs/OMNI_COMPASS_MANUAL.md"
      - "docs/OMNI_COMPASS_OWNERS_MANUAL.md"
      - "docs/OMNI_COMPASS_LIVE_ENGINE_MANUAL.md"
      - ".github/workflows/public-benchmark-contract.yml"
  workflow_dispatch:
  schedule:
    - cron: "21 13 * * *"

permissions:
  contents: read

concurrency:
  group: public-evidence-${{ github.ref }}
  cancel-in-progress: false

env:
  OMNI_NOTICE: '© 2026 Dubra Software Inc. / The Omni-Compass LLC. All rights reserved. **Evaluation and Simulation use only.** Any commercial use, commercialization, monetization, production use, redistribution or hosted service of any part of Omni-Compass requires a signed, paid Omni-Compass Enterprise License from Dubra Software Inc. / The Omni-Compass LLC. Every copy, export, report and printout carries this notice with `LICENSE`, `NOTICE` and `DISCLOSURES.md`. All patents, copyrights and trademarks filed in the USA. www.omni-compass.com'
jobs:
  verify-public-receipts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - name: Fetch exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check generated public numbers without changing them
        run: python3 tools/site_numbers.py --check
      - name: Check public figures, sources, adverse rows, and version labels
        run: python3 -m unittest -v tests.test_public_benchmark_contract
      - name: Independently recompute every indexed gauge from raw A/B/C tables
        run: python3 -m unittest -v tests.test_index_raw_provenance
      - name: Check receipt-derived website surface and guide contract
        run: python3 tools/site_surface_contract.py --check
      - name: Test website surface mapping, virtual guide and proposed terms
        run: python3 -m unittest -v tests.test_site_surface_contract
      - name: Check Dubra / Omni company attribution across current publications
        run: python3 tools/company_attribution.py --check
      - name: Test company-name normalization and publication metadata
        run: python3 -m unittest -v tests.test_company_attribution
      - name: Evidence summary
        if: always()
        shell: bash
        run: |
          echo "### Public benchmark evidence contract" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Only provenance and data-feed consistency were checked." >> "$GITHUB_STEP_SUMMARY"
          echo "No physical GPU, CPU, Kubernetes or cloud experiment was run." >> "$GITHUB_STEP_SUMMARY"
          echo "No measured headline or results file was modified." >> "$GITHUB_STEP_SUMMARY"
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"

