                      return response.read()
              paths = attach(os.environ['OMNI_EXPORT_PATHS'], workspace, public_source)
              delimiter = 'OMNI_LEGAL_' + uuid.uuid4().hex
              with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
                  out.write('paths<<' + delimiter + '\n' + paths + '\n' + delimiter + '\n')
          
          
          if __name__ == '__main__':
              main()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: {name: capacity, path: "${{ steps.omni_legal_export_2.outputs.paths }}"}
      - name: The results, saved on the branch raw
        if: always()
        run: |
          d="results/live/raw/capacity-run-${{ github.run_id }}"
          mkdir -p "$d"
          [ -d caps ] && cp -r caps/. "$d/"
          printf 'label=%s\ncaps=%s\nreps=%s\nrate_steps=%s\nduration_s=%s\nslo_ms=%s\ncommit=%s\n' "${{ github.event.inputs.label }}" \
            '${{ github.event.inputs.caps }}' '${{ github.event.inputs.reps }}' "${{ github.event.inputs.rate_steps }}" \
            "${{ github.event.inputs.duration_s }}" "${{ github.event.inputs.slo_ms }}" "${{ github.sha }}" > "$d/RUN.txt"
          ( cd "$d" && find . -type f ! -name SHA256SUMS_ALL.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS_ALL.txt )
          # onto the branch raw, built on its newest tip (scripts/raw_archive.sh); main's tree keeps the code and the tables
          bash scripts/raw_archive.sh save "${d#results/live/raw/}" "Capacity test ${{ github.event.inputs.label }}, run ${{ github.run_id }}: raw files and table"
      - name: Legal files beside the files this run hands out
        if: always()
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: _legal
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            README.md
            LICENSE
            NOTICE
            DISCLOSURES.md
            PATENTS.md
            TRADEMARKS.md
      - name: Legal notice handed out with this run's files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: legal-notice
          overwrite: true
          path: |
            _legal/README.md
            _legal/LICENSE
            _legal/NOTICE
            _legal/DISCLOSURES.md
            _legal/PATENTS.md
            _legal/TRADEMARKS.md
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
