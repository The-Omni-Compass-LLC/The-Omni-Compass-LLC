name: capacity
# The capacity test (the founder's order of 12 October; docs/CAPACITY_PREREGISTRATION.md): native, and Omni-Compass on top
# of native, held to the same resource cap (a quota on the served app's CPU, enforced by the cluster) at several cap
# levels, under a load that rises past what the cap can serve; the work meter counts every request, so completed work is
# a count. Both arms of a repetition on one runner, each on a fresh six-worker kind cluster, the order rotated
# (scripts/kind_paired.sh). One job per cap level and repetition; the report (tools/capacity_report.py) writes one row per
# cap level with its plain audit line, and what each step up in the cap gives each arm. Every run's raw files and table
# are saved on the branch raw (results/live/raw/capacity-run-<id>/); the three-run readings come from runs
# A, B and C, and the founder hears what they say before a table goes up.
run-name: >-
  ${{ github.event_name != 'workflow_dispatch' && 'capacity' ||
      format('capacity {0}: caps {1} reps {2} rates {3}', inputs.label, inputs.caps, inputs.reps, inputs.rate_steps) }}
on:
  workflow_dispatch:
    inputs:
      label: {description: "A, B or C (the three runs), or smoke (the tuning case, not counted)", default: "A"}
      caps: {description: "Cap levels, millicores of the served app's CPU, as a JSON list", default: "[1000,1500,2000,3000]"}
      reps: {description: "Repetitions per cap level, as a JSON list", default: "[1,2,3,4,5]"}
      rate_steps: {description: "The work meter's rates, requests per second, rising, one per step (amendment 1)", default: "4 6 8 10 12 14 16 20"}
      duration_s: {description: "Measured seconds per arm", default: "1200"}
      slo_ms: {description: "The response-time line, ms", default: "500"}
permissions:
  contents: write
env:
  OMNI_NOTICE: '© 2026 The Omni-Compass LLC. All rights reserved. **Evaluation and Simulation use only.** Any commercial use, commercialization, monetization, production use, redistribution or hosted service of any part of Omni-Compass requires a signed, paid Omni-Compass Enterprise License from The Omni-Compass LLC. Every copy, export, report and printout carries this notice with `LICENSE`, `NOTICE` and `DISCLOSURES.md`. All patents, copyrights and trademarks filed in the USA. www.omni-compass.com'
jobs:
  run:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      max-parallel: 40
      matrix:
        cap: ${{ fromJSON(github.event.inputs.caps) }}
        rep: ${{ fromJSON(github.event.inputs.reps) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4: the code the cluster and the controller need, not the 82,000 result files
        with: {sparse-checkout: "deploy\nscripts\ntools\npilot\nfleet\ntuning\nomni_controller\nomnicompass\nrealms\nhardware\nresults/hardware"}
      - name: Engine and source receipt
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"
          python3 tools/omni_version.py | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1: kind v0.31.0 (Kubernetes v1.35.0), as the grid; a refused download is tried again below
        id: kind
        continue-on-error: true
        with: {install_only: true, version: v0.31.0, kubectl_version: v1.35.0}
      - name: kind and kubectl again, if the first download was refused
        if: steps.kind.outcome == 'failure'
        run: bash scripts/kind_install.sh v0.31.0 v1.35.0
      - run: python tools/omni_version.py | tee -a "$GITHUB_STEP_SUMMARY"
      - run: bash scripts/kind_paired.sh
        env:
          REP: ${{ matrix.rep }}
          ARMS: native compass
          CAP_CPU_M: ${{ matrix.cap }}
          LOADGEN: meter
          RATE_STEPS: ${{ github.event.inputs.rate_steps }}
          DURATION: ${{ github.event.inputs.duration_s }}
          SLO_MS: ${{ github.event.inputs.slo_ms }}
          CLOSURE: tuning/GLOBAL_LEAGUE_PREREGISTRATION.json
      - name: Attach README, licenses and disclosures to this artifact
        id: omni_legal_export_1
        if: "always()"
        env:
          OMNI_EXPORT_PATHS: |
            bench-*-${{ matrix.rep }}
        shell: python
        run: |
          #!/usr/bin/env python3
          # SPDX-License-Identifier: LicenseRef-OmniCompass-Evaluation-1.0
          # Copyright (c) 2026 The Omni-Compass LLC. All rights reserved.
          # Evaluation and Simulation use only; any commercialization, monetization or other use requires a signed, paid
          # Omni-Compass Enterprise License. See LICENSE, NOTICE and DISCLOSURES.md.
          # All patents, copyrights and trademarks filed in the USA. www.omni-compass.com
          """Attach the exact legal bundle inside an artifact without changing its result-file layout."""
          import glob
          import hashlib
          import json
          import os
          from pathlib import Path
          import urllib.parse
          import urllib.request
          import uuid
          
          BUNDLE = ('README.md', 'LICENSE', 'NOTICE', 'DISCLOSURES.md', 'PATENTS.md', 'TRADEMARKS.md')
          
          
          def search_root(pattern, workspace):
              path = Path(os.path.expanduser(pattern))
              if not path.is_absolute():
                  path = workspace / path
              prefix = Path(path.anchor)
              for part in path.parts[1:]:
                  if glob.has_magic(part):
                      return prefix
                  prefix /= part
              return path if path.is_dir() or (not path.exists() and not path.suffix) else path.parent
          
          
          def attach(paths, workspace, loader=None):
              workspace = Path(workspace).absolute()
              lines = [p.strip() for p in paths.splitlines() if p.strip()]
              roots = [search_root(p, workspace) for p in lines if not p.startswith('!')]
              if not roots:
                  raise ValueError('artifact has no positive output path')
              root = Path(os.path.commonpath([str(p) for p in roots]))
              if root == Path(root.anchor):
                  raise ValueError('refusing to write an export bundle at a filesystem root')
              legal = root / '_omni_legal'
              legal.mkdir(parents=True, exist_ok=True)
              hashes = {}
              for name in BUNDLE:
                  source = workspace / name
                  data = source.read_bytes() if source.is_file() else loader(name) if loader else None
                  if data is None:
                      raise FileNotFoundError('required export legal file is unavailable: ' + name)
                  target = legal / name
                  target.write_bytes(data)
                  hashes[name] = hashlib.sha256(data).hexdigest()
              (legal / 'SHA256SUMS.json').write_text(json.dumps(hashes, indent=2) + '\n')
              return '\n'.join([*lines, *(str(legal / n) for n in (*BUNDLE, 'SHA256SUMS.json'))])
          
          
          def main():
              workspace = Path(os.environ.get('GITHUB_WORKSPACE', '.')).absolute()
              def public_source(name):
                  # Collect-only jobs may not check out source. Fetch only these public legal files, pinned to the run commit.
                  repo, sha = os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA']
                  url = f'https://raw.githubusercontent.com/{repo}/{sha}/{urllib.parse.quote(name)}'
                  with urllib.request.urlopen(url, timeout=30) as response:
                      return response.read()
              paths = attach(os.environ['OMNI_EXPORT_PATHS'], workspace, public_source)
              delimiter = 'OMNI_LEGAL_' + uuid.uuid4().hex
              with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
                  out.write('paths<<' + delimiter + '\n' + paths + '\n' + delimiter + '\n')
          
          
          if __name__ == '__main__':
              main()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: {name: "cap-${{ matrix.cap }}-${{ matrix.rep }}", path: "${{ steps.omni_legal_export_1.outputs.paths }}"}
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
  report:
    needs: run
    if: always() && needs.run.result != 'skipped'
    runs-on: ubuntu-24.04
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4: the branch, to commit the results back; the archived raw runs stay out
        with:
          ref: "${{ github.ref_name }}"
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/results/live/raw/*
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with: {pattern: "cap-*", path: caps}
      - name: The table, one row per cap level
        run: |
          python tools/capacity_report.py caps --out caps/CAPACITY.md
          { echo "## Capacity test, run ${{ github.event.inputs.label }} (rates ${{ github.event.inputs.rate_steps }} per second, line ${{ github.event.inputs.slo_ms }} ms)"; echo; cat caps/CAPACITY.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: Attach README, licenses and disclosures to this artifact
        id: omni_legal_export_2
        if: "always()"
        env:
          OMNI_EXPORT_PATHS: |
            caps/CAPACITY.*
        shell: python
        run: |
          #!/usr/bin/env python3
          # SPDX-License-Identifier: LicenseRef-OmniCompass-Evaluation-1.0
          # Copyright (c) 2026 The Omni-Compass LLC. All rights reserved.
          # Evaluation and Simulation use only; any commercialization, monetization or other use requires a signed, paid
          # Omni-Compass Enterprise License. See LICENSE, NOTICE and DISCLOSURES.md.
          # All patents, copyrights and trademarks filed in the USA. www.omni-compass.com
          """Attach the exact legal bundle inside an artifact without changing its result-file layout."""
          import glob
          import hashlib
          import json
          import os
          from pathlib import Path
          import urllib.parse
          import urllib.request
          import uuid
          
          BUNDLE = ('README.md', 'LICENSE', 'NOTICE', 'DISCLOSURES.md', 'PATENTS.md', 'TRADEMARKS.md')
          
          
          def search_root(pattern, workspace):
