# The bill on a real cloud: native Kubernetes (Azure Kubernetes Service with its own cluster autoscaler) against the
# same with Omni-Compass on top, the same work, the machines Azure bills counted every 15 s and priced at the list
# price. Needs the repository secret AZURE_CREDENTIALS (docs/K8S_COMPASS_PREREGISTRATION.md, the bill on a real cloud).
# One repetition at a time (a new subscription's core quota), each cluster deleted when its arm ends; the resource
# group is deleted at the end whatever happens.
name: aks-metered
run-name: >-
  ${{ format('aks-metered {0}{1}{2}{6} dial {5} {3} {4}', github.event.inputs.load_steps != '' && format('burst {0}', github.event.inputs.load_steps) || 'steady',
     github.event.inputs.organism != '' && format(' organism {0} x{1}', github.event.inputs.organism, github.event.inputs.organism_scale) || '',
     github.event.inputs.replica_ceiling != '' && format(' replica room {0}', github.event.inputs.replica_ceiling) || '',
     github.event.inputs.location || 'eastus', github.event.inputs.worker_pools != '' && 'pools' || (github.event.inputs.vm_size || 'Standard_D2s_v4'),
     github.event.inputs.dial || 'max',
     github.event.inputs.stop_looks != '' && ' to the cap, stopping rule' || '') }}
on:
  workflow_dispatch:
    inputs:
      reps: {description: "Paired repetitions", default: "5"}
      arms: {description: "Arms, in rotation order", default: "native compass"}
      duration_s: {description: "Measured seconds per arm", default: "900"}
      location: {description: "Azure region", default: "eastus"}
      vm_size: {description: "Worker machine size (Standard_D2s_v5 is no longer offered to this subscription in eastus)", default: "Standard_D2s_v4"}
      price_per_node_hour: {description: "List price of one worker machine-hour in USD (Standard_D2s_v4, Linux, pay as you go, eastus)", default: "0.096"}
      load_steps: {description: "Load-generator replicas per step, in order (the burst bill test: e.g. 1 6 1 8 1 6); empty: steady load", default: ""}
      max_workers: {description: "Worker machines in the work pool (Azure's autoscaler runs 1 to this many); the subscription's eastus quota is 32 vCPUs, 2 a machine, one for the system pool", default: "4"}
      hpa_max: {description: "The app's replica ceiling, the same in every arm; 9 pods of 200m fit one 2-vCPU worker, so 9 x max_workers lets the fleet fill (empty: the manifest's 10)", default: ""}
      worker_pools: {description: "Several work pools, one machine family each with its own ceiling: size:max,size:max,... (the way past a 10-vCPU-a-family allowance; empty: one pool of vm_size x max_workers)", default: ""}
      pool_prices: {description: "List price per machine-hour of each pool, work0=0.096;work1=0.086;... (a pool without one is priced at price_per_node_hour)", default: ""}
      tier: {description: "The clusters' control-plane tier: free, or standard (about $0.10 an hour a cluster, not in the bill; the way past Azure's free-tier capacity refusals)", default: "free"}
      organism: {description: "One of the seven organisms with this cluster inside it (tools/run_kil.py): compute_ai_cloud, physics_robotics_autonomous, energy_facility_industrial, distribution_specialized, stack, tower, spine; empty: the service alone", default: ""}
      load_max: {description: "Load-generator replicas at the organism's peak demand (organism test only)", default: "6"}
      organism_scale: {description: "Copies of the organism on one clock, the real cluster inside (1, 10 or 100)", default: "1"}
      replica_ceiling: {description: "Omni-Compass's replica room: the most replicas it may raise the app's cap to while the cap binds and the line is threatened, handed back once the demand holds still (the compass law; docs/AKS_REPLICA_ROOM_PREREGISTRATION.md); native keeps the operator's cap. 0: the operator's cap, never moved (the cloud sets: the bill at native's work); N: a ceiling of the operator's own; empty: read live (what the machines can hold, one pod under)", default: ""}
      stop_looks: {description: "The preregistered stopping rule (tools/stop_rule.py, the amendment of 19 October): looks, in paired repetitions, at which the set stops once its bill is read (99% intervals; never on a LOSS); empty: every repetition runs", default: ""}
      dial: {description: "The dial of Omni-Compass on top: max, the factory tune (the whole engine, every muscle; the founder's order of 31 October for every cloud: the bill judged beside the work by the one key, never ruled), or save, the tune-down (native's work on the least resource; a changed tune, its receipts its own)", default: "max"}
# one Azure set at a time per machine family and region (each family has its own 10-vCPU allowance): the default family
# (Standard_D2s_v4 in eastus, and every multi-pool fleet, which uses it too) keeps the one queue it always had; a set on
# another family or in another region queues on its own and runs beside it
concurrency:
  group: azure-benchmark-${{ github.event.inputs.location || 'eastus' }}
  cancel-in-progress: false
env:
  OMNI_NOTICE: '© 2026 The Omni-Compass LLC. All rights reserved. **Evaluation and Simulation use only.** Any commercial use, commercialization, monetization, production use, redistribution or hosted service of any part of Omni-Compass requires a signed, paid Omni-Compass Enterprise License from The Omni-Compass LLC. Every copy, export, report and printout carries this notice with `LICENSE`, `NOTICE` and `DISCLOSURES.md`. All patents, copyrights and trademarks filed in the USA. www.omni-compass.com'
# the token reads the code and nothing else: this workflow pushes nothing, starts nothing and reads no other run
# (docs/THREAT_MODEL.md, T9)
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs: {reps: "${{ steps.r.outputs.reps }}"}
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce paid cloud organism and repetition ceilings
        env:
          PAID_INPUTS: ${{ toJSON(github.event.inputs) }}
        run: |
          python3 - <<'PY_LIMITS'
          import json, os
          inputs = json.loads(os.environ.get('PAID_INPUTS') or '{}') or {}
          for key in ('size', 'scale', 'organism_scale'):
              if inputs.get(key):
                  assert int(inputs[key]) in (1, 10, 100), f'{key}: paid organism copies must be 1, 10 or 100'
          if inputs.get('reps'):
              assert 1 <= int(inputs['reps']) <= 100, 'paid repetitions must be between 1 and 100'
          PY_LIMITS
      - id: r
        run: echo "reps=$(python3 -c "import json; print(json.dumps(list(range(1, ${{ github.event.inputs.reps || '5' }} + 1))))")" >> "$GITHUB_OUTPUT"
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
  run:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: {rep: "${{ fromJSON(needs.plan.outputs.reps) }}"}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      AZ_RG: omni-compass-bench-${{ github.run_id }}-${{ matrix.rep }}
      AZ_LOCATION: ${{ github.event.inputs.location || 'eastus' }}
      AKS_VM_SIZE: ${{ github.event.inputs.vm_size || 'Standard_D2s_v4' }}
      AKS_TIER: ${{ github.event.inputs.tier || 'free' }}
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce paid cloud organism and repetition ceilings
        env:
          PAID_INPUTS: ${{ toJSON(github.event.inputs) }}
        run: |
          python3 - <<'PY_LIMITS'
          import json, os
          inputs = json.loads(os.environ.get('PAID_INPUTS') or '{}') or {}
          for key in ('size', 'scale', 'organism_scale'):
              if inputs.get(key):
                  assert int(inputs[key]) in (1, 10, 100), f'{key}: paid organism copies must be 1, 10 or 100'
          if inputs.get('reps'):
              assert 1 <= int(inputs['reps']) <= 100, 'paid repetitions must be between 1 and 100'
          PY_LIMITS
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4: the code, not the archive of raw runs (25 GB, more than the machine's disk)
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/results/live/raw/*
      - name: Engine and source receipt
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"
          python3 tools/omni_version.py | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4: the repetitions this run has finished, for the stopping rule
        if: github.event.inputs.stop_looks != ''
        continue-on-error: true
        with: {pattern: "aks-*", path: prior, merge-multiple: true}
      - name: Does this repetition still run (the stopping rule)?
        id: stop
        run: |
          if [ -z "${{ github.event.inputs.stop_looks }}" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          mkdir -p prior
          python3 tools/stop_rule.py prior --rep "${{ matrix.rep }}" --looks "${{ github.event.inputs.stop_looks }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The Azure key is whole (its shape only; not a character of it is printed; a key in another form never reaches the login, which would quote it)
        if: steps.stop.outputs.run == 'true'
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: python3 tools/cloud_key_check.py azure
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        if: steps.stop.outputs.run == 'true'
        with: {creds: "${{ env.AZ_CREDS }}"}
      - run: az provider register --namespace Microsoft.ContainerService --wait
        if: steps.stop.outputs.run == 'true'
      - name: Run the paired repetition
        if: steps.stop.outputs.run == 'true'
        run: |
          set +e
          bash scripts/aks_paired.sh > paired.log 2>&1
          code=$?
          # the end of the run's own output as annotations, readable on the run's page and through the API
          grep -v -i "warning" paired.log | tail -10 | while IFS= read -r l; do echo "::notice::$l"; done
          [ "$code" = 0 ] || { echo "::error::repetition ${{ matrix.rep }} ended with exit $code"; exit "$code"; }
        env:
          REP: ${{ matrix.rep }}
          ARMS: ${{ github.event.inputs.arms || 'native compass' }}
          DURATION: ${{ github.event.inputs.duration_s || '900' }}
          LOADGEN: open
          LOAD_STEPS: ${{ github.event.inputs.load_steps || '' }}
          ORGANISM: ${{ github.event.inputs.organism || '' }}
          LOAD_MAX: ${{ github.event.inputs.load_max || '6' }}
          ORGANISM_SCALE: ${{ github.event.inputs.organism_scale || '1' }}
          AKS_MAX_NODES: ${{ github.event.inputs.max_workers || '4' }}
          HPA_MAX: ${{ github.event.inputs.hpa_max || '' }}
          REPLICA_CEILING: ${{ github.event.inputs.replica_ceiling || '' }}
          # the whole engine at the max in every cloud, the bill judged beside the work (the founder's order of 31 October:
          # no hard rule; the machines-alone switch of 14 October is struck; scripts/kind_bench.sh)
          OMNI_DIAL: ${{ github.event.inputs.dial || 'max' }}
          AKS_WORKER_POOLS: ${{ github.event.inputs.worker_pools || '' }}
          CLOSURE: tuning/GLOBAL_LEAGUE_PREREGISTRATION.json
      - if: always() && steps.stop.outputs.run == 'true'
        run: python3 scripts/azure_capacity.py cleanup --group "$AZ_RG"
      - name: Attach README, licenses and disclosures to this artifact
        id: omni_legal_export_1
        if: "always() && steps.stop.outputs.run == 'true'"
        env:
          OMNI_EXPORT_PATHS: |
            bench-*-${{ matrix.rep }}
            paired.log
        shell: python
        run: |
          #!/usr/bin/env python3
          # SPDX-License-Identifier: LicenseRef-OmniCompass-Evaluation-1.0
          # Copyright (c) 2026 The Omni-Compass LLC. All rights reserved.
          # Evaluation and Simulation use only; any commercialization, monetization or other use requires a signed, paid
          # Omni-Compass Enterprise License. See LICENSE, NOTICE and DISCLOSURES.md.
          # All patents, copyrights and trademarks filed in the USA. www.omni-compass.com
          """Attach the exact legal bundle inside an artifact without changing its result-file layout."""
          import glob
          import hashlib
          import json
          import os
          from pathlib import Path
          import urllib.parse
          import urllib.request
          import uuid
          
          BUNDLE = ('README.md', 'LICENSE', 'NOTICE', 'DISCLOSURES.md', 'PATENTS.md', 'TRADEMARKS.md')
          
          
          def search_root(pattern, workspace):
              path = Path(os.path.expanduser(pattern))
              if not path.is_absolute():
                  path = workspace / path
              prefix = Path(path.anchor)
              for part in path.parts[1:]:
                  if glob.has_magic(part):
                      return prefix
                  prefix /= part
              return path if path.is_dir() or (not path.exists() and not path.suffix) else path.parent
          
          
          def attach(paths, workspace, loader=None):
              workspace = Path(workspace).absolute()
              lines = [p.strip() for p in paths.splitlines() if p.strip()]
              roots = [search_root(p, workspace) for p in lines if not p.startswith('!')]
              if not roots:
                  raise ValueError('artifact has no positive output path')
              root = Path(os.path.commonpath([str(p) for p in roots]))
              if root == Path(root.anchor):
                  raise ValueError('refusing to write an export bundle at a filesystem root')
              legal = root / '_omni_legal'
              legal.mkdir(parents=True, exist_ok=True)
              hashes = {}
              for name in BUNDLE:
                  source = workspace / name
                  data = source.read_bytes() if source.is_file() else loader(name) if loader else None
                  if data is None:
                      raise FileNotFoundError('required export legal file is unavailable: ' + name)
                  target = legal / name
                  target.write_bytes(data)
                  hashes[name] = hashlib.sha256(data).hexdigest()
              (legal / 'SHA256SUMS.json').write_text(json.dumps(hashes, indent=2) + '\n')
              return '\n'.join([*lines, *(str(legal / n) for n in (*BUNDLE, 'SHA256SUMS.json'))])
          
          
          def main():
              workspace = Path(os.environ.get('GITHUB_WORKSPACE', '.')).absolute()
              def public_source(name):
                  # Collect-only jobs may not check out source. Fetch only these public legal files, pinned to the run commit.
                  repo, sha = os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA']
                  url = f'https://raw.githubusercontent.com/{repo}/{sha}/{urllib.parse.quote(name)}'
                  with urllib.request.urlopen(url, timeout=30) as response:
                      return response.read()
              paths = attach(os.environ['OMNI_EXPORT_PATHS'], workspace, public_source)
              delimiter = 'OMNI_LEGAL_' + uuid.uuid4().hex
              with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
                  out.write('paths<<' + delimiter + '\n' + paths + '\n' + delimiter + '\n')
          
          
          if __name__ == '__main__':
              main()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.stop.outputs.run == 'true'
        with: {name: "aks-${{ matrix.rep }}", path: "${{ steps.omni_legal_export_1.outputs.paths }}"}
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
  aggregate:
    needs: run
    if: always() && needs.run.result != 'skipped'
    runs-on: ubuntu-24.04
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce paid cloud organism and repetition ceilings
        env:
          PAID_INPUTS: ${{ toJSON(github.event.inputs) }}
        run: |
          python3 - <<'PY_LIMITS'
          import json, os
          inputs = json.loads(os.environ.get('PAID_INPUTS') or '{}') or {}
          for key in ('size', 'scale', 'organism_scale'):
              if inputs.get(key):
                  assert int(inputs[key]) in (1, 10, 100), f'{key}: paid organism copies must be 1, 10 or 100'
          if inputs.get('reps'):
              assert 1 <= int(inputs['reps']) <= 100, 'paid repetitions must be between 1 and 100'
          PY_LIMITS
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4: the code, not the archive of raw runs (25 GB, more than the machine's disk)
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/results/live/raw/*
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {pattern: "aks-*", path: reps, merge-multiple: true}
      - run: ls reps && python tools/live_reps.py reps
        env: {PRICE_PER_NODE_HOUR: "${{ github.event.inputs.price_per_node_hour || '0.096' }}", POOL_PRICES: "${{ github.event.inputs.pool_prices || '' }}"}
      - run: cat reps/LIVE_REPS.md >> "$GITHUB_STEP_SUMMARY"
      - name: The stopping rule's looks
        if: github.event.inputs.stop_looks != ''
        run: python3 tools/stop_rule.py reps --report --looks "${{ github.event.inputs.stop_looks }}" | tee reps/STOP_RULE.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Attach README, licenses and disclosures to this artifact
        id: omni_legal_export_2
        env:
          OMNI_EXPORT_PATHS: |
            reps/LIVE_REPS.*
            reps/STOP_RULE*
        shell: python
        run: |
          #!/usr/bin/env python3
          # SPDX-License-Identifier: LicenseRef-OmniCompass-Evaluation-1.0
          # Copyright (c) 2026 The Omni-Compass LLC. All rights reserved.
          # Evaluation and Simulation use only; any commercialization, monetization or other use requires a signed, paid
          # Omni-Compass Enterprise License. See LICENSE, NOTICE and DISCLOSURES.md.
          # All patents, copyrights and trademarks filed in the USA. www.omni-compass.com
          """Attach the exact legal bundle inside an artifact without changing its result-file layout."""
          import glob
          import hashlib
          import json
          import os
          from pathlib import Path
          import urllib.parse
          import urllib.request
          import uuid
          
          BUNDLE = ('README.md', 'LICENSE', 'NOTICE', 'DISCLOSURES.md', 'PATENTS.md', 'TRADEMARKS.md')
          
          
          def search_root(pattern, workspace):
              path = Path(os.path.expanduser(pattern))
              if not path.is_absolute():
                  path = workspace / path
              prefix = Path(path.anchor)
              for part in path.parts[1:]:
                  if glob.has_magic(part):
                      return prefix
                  prefix /= part
              return path if path.is_dir() or (not path.exists() and not path.suffix) else path.parent
          
          
          def attach(paths, workspace, loader=None):
              workspace = Path(workspace).absolute()
              lines = [p.strip() for p in paths.splitlines() if p.strip()]
              roots = [search_root(p, workspace) for p in lines if not p.startswith('!')]
              if not roots:
                  raise ValueError('artifact has no positive output path')
              root = Path(os.path.commonpath([str(p) for p in roots]))
              if root == Path(root.anchor):
                  raise ValueError('refusing to write an export bundle at a filesystem root')
              legal = root / '_omni_legal'
              legal.mkdir(parents=True, exist_ok=True)
              hashes = {}
              for name in BUNDLE:
                  source = workspace / name
                  data = source.read_bytes() if source.is_file() else loader(name) if loader else None
                  if data is None:
                      raise FileNotFoundError('required export legal file is unavailable: ' + name)
                  target = legal / name
                  target.write_bytes(data)
                  hashes[name] = hashlib.sha256(data).hexdigest()
              (legal / 'SHA256SUMS.json').write_text(json.dumps(hashes, indent=2) + '\n')
              return '\n'.join([*lines, *(str(legal / n) for n in (*BUNDLE, 'SHA256SUMS.json'))])
          
          
          def main():
              workspace = Path(os.environ.get('GITHUB_WORKSPACE', '.')).absolute()
              def public_source(name):
                  # Collect-only jobs may not check out source. Fetch only these public legal files, pinned to the run commit.
                  repo, sha = os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA']
                  url = f'https://raw.githubusercontent.com/{repo}/{sha}/{urllib.parse.quote(name)}'
                  with urllib.request.urlopen(url, timeout=30) as response:
                      return response.read()
              paths = attach(os.environ['OMNI_EXPORT_PATHS'], workspace, public_source)
              delimiter = 'OMNI_LEGAL_' + uuid.uuid4().hex
              with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
                  out.write('paths<<' + delimiter + '\n' + paths + '\n' + delimiter + '\n')
          
          
          if __name__ == '__main__':
              main()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: live-reps-aks, path: "${{ steps.omni_legal_export_2.outputs.paths }}"}
      - name: Legal files beside the files this run hands out
        if: always()
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: _legal
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            README.md
            LICENSE
            NOTICE
            DISCLOSURES.md
            PATENTS.md
            TRADEMARKS.md
      - name: Legal notice handed out with this run's files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: legal-notice
          overwrite: true
          path: |
            _legal/README.md
            _legal/LICENSE
            _legal/NOTICE
            _legal/DISCLOSURES.md
            _legal/PATENTS.md
            _legal/TRADEMARKS.md
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
