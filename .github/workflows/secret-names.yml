#
# The names of the secrets and variables this repository's runs can see, never a value (27 October 2026: the founder stored
# the Google and Amazon keys, and the $0 check, cloud-check.yml, still read GCP_CREDENTIALS, GCP_PROJECT, AWS_ACCESS_KEY_ID
# and AWS_SECRET_ACCESS_KEY absent). A run reads repository secrets and the organization's secrets granted to this repository
# without asking, and a GitHub Environment's secrets only in a job that names the environment; so this lists the names in each:
# the repository's own reach first, then every environment the repository has, one job each. Each name the workflows read is
# tested by name for a value (`secrets.NAME != ''`), so only true or false reaches the job: no value and no map of every
# secret ever enters it (30 October: the first form, which handed the job every secret at once, was held for approval and
# never ran, run 40485592639).
name: secret-names
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  OMNI_NOTICE: '© 2026 The Omni-Compass LLC. All rights reserved. **Evaluation and Simulation use only.** Any commercial use, commercialization, monetization, production use, redistribution or hosted service of any part of Omni-Compass requires a signed, paid Omni-Compass Enterprise License from The Omni-Compass LLC. Every copy, export, report and printout carries this notice with `LICENSE`, `NOTICE` and `DISCLOSURES.md`. All patents, copyrights and trademarks filed in the USA. www.omni-compass.com'
  NAMES: AZURE_CREDENTIALS AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID GCP_CREDENTIALS GCP_PROJECT AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY LAMBDA_API_KEY LAMBDA_SSH_PRIVATE_KEY LAMBDA_SSH_KEY_NAME
jobs:
  repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      environments: ${{ steps.envs.outputs.names }}
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - name: The names this repository's runs can see (repository and organization secrets, and variables)
        env:
          WHERE: the repository (its own and the organization's granted to it)
          S_AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS != '' }}
          V_AZURE_CREDENTIALS: ${{ vars.AZURE_CREDENTIALS != '' }}
          S_AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID != '' }}
          V_AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID != '' }}
          S_AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
          V_AZURE_CLIENT_SECRET: ${{ vars.AZURE_CLIENT_SECRET != '' }}
          S_AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID != '' }}
          V_AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID != '' }}
          S_AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID != '' }}
          V_AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID != '' }}
          S_GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS != '' }}
          V_GCP_CREDENTIALS: ${{ vars.GCP_CREDENTIALS != '' }}
          S_GCP_PROJECT: ${{ secrets.GCP_PROJECT != '' }}
          V_GCP_PROJECT: ${{ vars.GCP_PROJECT != '' }}
          S_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
          V_AWS_ACCESS_KEY_ID: ${{ vars.AWS_ACCESS_KEY_ID != '' }}
          S_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY != '' }}
          V_AWS_SECRET_ACCESS_KEY: ${{ vars.AWS_SECRET_ACCESS_KEY != '' }}
          S_LAMBDA_API_KEY: ${{ secrets.LAMBDA_API_KEY != '' }}
          V_LAMBDA_API_KEY: ${{ vars.LAMBDA_API_KEY != '' }}
          S_LAMBDA_SSH_PRIVATE_KEY: ${{ secrets.LAMBDA_SSH_PRIVATE_KEY != '' }}
          V_LAMBDA_SSH_PRIVATE_KEY: ${{ vars.LAMBDA_SSH_PRIVATE_KEY != '' }}
          S_LAMBDA_SSH_KEY_NAME: ${{ secrets.LAMBDA_SSH_KEY_NAME != '' }}
          V_LAMBDA_SSH_KEY_NAME: ${{ vars.LAMBDA_SSH_KEY_NAME != '' }}
        shell: python
        run: |
          import os
          lines = [f"## {os.environ['WHERE']}: the names the workflows read (never a value)", "",
                   "| Name | As a secret | As a variable |", "|---|---|---|"]
          for n in os.environ["NAMES"].split():
              seen = lambda k: "set" if os.environ.get(k + n) == "true" else "not seen"
              lines.append(f"| `{n}` | {seen('S_')} | {seen('V_')} |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(lines) + "\n\n")
          print("\n".join(lines))
      - name: The repository's environments
        id: envs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          names=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments?per_page=100" | jq -c '[.environments[]?.name]' || echo '[]')
          echo "names=$names" >> "$GITHUB_OUTPUT"
          echo "Environments: $names" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
  environment:
    needs: repository
    if: needs.repository.outputs.environments != '' && needs.repository.outputs.environments != '[]'
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.repository.outputs.environments) }}
    environment: ${{ matrix.env }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - name: The names this environment's jobs can see (never a value)
        env:
          WHERE: Environment ${{ matrix.env }} (with the repository's)
          S_AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS != '' }}
          V_AZURE_CREDENTIALS: ${{ vars.AZURE_CREDENTIALS != '' }}
          S_AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID != '' }}
          V_AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID != '' }}
          S_AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
          V_AZURE_CLIENT_SECRET: ${{ vars.AZURE_CLIENT_SECRET != '' }}
          S_AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID != '' }}
          V_AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID != '' }}
          S_AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID != '' }}
          V_AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID != '' }}
          S_GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS != '' }}
          V_GCP_CREDENTIALS: ${{ vars.GCP_CREDENTIALS != '' }}
          S_GCP_PROJECT: ${{ secrets.GCP_PROJECT != '' }}
          V_GCP_PROJECT: ${{ vars.GCP_PROJECT != '' }}
          S_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
          V_AWS_ACCESS_KEY_ID: ${{ vars.AWS_ACCESS_KEY_ID != '' }}
          S_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY != '' }}
          V_AWS_SECRET_ACCESS_KEY: ${{ vars.AWS_SECRET_ACCESS_KEY != '' }}
          S_LAMBDA_API_KEY: ${{ secrets.LAMBDA_API_KEY != '' }}
          V_LAMBDA_API_KEY: ${{ vars.LAMBDA_API_KEY != '' }}
          S_LAMBDA_SSH_PRIVATE_KEY: ${{ secrets.LAMBDA_SSH_PRIVATE_KEY != '' }}
          V_LAMBDA_SSH_PRIVATE_KEY: ${{ vars.LAMBDA_SSH_PRIVATE_KEY != '' }}
          S_LAMBDA_SSH_KEY_NAME: ${{ secrets.LAMBDA_SSH_KEY_NAME != '' }}
          V_LAMBDA_SSH_KEY_NAME: ${{ vars.LAMBDA_SSH_KEY_NAME != '' }}
        shell: python
        run: |
          import os
          lines = [f"## {os.environ['WHERE']}: the names the workflows read (never a value)", "",
                   "| Name | As a secret | As a variable |", "|---|---|---|"]
          for n in os.environ["NAMES"].split():
              seen = lambda k: "set" if os.environ.get(k + n) == "true" else "not seen"
              lines.append(f"| `{n}` | {seen('S_')} | {seen('V_')} |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(lines) + "\n\n")
          print("\n".join(lines))
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
