name: verify
on: [push, pull_request]
env:
  OMNI_NOTICE: '© 2026 Dubra Software Inc. / The Omni-Compass LLC. All rights reserved. **Evaluation and Simulation use only.** Any commercial use, commercialization, monetization, production use, redistribution or hosted service of any part of Omni-Compass requires a signed, paid Omni-Compass Enterprise License from Dubra Software Inc. / The Omni-Compass LLC. Every copy, export, report and printout carries this notice with `LICENSE`, `NOTICE` and `DISCLOSURES.md`. All patents, copyrights and trademarks filed in the USA. www.omni-compass.com'
# the token reads the code and nothing else: this workflow pushes nothing, starts nothing and reads no other run
# (docs/THREAT_MODEL.md, T9)
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      # the raw receipts live on the branch raw (scripts/raw_archive.sh): main holds the code and the tables only
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/results/live/raw/*
      - name: The branch raw's trees, so every receipt path a page names is checked (nothing downloaded)
        run: bash scripts/raw_archive.sh fetch
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # the exact versions verify.py passed with before the push (requirements-lock.txt), so this check runs the same
      # environment; requirements.txt gives the supported ranges
      - run: pip install -r requirements-lock.txt
      # the workflow checker (rhysd/actionlint), one pinned release, its checksum the one the release publishes (24 October)
      - run: |
          curl -sSL -o /tmp/actionlint.tgz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/actionlint.tgz -C /usr/local/bin actionlint
      - run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release && cmake --build cpp/build -j2
      - run: python verify.py --quick
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
  page-tests:
    # the live engine page's own tests on every push and pull request, on their own and in a minute (6 November, the software seat: no
    # workflow ran tests/test_live_*.py by themselves): the records, the contents, the monitors, the glossary, the self-update, the page's
    # identity against its stamp, and every script the page runs compiled by node
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/results/live/raw/*
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: The page tests (tests/test_live_*.py)
        shell: bash
        run: python -m unittest discover -v -s tests -p "test_live_*.py" -t . 2>&1 | tail -60 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
