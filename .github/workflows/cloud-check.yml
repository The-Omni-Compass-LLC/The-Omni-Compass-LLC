# Google Cloud's and Amazon's check, at no cost (18 October), and Azure's (22 October, after the stored Azure key held, for a
# while on 21 October, a text Azure's login refuses): the cloud's login, the stored key's shape, and the sets' pre-flight (the machine type
# offered, every quota a set needs), then it stops: nothing is built and nothing is billed.
# The conductor (scripts/dispatch_grid.py) starts a cloud's sets only after that cloud's newest check passed (and again
# after a day), and starts a check itself when there is none, the last one failed over an hour ago, or the last pass is a
# day old; so once the founder's fix is stored (a whole Google key, Amazon's Paid plan), the sets start on their own within
# the hour, and a cloud that cannot rent never uses up a set's A, B or C. On Amazon, a quota short of a set is asked of
# Amazon here (the founder's order of 18 October: raised with the cloud, never shrunk to fit). A cluster a tester built in a
# provider's own console (oracle, digitalocean, alibaba, linode, ibm or other; docs/BYOC_SETUP.md) is checked the same way:
# its kubeconfig's shape, then the cluster's own shape (scripts/byoc_paired.sh, PREFLIGHT_ONLY=1), and nothing measured.
# Started by hand: cloud = google, amazon, azure, both (Google and Amazon), all (those three), or one of the five above.
name: cloud-check
# the title the conductor reads a check back by: cloud-check google | cloud-check amazon | cloud-check azure | cloud-check oracle ...
run-name: cloud-check ${{ github.event.inputs.cloud || 'azure' }}
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cloud-check.yml']
  workflow_dispatch:
    inputs:
      cloud: {description: "google, amazon, azure, both (google and amazon), all (those three), or a cluster built in a provider's console: oracle, digitalocean, alibaba, linode, ibm, other", default: "both"}
permissions:
  contents: read
env:
  OMNI_NOTICE: '© 2026 The Omni-Compass LLC. All rights reserved. **Evaluation and Simulation use only.** Any commercial use, commercialization, monetization, production use, redistribution or hosted service of any part of Omni-Compass requires a signed, paid Omni-Compass Enterprise License from The Omni-Compass LLC. Every copy, export, report and printout carries this notice with `LICENSE`, `NOTICE` and `DISCLOSURES.md`. All patents, copyrights and trademarks filed in the USA. www.omni-compass.com'
jobs:
  google:
    if: contains(fromJSON('["google", "both", "all"]'), (github.event.inputs.cloud || 'azure'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
      HAS_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS != '' && secrets.GCP_PROJECT != '' }}
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - name: The secrets this cloud needs
        if: env.HAS_CREDENTIALS != 'true'
        run: |
          echo "::error::GCP_CREDENTIALS and GCP_PROJECT are not both in this repository's secrets: docs/GOOGLE_SETUP.md, sections 4 and 5."
          exit 2
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {sparse-checkout: "scripts\ntools"}
      - name: The key is whole (its shape only; not a character of it is printed)
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: python3 tools/cloud_key_check.py
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with: {credentials_json: "${{ secrets.GCP_CREDENTIALS }}"}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: The services the sets use are on (costs nothing)
        run: bash scripts/gcp_services.sh
      - name: The sets' pre-flight, then stop
        env: {REP: "1", GCP_ZONE: us-central1-a, GKE_MACHINE: e2-standard-2, GKE_MAX_NODES: "4", PREFLIGHT_ONLY: "1"}
        run: |
          # the pre-flight's own words on a refusal also stand at the top of the run's page (an annotation)
          set +e; bash scripts/gke_paired.sh 2>&1 | tee preflight.log; rc=${PIPESTATUS[0]}; set -e
          [ "$rc" = 0 ] || { grep '^pre-flight:' preflight.log | tail -3 | while IFS= read -r l; do echo "::error::$l"; done; exit "$rc"; }
      - name: What this check found
        if: always()
        run: |
          if [ "${{ job.status }}" = success ]; then
            echo "**Google Cloud: ready.** The key logs in, the machine type is offered and every quota has room: the conductor starts the sets." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Google Cloud: not ready.** Nothing built, nothing billed; the failed step above says why, and docs/GOOGLE_SETUP.md how to fix it." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
  amazon:
    if: contains(fromJSON('["amazon", "both", "all"]'), (github.event.inputs.cloud || 'azure'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HAS_CREDENTIALS: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - name: The secrets this cloud needs
        if: env.HAS_CREDENTIALS != 'true'
        run: |
          echo "::error::AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY are not both in this repository's secrets: docs/AMAZON_SETUP.md, sections 2 and 3."
          exit 2
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {sparse-checkout: "scripts\ntools"}
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: The sets' pre-flight, then stop (a short quota is asked of Amazon)
        env: {REP: "1", AWS_REGION: us-east-1, EKS_INSTANCE: m5.large, EKS_MAX_NODES: "4", PREFLIGHT_ONLY: "1", QUOTA_REQUEST: "0"}
        run: |
          # the pre-flight's own words on a refusal also stand at the top of the run's page (an annotation)
          set +e; bash scripts/eks_paired.sh 2>&1 | tee preflight.log; rc=${PIPESTATUS[0]}; set -e
          [ "$rc" = 0 ] || { grep '^pre-flight:' preflight.log | tail -3 | while IFS= read -r l; do echo "::error::$l"; done; exit "$rc"; }
      - name: What this check found
        if: always()
        run: |
          if [ "${{ job.status }}" = success ]; then
            echo "**Amazon: ready.** The keys log in, the instance type is offered and the processor quota has room: the conductor starts the sets." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Amazon: not ready.** Nothing built, nothing billed; the failed step above says why, and docs/AMAZON_SETUP.md how to fix it." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
  azure:
    if: contains(fromJSON('["azure", "all"]'), (github.event.inputs.cloud || 'azure'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HAS_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS != '' || secrets.AZURE_CLIENT_SECRET != '' }}
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - name: The secret this cloud needs
        if: env.HAS_CREDENTIALS != 'true'
        run: |
          echo "::error::Neither AZURE_CREDENTIALS nor AZURE_CLIENT_SECRET is in this repository's secrets: the four boxes, docs/AZURE_SETUP.md, section 7a (AZURE_CLIENT_SECRET is the Value of a new client secret, on the app's Certificates & secrets page)."
          exit 2
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {sparse-checkout: "scripts\ntools"}
      - name: The Azure key is whole (its shape only; not a character of it is printed)
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: python3 tools/cloud_key_check.py azure
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with: {creds: "${{ env.AZ_CREDS }}"}
      - name: The subscription is on (costs nothing)
        run: |
          state=$(az account show --query state -o tsv)
          [ "$state" = Enabled ] || { echo "::error::pre-flight: the Azure subscription is not enabled (it reads $state); docs/AZURE_SETUP.md, section 5"; exit 2; }
      - name: The sets' pre-flight, then stop
        # the default set's fleet (aks-metered.yml: Standard_D2s_v4 in eastus, the system machine and up to 4 workers)
        run: python3 scripts/azure_capacity.py preflight --location eastus --system-size Standard_D2s_v4 --pools Standard_D2s_v4:4
      - name: What this check found
        if: always()
        run: |
          if [ "${{ job.status }}" = success ]; then
            echo "**Azure: ready.** The key is whole and logs in, the subscription is on, the machine is offered and the allowance holds the fleet: the conductor starts the sets." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Azure: not ready.** Nothing built, nothing billed; the failed step above says why, and docs/AZURE_SETUP.md how to fix it." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
  byoc:
    # a cluster built in a provider's own console and handed over by its kubeconfig (docs/BYOC_SETUP.md): never in "all", since
    # no such secret stands until a tester stores one
    if: contains(fromJSON('["oracle", "digitalocean", "alibaba", "linode", "ibm", "other"]'), github.event.inputs.cloud || 'azure')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUD: ${{ github.event.inputs.cloud }}
      KUBECONFIG_RAW: >-
        ${{ github.event.inputs.cloud == 'oracle' && secrets.KUBECONFIG_ORACLE || github.event.inputs.cloud == 'digitalocean' && secrets.KUBECONFIG_DIGITALOCEAN
         || github.event.inputs.cloud == 'alibaba' && secrets.KUBECONFIG_ALIBABA || github.event.inputs.cloud == 'linode' && secrets.KUBECONFIG_LINODE
         || github.event.inputs.cloud == 'ibm' && secrets.KUBECONFIG_IBM || secrets.KUBECONFIG_OTHER }}
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {sparse-checkout: "scripts\ntools"}
      - name: The kubeconfig is whole (its shape only; not a character of it is printed)
        run: |
          umask 077
          python3 tools/cloud_key_check.py kubeconfig
          printf '%s' "$KUBECONFIG_RAW" | python3 -c "import base64, sys; t = sys.stdin.read(); sys.stdout.write(t if 'apiVersion' in t else base64.b64decode(t).decode())" > "$RUNNER_TEMP/kubeconfig"
      - name: The cluster's shape, then stop (nothing measured)
        run: KUBECONFIG="$RUNNER_TEMP/kubeconfig" PREFLIGHT_ONLY=1 REP=1 bash scripts/byoc_paired.sh
      - name: What this check found
        if: always()
        run: |
          if [ "${{ job.status }}" = success ]; then
            echo "**$CLOUD: ready.** The kubeconfig is whole, the cluster answers and has the shape docs/BYOC_SETUP.md sets: its sets may start once its queue's switch is on." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**$CLOUD: not ready.** Nothing measured, nothing billed; the failed step above says why, and docs/BYOC_SETUP.md how to fix it." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
