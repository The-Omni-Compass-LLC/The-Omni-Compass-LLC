name: peek
# Reads a run that is still going: downloads the repetitions it has finished so far (its artifacts) and prints their
# paired table, native against Omni-Compass on top of native, in this job's log and report, so a running benchmark can be
# looked at before its last repetition ends and a problem caught while it can still be fixed (the founder's order of 14
# October). It reads only: it writes nothing to the repository and its table is a look, never a result; the result is the
# run's own report when every repetition has finished.
on:
  workflow_dispatch:
    inputs:
      run_id: {description: "the run to read (its number in its link)", required: true}
      pattern: {description: "which of its artifacts (aks-* for Azure, six-* for the organisms, * for all)", default: "*"}
      tool: {description: "live (tools/live_reps.py, Kubernetes and Azure) or six (tools/six_kube_report.py, the organisms)", default: "live"}
permissions:
  actions: read
  contents: read
env:
  OMNI_NOTICE: '© 2026 Dubra Software Inc. / The Omni-Compass LLC. All rights reserved. **Evaluation and Simulation use only.** Any commercial use, commercialization, monetization, production use, redistribution or hosted service of any part of Omni-Compass requires a signed, paid Omni-Compass Enterprise License from Dubra Software Inc. / The Omni-Compass LLC. Every copy, export, report and printout carries this notice with `LICENSE`, `NOTICE` and `DISCLOSURES.md`. All patents, copyrights and trademarks filed in the USA. www.omni-compass.com'
jobs:
  peek:
    runs-on: ubuntu-24.04
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4: the code, not the archive of raw runs
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/results/live/raw/*
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ github.token }}
          pattern: ${{ github.event.inputs.pattern }}
          path: reps
          merge-multiple: ${{ github.event.inputs.tool == 'live' }}
      - name: The repetitions finished so far, paired
        run: |
          echo "run ${{ github.event.inputs.run_id }}: what it has handed in so far"
          ls reps
          if [ "${{ github.event.inputs.tool }}" = six ]; then
            python tools/six_kube_report.py reps && cat reps/SIX_KUBE.md | tee -a "$GITHUB_STEP_SUMMARY"
          else
            python tools/live_reps.py reps && cat reps/LIVE_REPS.md | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
