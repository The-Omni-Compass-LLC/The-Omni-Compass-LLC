name: six-kube
# The seven organisms with the real Kubernetes cluster inside (tools/run_kil.py): the spine, the four realms, the whole
# tower and the four stacked, each native against native with Omni-Compass on top (the max), paired on one runner per
# repetition, each arm on a fresh six-worker kind cluster (scripts/kind_paired.sh). Seven organisms times two arms:
# fourteen columns, one report
# (tools/six_kube_report.py -> SIX_KUBE.md). Started with its defaults (Actions -> six-kube -> Run workflow), it starts
# the whole grid: every organism at 1, 10, 100 and 500 copies, every size to 500 repetitions (free GitHub only, owner's
# order of 15 October; scripts/dispatch_grid.py, kept going by grid.yml until every square is full). Started with what =
# runs, it runs one dispatch. The organism steps on the window's clock, so the window is set long enough for the max's arm
# to make every step in time (a repetition more than 5% late is marked off the clock). With split = yes each arm of a
# repetition runs on its own runner (for a window too long for both on one; the planner checks the full per-arm job budget). "protocol 4" in a run's
# name: the test rig as amended on 12 Oct (scripts/kind_bench.sh: the governor never below the organism's CPU priority, its
# decisions counted inside the window, refused downloads tried again), on 13 Oct (the model of the organism on the
# runner's last core, the kind nodes on the others; the window lengthened from the heavier arm's step timed before either
# arm, scripts/kind_paired.sh) and on 18 Oct (the served image pulled onto every worker before each arm,
# deploy/kind/prepull.yaml, docs/POD_START_WAIT.md); the grid counts these runs only.
run-name: >-
  ${{ github.event_name != 'workflow_dispatch' && 'six-kube' ||
      inputs.what != 'runs' && 'six-kube: start every square of the grid' ||
      format('six-kube x{0} orgs {1} reps {2}+{3} arms {4} split {5} window {6} protocol 4', inputs.sizes, inputs.organisms,
             inputs.rep_first, inputs.reps, inputs.arms, inputs.split, inputs.durations_s) }}
on:
  workflow_dispatch:
    inputs:
      what: {description: "grid (start every square of the whole grid: 1, 10, 100 and 500 copies, every size to 500 repetitions) or runs (only the repetitions below)", default: "grid"}
      sizes: {description: "runs: copies of each organism on one clock, the real cluster inside (1, 10, 100, 500; free runners only, comma-separated)", default: "1"}
      organisms: {description: "runs: organisms, comma-separated (compute_ai_cloud, physics_robotics_autonomous, energy_facility_industrial, distribution_specialized, stack, tower, spine)", default: "compute_ai_cloud,physics_robotics_autonomous,energy_facility_industrial,distribution_specialized,stack,tower,spine"}
      reps: {description: "runs: paired repetitions of each organism (one number, or one per size)", default: "10"}
      rep_first: {description: "runs: the first repetition (1-based), so a square's repetitions can be cut into dispatches under GitHub's 256 jobs", default: "1"}
      durations_s: {description: "runs: measured seconds per arm (240 organism steps; one number, or one per size)", default: "960"}
      arms: {description: "Arms, in rotation order", default: "native compass"}
      split: {description: "runs: yes = each arm of a repetition on its own runner (a window too long for both on one); no = both on one runner", default: "no"}
      load_max: {description: "Load-generator replicas at each organism's peak demand", default: "6"}
      loadgen: {description: "closed (waits for answers) or open (fixed rate, equal work)", default: "open"}
permissions:
  actions: write
  contents: read
env:
  OMNI_NOTICE: '© 2026 The Omni-Compass LLC. All rights reserved. **Evaluation and Simulation use only.** Any commercial use, commercialization, monetization, production use, redistribution or hosted service of any part of Omni-Compass requires a signed, paid Omni-Compass Enterprise License from The Omni-Compass LLC. Every copy, export, report and printout carries this notice with `LICENSE`, `NOTICE` and `DISCLOSURES.md`. All patents, copyrights and trademarks filed in the USA. www.omni-compass.com'
jobs:
  grid:
    if: github.event.inputs.what != 'runs'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {sparse-checkout: "scripts\nresults/grid_v23\ntools\nrealms\nomnicompass\nomni_controller"}
      - name: Start every square with the cluster inside not yet started
        env: {GITHUB_TOKEN: "${{ github.token }}"}
        run: python3 scripts/dispatch_grid.py tick --grid six-kube --ref "${{ github.ref_name }}"
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
  plan:
    if: github.event.inputs.what == 'runs'
    runs-on: ubuntu-24.04
    outputs: {cells: "${{ steps.r.outputs.cells }}"}
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {sparse-checkout: scripts}
      - id: r
        run: |
          echo "cells=$(python3 scripts/dispatch_grid.py kube-matrix --sizes "${{ github.event.inputs.sizes }}" \
            --organisms "${{ github.event.inputs.organisms }}" --reps "${{ github.event.inputs.reps }}" \
            --rep-first "${{ github.event.inputs.rep_first }}" --durations "${{ github.event.inputs.durations_s }}" \
            --split "${{ github.event.inputs.split }}")" >> "$GITHUB_OUTPUT"
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
  run:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 256  # the conductor keeps the repository's jobs at what GitHub runs plus a margin (scripts/dispatch_grid.py)
      matrix:
        cell: "${{ fromJSON(needs.plan.outputs.cells) }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      # Include root-level requirements and legal inputs as well as runtime sources.
      # Cone mode would treat root filenames as directories, so use explicit patterns.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            deploy/
            scripts/
            tools/
            pilot/
            fleet/
            tuning/
            omni_controller/
            omni_orchestrator/
            omnicompass/
            realms/
            hardware/
            results/hardware/
            requirements.txt
            OMNI_V*.json
            README.md
            LICENSE
            NOTICE
            DISCLOSURES.md
            PATENTS.md
            TRADEMARKS.md
      - name: Engine and source receipt
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"
          python3 tools/omni_version.py | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      # kind and kubectl at the grid's versions (kind v0.31.0: Kubernetes v1.35.0); a download GitHub refuses is tried again
      # below, slower and checksum-checked, never the end of the job (12 Oct: a refused checksum file ended a job before
      # either arm ran)
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1
        id: kind
        continue-on-error: true
        with: {install_only: true, version: v0.31.0, kubectl_version: v1.35.0}
      - name: kind and kubectl again, if the first download was refused
        if: steps.kind.outcome == 'failure'
        run: bash scripts/kind_install.sh v0.31.0 v1.35.0
      - run: bash scripts/kind_paired.sh
        env:
          REP: ${{ matrix.cell.rep }}
          ARMS: ${{ matrix.cell.arms }}
          DURATION: ${{ matrix.cell.duration }}
          ORGANISM: ${{ matrix.cell.organism }}
          ORGANISM_SCALE: ${{ matrix.cell.size }}
          LOAD_MAX: ${{ github.event.inputs.load_max || '6' }}
          LOADGEN: ${{ github.event.inputs.loadgen || 'open' }}
          CLOSURE: tuning/GLOBAL_LEAGUE_PREREGISTRATION.json
      - name: Attach README, licenses and disclosures to this artifact
        id: omni_legal_export_1
        if: "always()"
        env:
          OMNI_EXPORT_PATHS: |
            bench-*-${{ matrix.cell.rep }}
        shell: python
        run: |
          #!/usr/bin/env python3
          # SPDX-License-Identifier: LicenseRef-OmniCompass-Evaluation-1.0
          # Copyright (c) 2026 The Omni-Compass LLC. All rights reserved.
          # Evaluation and Simulation use only; any commercialization, monetization or other use requires a signed, paid
          # Omni-Compass Enterprise License. See LICENSE, NOTICE and DISCLOSURES.md.
          # All patents, copyrights and trademarks filed in the USA. www.omni-compass.com
          """Attach the exact legal bundle inside an artifact without changing its result-file layout."""
          import glob
          import hashlib
          import json
          import os
          from pathlib import Path
          import urllib.parse
          import urllib.request
          import uuid
          
          BUNDLE = ('README.md', 'LICENSE', 'NOTICE', 'DISCLOSURES.md', 'PATENTS.md', 'TRADEMARKS.md')
          
          
          def search_root(pattern, workspace):
              path = Path(os.path.expanduser(pattern))
              if not path.is_absolute():
                  path = workspace / path
              prefix = Path(path.anchor)
              for part in path.parts[1:]:
                  if glob.has_magic(part):
                      return prefix
                  prefix /= part
              return path if path.is_dir() or (not path.exists() and not path.suffix) else path.parent
          
          
          def attach(paths, workspace, loader=None):
              workspace = Path(workspace).absolute()
              lines = [p.strip() for p in paths.splitlines() if p.strip()]
              roots = [search_root(p, workspace) for p in lines if not p.startswith('!')]
              if not roots:
                  raise ValueError('artifact has no positive output path')
              root = Path(os.path.commonpath([str(p) for p in roots]))
              if root == Path(root.anchor):
                  raise ValueError('refusing to write an export bundle at a filesystem root')
              legal = root / '_omni_legal'
              legal.mkdir(parents=True, exist_ok=True)
              hashes = {}
              for name in BUNDLE:
                  source = workspace / name
                  data = source.read_bytes() if source.is_file() else loader(name) if loader else None
                  if data is None:
                      raise FileNotFoundError('required export legal file is unavailable: ' + name)
                  target = legal / name
                  target.write_bytes(data)
                  hashes[name] = hashlib.sha256(data).hexdigest()
              (legal / 'SHA256SUMS.json').write_text(json.dumps(hashes, indent=2) + '\n')
              return '\n'.join([*lines, *(str(legal / n) for n in (*BUNDLE, 'SHA256SUMS.json'))])
          
          
          def main():
              workspace = Path(os.environ.get('GITHUB_WORKSPACE', '.')).absolute()
              def public_source(name):
                  # Collect-only jobs may not check out source. Fetch only these public legal files, pinned to the run commit.
                  repo, sha = os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA']
                  url = f'https://raw.githubusercontent.com/{repo}/{sha}/{urllib.parse.quote(name)}'
                  with urllib.request.urlopen(url, timeout=30) as response:
                      return response.read()
              paths = attach(os.environ['OMNI_EXPORT_PATHS'], workspace, public_source)
              delimiter = 'OMNI_LEGAL_' + uuid.uuid4().hex
              with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
                  out.write('paths<<' + delimiter + '\n' + paths + '\n' + delimiter + '\n')
          
          
          if __name__ == '__main__':
              main()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: {name: "six-${{ matrix.cell.organism }}-x${{ matrix.cell.size }}-${{ matrix.cell.rep }}${{ matrix.cell.tag }}", path: "${{ steps.omni_legal_export_1.outputs.paths }}"}
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
  report:
    needs: run
    if: always() && needs.run.result != 'skipped'
    runs-on: ubuntu-24.04
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      # Report needs requirements.txt, the legal bundle, and transitive Python imports.
      # A sparse checkout silently omitted these dependencies and broke final reporting.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {pattern: "six-*", path: six}
      - run: python tools/six_kube_report.py six
      - run: cat six/SIX_KUBE.md >> "$GITHUB_STEP_SUMMARY"
      - name: Attach README, licenses and disclosures to this artifact
        id: omni_legal_export_2
        env:
          OMNI_EXPORT_PATHS: |
            six/SIX_KUBE.*
        shell: python
        run: |
          #!/usr/bin/env python3
          # SPDX-License-Identifier: LicenseRef-OmniCompass-Evaluation-1.0
          # Copyright (c) 2026 The Omni-Compass LLC. All rights reserved.
          # Evaluation and Simulation use only; any commercialization, monetization or other use requires a signed, paid
          # Omni-Compass Enterprise License. See LICENSE, NOTICE and DISCLOSURES.md.
          # All patents, copyrights and trademarks filed in the USA. www.omni-compass.com
          """Attach the exact legal bundle inside an artifact without changing its result-file layout."""
          import glob
          import hashlib
          import json
          import os
          from pathlib import Path
          import urllib.parse
          import urllib.request
          import uuid
          
          BUNDLE = ('README.md', 'LICENSE', 'NOTICE', 'DISCLOSURES.md', 'PATENTS.md', 'TRADEMARKS.md')
          
          
          def search_root(pattern, workspace):
              path = Path(os.path.expanduser(pattern))
              if not path.is_absolute():
                  path = workspace / path
              prefix = Path(path.anchor)
              for part in path.parts[1:]:
                  if glob.has_magic(part):
                      return prefix
                  prefix /= part
              return path if path.is_dir() or (not path.exists() and not path.suffix) else path.parent
          
          
          def attach(paths, workspace, loader=None):
              workspace = Path(workspace).absolute()
              lines = [p.strip() for p in paths.splitlines() if p.strip()]
              roots = [search_root(p, workspace) for p in lines if not p.startswith('!')]
              if not roots:
                  raise ValueError('artifact has no positive output path')
              root = Path(os.path.commonpath([str(p) for p in roots]))
              if root == Path(root.anchor):
                  raise ValueError('refusing to write an export bundle at a filesystem root')
              legal = root / '_omni_legal'
              legal.mkdir(parents=True, exist_ok=True)
              hashes = {}
              for name in BUNDLE:
                  source = workspace / name
                  data = source.read_bytes() if source.is_file() else loader(name) if loader else None
                  if data is None:
                      raise FileNotFoundError('required export legal file is unavailable: ' + name)
                  target = legal / name
                  target.write_bytes(data)
                  hashes[name] = hashlib.sha256(data).hexdigest()
              (legal / 'SHA256SUMS.json').write_text(json.dumps(hashes, indent=2) + '\n')
              return '\n'.join([*lines, *(str(legal / n) for n in (*BUNDLE, 'SHA256SUMS.json'))])
          
          
          def main():
              workspace = Path(os.environ.get('GITHUB_WORKSPACE', '.')).absolute()
              def public_source(name):
                  # Collect-only jobs may not check out source. Fetch only these public legal files, pinned to the run commit.
                  repo, sha = os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA']
                  url = f'https://raw.githubusercontent.com/{repo}/{sha}/{urllib.parse.quote(name)}'
                  with urllib.request.urlopen(url, timeout=30) as response:
                      return response.read()
              paths = attach(os.environ['OMNI_EXPORT_PATHS'], workspace, public_source)
              delimiter = 'OMNI_LEGAL_' + uuid.uuid4().hex
              with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
                  out.write('paths<<' + delimiter + '\n' + paths + '\n' + delimiter + '\n')
          
          
          if __name__ == '__main__':
              main()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: six-kube, path: "${{ steps.omni_legal_export_2.outputs.paths }}"}
      - name: Legal files beside the files this run hands out
        if: always()
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: _legal
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            README.md
            LICENSE
            NOTICE
            DISCLOSURES.md
            PATENTS.md
            TRADEMARKS.md
      - name: Legal notice handed out with this run's files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: legal-notice
          overwrite: true
          path: |
            _legal/README.md
            _legal/LICENSE
            _legal/NOTICE
            _legal/DISCLOSURES.md
            _legal/PATENTS.md
            _legal/TRADEMARKS.md
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
