name: live-engine
# The live benchmark engine page (docs/engine/OMNI_COMPASS_LIVE_ENGINE.html) is a monitor of the engine, never a drawing of it (the
# founder's order of 17 October 2026: "wire it up to the engine itself and let the math move through"). Whenever the engine,
# a model, a harness or a result changes on main, after every front-page refresh, and every three hours besides:
#   1. docs/engine/build_live_engine.py makes every record the page replays again, with the repository's own code on the
#      engine that stands (the realms harness and its immune system, the shipped controller on the model cluster, the GPU card,
#      the Linux host, the realms table, the newest engine's receipts, and the official runs played back from their own
#      raw files, every file's SHA-256 matched against the run's own list) and GitHub's list of the runs running and queued;
#      it stamps the engine tools/omni_version.py reads on the page and rebuilds every record on it (a newer engine than the prose
#      was written for is announced in a banner until the prose is realigned); --check fails a page whose engine differs;
#   2. docs/engine/check_live_engine.py checks the page's engine against the Python and against the C++ core (compiled
#      here), and docs/engine/check_records.py checks every record against the repository's own runs;
#   3. the legal notice is checked, and the page is pushed.
# One build at a time.
on:
  push:
    branches: [main]
    paths:
      - "OMNI_V*.json"
      - "omnicompass/**"
      - "omni_controller/**"
      - "realms/**"
      - "pilot/**"
      - "fleet/**"
      - "cpp/**"
      - "tools/model_gate.py"
      - "tools/omni_version.py"
      - "results/realms_v5/**"
      - "results/live/V*_*.md"
      - "results/live/V*_*.json"
      - "results/BENEFIT_SHEET.json"
      - "results/OMNI_INDEX.md"
      - "results/grid_v*/**"
      - "results/engine_runs/**"   # a set of the Python's runs pushed by hand (engine-runs.yml starts this build itself once its set is committed)
      - "scripts/reruns.txt"
      - "scripts/*_queue.txt"
      - "scripts/gpu_campaign_profiles.json"
      - "docs/engine/**"
      - "!docs/engine/OMNI_COMPASS_LIVE_ENGINE.html"   # its own commit never starts it again (20 October: it had rebuilt itself every 7 minutes)
      - "!docs/engine/PAGE_WORD_FOR_WORD.md"           # written by this job (docs/book/build_live_manual.py), never a reason to run it
      - "docs/OMNI_COMPASS_LIVE_ENGINE_MANUAL.md"      # the guided tour's words (tools/tour_script.py reads each stop from it)
      - "tools/tour_script.py"
      - "docs/book/build_live_manual.py"
      - ".github/workflows/live-engine.yml"
  workflow_run:
    workflows: [front-page]
    branches: [main, "gpu-omni-*"]   # only a run on main or a GPU branch starts it (27 October: 20 pushes to one review branch, each
                                     # with its 23 skipped runs, started 111 front pages, 111 live engines and 142 sweeps in an hour)
    types: [completed]
  schedule:
    - cron: "41 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  OMNI_NOTICE: '© 2026 Dubra Software Inc. / The Omni-Compass LLC. All rights reserved. **Evaluation and Simulation use only.** Any commercial use, commercialization, monetization, production use, redistribution or hosted service of any part of Omni-Compass requires a signed, paid Omni-Compass Enterprise License from Dubra Software Inc. / The Omni-Compass LLC. Every copy, export, report and printout carries this notice with `LICENSE`, `NOTICE` and `DISCLOSURES.md`. All patents, copyrights and trademarks filed in the USA. www.omni-compass.com'
jobs:
  build:
    # a front-page run that skipped or failed has nothing new for the page
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    concurrency: {group: live-engine, cancel-in-progress: false}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        # bash with -e and -o pipefail: a check whose output is piped into tee still fails its step, and a failed check stops
        # the page from being committed (the default shell without "shell: bash" drops a failure in front of a pipe)
        shell: bash
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/results/live/raw/*
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - name: The official runs' raw folders the page plays back, checked out
        run: |
          bash scripts/raw_archive.sh fetch
          python docs/engine/export_runs.py --dirs > raw_dirs.txt
          wc -l < raw_dirs.txt
          bash scripts/raw_archive.sh open $(sed 's#^/results/live/raw/#/#' raw_dirs.txt)
      - name: The guided tour's recorded voice, read again for any stop whose words changed
        # tools/tour_voice.py: the Kokoro-82M voice (Apache-2.0) reads a stop again only when the Live Engine Manual's words for
        # it or the section's controls line changed; the page plays a clip only while it reads the stop's words today, so a
        # voice that could not be read leaves those stops to the browser's own voice and never stops the build
        continue-on-error: true
        run: |
          python tools/tour_voice.py --status || {
            python -m venv "$RUNNER_TEMP/voice" && "$RUNNER_TEMP/voice/bin/pip" install -q kokoro-onnx==0.6.1 soundfile==0.14.0 &&
            "$RUNNER_TEMP/voice/bin/python" tools/tour_voice.py | tee -a "$GITHUB_STEP_SUMMARY"; }
      - name: Rebuild the page from the engine that stands and the repository's own results
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          # every Azure run that handed in a receipt, each under its own engine (the founder's words of 8 November: "Where's the
          # cloud? ... make sure all the most benchmark shit is sitting in there"): results/live/AZURE_RECORD.md, read by the page
          python tools/azure_record.py | tee -a "$GITHUB_STEP_SUMMARY"
          python docs/engine/build_live_engine.py | tee -a "$GITHUB_STEP_SUMMARY"
          # the two bills and work for the bill first (tools/two_bills.py, tools/work_per_bill.py): a new chip or cloud receipt
          # reaches the one number, the README and the page by itself (the founder's words of 2 November)
          python tools/two_bills.py && python tools/oversight.py && python tools/work_per_bill.py && python tools/work_today.py && python tools/faq.py
          python tools/headline.py | tee -a "$GITHUB_STEP_SUMMARY"
          # the numbers a website may show follow the records they are read from (the founder's words of 4 November: "every
          # number that's in this website, if you don't have the receipt ... cannot live nowhere"): results/SITE_NUMBERS.json
          python tools/site_numbers.py | tee -a "$GITHUB_STEP_SUMMARY"
          # the website's one-file copy follows every rebuild (the founder's words of 1 November: "people need to click updated new
          # shit and it needs to keep on updating"): docs/live/index.html is rebuilt from the page each time, never left behind it
          # the stamp every copy reads, written from the page as it is committed (its identity, byte count and sha256 after every writer
          # above, section 2b's included): a copy opens a newer page only when it arrives with exactly those bytes
          python docs/engine/build_live_engine.py --stamp | tee -a "$GITHUB_STEP_SUMMARY"
          # the website's copy is built from the stamped page, so it carries the page's identity and knows itself the newest (6 November,
          # the software seat: built before the stamp, it would read every visit as a newer build and fetch the whole page)
          python docs/engine/build_standalone.py | tee -a "$GITHUB_STEP_SUMMARY"
          # the page word for word (docs/engine/PAGE_WORD_FOR_WORD.md, Appendix L of the Live Benchmark Engine Manual), written from the
          # stamped page as it is committed; it reads the page and never writes it (the editor seat of 6 November: two builds behind, 163
          # LOSS rows against the page's 273)
          python docs/book/build_live_manual.py | tee -a "$GITHUB_STEP_SUMMARY"
          # the words follow the numbers (the founder's order of 6 November: when a benchmark changes a number, the words that quote it
          # change with it): every count the live engine monograph quotes is written again from its record (tools/monograph_words.py),
          # and the benefit sheet from the tables it reads
          python tools/benefit_sheet.py | tee -a "$GITHUB_STEP_SUMMARY"
          python tools/monograph_words.py --fix | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The page's engine against the Python and the C++; every record against the repository's own runs
        # the check reads with the access the build had (1 November: without GitHub's token the check's own rebuild read a run's
        # engine from CHANGELOG.md where the build had read it from GitHub's run record, and the two words differed)
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          python docs/engine/check_live_engine.py | tee -a "$GITHUB_STEP_SUMMARY"
          python docs/engine/check_records.py --seed 3000 3001 3002 | tee -a "$GITHUB_STEP_SUMMARY"
          python docs/engine/build_live_engine.py --check | tee -a "$GITHUB_STEP_SUMMARY"
          # the page tests on the page about to be committed (6 November, the software seat: no workflow ran tests/test_live_*.py; a page
          # its stamp did not name, or whose script did not compile, could be committed)
          python -m unittest discover -v -s tests -p "test_live_*.py" -t . 2>&1 | tail -60 | tee -a "$GITHUB_STEP_SUMMARY"
          python docs/book/build_live_manual.py --check | tee -a "$GITHUB_STEP_SUMMARY"
          python tools/tour_script.py --check | tee -a "$GITHUB_STEP_SUMMARY"
          python tools/monograph_words.py --check | tee -a "$GITHUB_STEP_SUMMARY"
          python tools/claims_check.py --summary | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Legal notice checked, the page committed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python tools/legal.py --check > legal.txt || { tail -20 legal.txt; echo "::error::a page lacks the legal notice"; exit 1; }
          # every file the rebuild writes goes in with the page (the page, its appraisal, the wall's Grafana dashboard, the GitHub
          # ledger): on 24 October a file the rebuild had rewritten was left out, and every push attempt stopped on it ("cannot pull
          # with rebase: You have unstaged changes", run 40074924675)
          for f in docs/engine/OMNI_COMPASS_LIVE_ENGINE.html docs/engine/LIVE_ENGINE_VERSION.json docs/engine/APPRAISAL.md docs/engine/PAGE_WORD_FOR_WORD.md deploy/grafana/omni-compass-wall.json docs/engine/github_ledger.json docs/live/index.html docs/engine/tour README.md results/TWO_BILLS.md results/TWO_BILLS.json docs/WORK_PER_BILL.md results/WORK_PER_BILL.json results/OVERSIGHT.md results/OVERSIGHT.json results/SITE_NUMBERS.md results/SITE_NUMBERS.json docs/FAQ.md docs/engine/LIVE_ENGINE_MONOGRAPH.md docs/BENEFIT_SHEET.md results/BENEFIT_SHEET.json results/live/AZURE_RECORD.md results/live/AZURE_RECORD.json results/live/AZURE_RUNS.json; do
            [ -e "$f" ] && git add -- "$f"
          done
          git commit -q -m "Live benchmark engine rebuilt from the engine that stands and the repository's own results" || echo "::notice::the page is unchanged"
          git status --short --untracked-files=no | sed 's/^/::notice::left uncommitted by the rebuild (set aside at the push, never pushed): /'
      - name: Push, trying again if the branch moved meanwhile
        run: |
          # the page is generated: where a push that landed meanwhile touched it too (18 October: a merged pull request
          # changed it while this job pushed, and every attempt stopped on the same conflict), this rebuild's page is kept;
          # the next rebuild reads whatever landed
          for attempt in 1 2 3 4 5 6; do
            git pull -q --rebase --autostash -X theirs && git push && exit 0   # anything else the rebuild touched is set aside, never pushed
            git rebase --abort 2>/dev/null || true
            echo "::warning::push attempt $attempt failed (the branch moved); trying again"; sleep 15
          done
          echo "::error::the rebuilt page could not be pushed after six attempts"; exit 1
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
