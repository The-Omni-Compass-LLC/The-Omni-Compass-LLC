[databases]
bench = host=127.0.0.1 port=5432 dbname=bench user=bench password=bench

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6543
unix_socket_dir = out/pgbench-select/pgb
auth_type = trust
auth_file = out/pgbench-select/pgb/userlist.txt
admin_users = bench
pool_mode = transaction
default_pool_size = 20
max_client_conn = 1000
logfile = out/pgbench-select/pgb/pgbouncer.log
pidfile = out/pgbench-select/pgb/pgbouncer.pid
